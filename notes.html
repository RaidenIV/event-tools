<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Google Sheet Tool</title>
<style>
    .back-button {
        position: fixed;
        top: 10px;
        left: 50%; /* Set left to 50% of the viewport width */
        transform: translateX(-50%); /* Move it back by half its own width */
        background: #228B22;
        color: white;
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        z-index: 9999;
        width: auto !important;
        max-width: none !important;
        font-family: 'Arial', sans-serif;
    }
    .back-button:hover {
        background: #1e7a1e;
    }
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
    }
    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
</style>
</head>
<body>
    <iframe src="https://docs.google.com/document/d/1UYtajpL8TpTzFPt1cX54-k-i6x2e4fGTI97y1SNlcak/edit?usp=drive_link"></iframe>
    <!-- BACK TOOLS BUTTON (added) -->
    <button class="back-button" onclick="window.location.href='https://www.xodiamediagroup.com/tools'">⬅ Back to Tools</button>
</body>

</html>
