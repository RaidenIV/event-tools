<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; text-align: center; }
        h1 { font-family: 'Rajdhani', sans-serif; text-align: center; }

        /* BACK BUTTON (added) */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #228B22;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 9999;
            width: auto !important;
            max-width: none !important;
            font-family: 'Arial', sans-serif;
        }
        .back-button:hover {
            background: #1e7a1e;
        }

        .container { 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            max-width: 1200px; 
            margin: 0 auto; 
            gap: 40px; 
            flex-wrap: wrap; 
        }
        .form-container { 
            max-width: 600px; 
            font-family: 'Rajdhani', sans-serif; 
            text-align: left; 
            flex: 1; 
            min-width: 300px; 
            font-weight: bold;
        }
        label { display: block; margin-top: 10px; }
        input, textarea { 
            width: 100%; 
            padding: 8px; 
            margin-top: 5px; 
            box-sizing: border-box; 
            font-family: 'Rajdhani', sans-serif; 
            font-weight: bold;
        }
        button { 
            margin-top: 20px; 
            padding: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-family: 'Rajdhani', sans-serif; 
        }
        
        /* FIXED: Added word-wrap and overflow-wrap to prevent text overflow */
        .invoice-preview { 
            margin-top: 0; 
            padding: 20px; 
            border: 1px solid #ddd; 
            max-width: 600px; 
            background: white; 
            flex: 1; 
            min-width: 300px; 
            text-align: left; 
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .invoice-preview * { 
            box-sizing: border-box; 
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 20px; 
        }
        .logo img { width: 150px; height: auto; max-width: 100%; }
        .title { font-size: 20px; font-weight: bold; text-transform: uppercase; }
        .invoice-num { font-size: 14px; font-weight: bold; }
        
        /* FIXED: Added word-wrap to company section */
        .company { 
            font-size: 14px; 
            margin-bottom: 20px; 
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .info { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
        }
        
        /* FIXED: Added padding and word-wrap to info sections */
        .left { 
            flex: 1 1 50%; 
            max-width: 50%; 
            word-wrap: break-word;
            overflow-wrap: break-word;
            padding-right: 10px;
        }
        .right { 
            flex: 1 1 45%; 
            text-align: right; 
            max-width: 45%; 
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .label { font-weight: bold; }
        
        /* FIXED: Added word-wrap to balance section */
        .balance { 
            background: #f0f0f0; 
            padding: 10px; 
            text-align: right; 
            font-weight: bold; 
            margin-bottom: 20px; 
            border-radius: 4px; 
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        /* FIXED: Added table-layout and word-wrap to table */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-bottom: 20px; 
            table-layout: fixed;
        }
        th { 
            background: #333; 
            color: #fff; 
            padding: 8px; 
            text-align: left; 
            font-size: 12px; 
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        td { 
            padding: 8px; 
            border-bottom: 1px solid #ddd; 
            font-size: 12px; 
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            max-width: 0;
        }
        
        /* FIXED: Added word-wrap to totals section */
        .totals { 
            text-align: right; 
            font-size: 12px; 
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .totals div { margin-bottom: 5px; }
        .totals strong { font-weight: bold; }
        
        /* FIXED: Added white-space: pre-wrap for proper text wrapping in notes/terms */
        .notes, .terms { 
            margin-bottom: 20px; 
            font-size: 12px; 
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
        .notes strong, .terms strong { display: block; margin-bottom: 5px; }
        .terms { white-space: pre-wrap; }

        /* QR PAYMENT SECTION */
        .payment-qr-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            margin-top: 10px;
        }
        .qr-block {
            text-align: center;
            font-size: 11px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .qr-block img {
            width: 110px;
            height: 110px;
            display: block;
            margin: 0 auto 6px auto;
        }
        .qr-block .qr-label-main {
            font-weight: bold;
        }

        @media screen and (max-width: 768px) {
            .container { flex-direction: column; align-items: center; }
            .form-container, .invoice-preview { max-width: 100%; }
            .info { flex-direction: column; }
            .left, .right { 
                max-width: 100%; 
                text-align: left; 
                margin-bottom: 10px; 
                padding-right: 0;
            }
            .right { text-align: left; }
            .payment-qr-container {
                justify-content: flex-start;
            }
        }

        @media print {
            h1 { display: none; }
            .form-container, button { display: none; }
            .invoice-preview { 
                border: none; 
                margin: 0; 
                padding: 0; 
                max-width: 100%; 
            }
            .container { display: block; }
            .back-button { display: none; }
        }
    </style>
</head>
<body>
    <!-- BACK TOOLS BUTTON (added) -->
    <button class="back-button" onclick="window.location.href='https://www.xodiamediagroup.com/tools'">⬅ Back to Tools</button>

    <h1>Invoice Generator</h1>
    <div class="container">
        <div class="form-container">
            <form id="invoiceForm">
                <label>Invoice Number: <input type="text" id="invoice_number" value="INV-00XXX"></label>
                <label>Bill To: <input type="text" id="bill_to" value="Name/Organization"></label>
                <label>Date: <input type="date" id="date" value="Date"></label>
                <label>Payment Terms: <input type="text" id="payment_terms" value="Net X"></label>
                <label>Due Date: <input type="date" id="due_date" value="Date"></label>
                <label>Balance Due: <input type="text" id="balance_due" value=""></label>
                <label>Item: <input type="text" id="item" value=""></label>
                <label>Quantity: <input type="number" id="quantity" value="1"></label>
                <label>Rate: <input type="text" id="rate" value=""></label>
                <label>Amount: <input type="text" id="amount" value=""></label>
                <label>Subtotal: <input type="text" id="subtotal" value=""></label>
                <label>Tax: <input type="text" id="tax" value="0.00"></label>
                <label>Total: <input type="text" id="total" value=""></label>
                <label>Notes: 
                    <textarea id="notes">Description of service(s)</textarea>
                </label>
                <label>Terms: 
                    <textarea id="terms" rows="5">
Zelle: dante.e44@gmail.com [614-204-5395]
Memo: Event (MM-DD-YYYY)
Bank Transfer: [DANTE A EVANS, Routing Number: 267084131, Account Number: 868913039]
Cashapp: $XodiaMG (or scan QR code)
Venmo: @raidenlabs (or scan QR code)</textarea>
                </label>
                <button type="button" onclick="printInvoice()">Print/Save as PDF</button>
            </form>
        </div>
        <div class="invoice-preview" id="invoicePreview"></div>
    </div>

    <script>
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function generateInvoice() {
            const data = {
                invoice_number: document.getElementById('invoice_number').value,
                bill_to: document.getElementById('bill_to').value,
                date: formatDate(document.getElementById('date').value),
                payment_terms: document.getElementById('payment_terms').value,
                due_date: formatDate(document.getElementById('due_date').value),
                balance_due: document.getElementById('balance_due').value,
                item: document.getElementById('item').value,
                quantity: document.getElementById('quantity').value,
                rate: document.getElementById('rate').value,
                amount: document.getElementById('amount').value,
                subtotal: document.getElementById('subtotal').value,
                tax: document.getElementById('tax').value,
                total: document.getElementById('total').value,
                notes: document.getElementById('notes').value,
                terms: document.getElementById('terms').value
            };

            const html = `
                <div class="header">
                    <div class="logo">
                        <img src="">
                    </div>
                    <div class="title">INVOICE</div>
                    <div class="invoice-num"># ${data.invoice_number}</div>
                </div>
                <div class="company">XODIA Media Group LLC</div>
                <div class="info">
                    <div class="left">
                        <div class="label">Bill To:</div>
                        ${data.bill_to}
                    </div>
                    <div class="right">
                        <div><span class="label">Date:</span> ${data.date}</div>
                        <div><span class="label">Payment Terms:</span> ${data.payment_terms}</div>
                        <div><span class="label">Due Date:</span> ${data.due_date}</div>
                    </div>
                </div>
                <div class="balance">Balance Due: $${data.balance_due}</div>
                <table>
                    <tr>
                        <th>Item</th>
                        <th>Quantity</th>
                        <th>Rate</th>
                        <th>Amount</th>
                    </tr>
                    <tr>
                        <td>${data.item}</td>
                        <td>${data.quantity}</td>
                        <td>$${data.rate}</td>
                        <td>$${data.amount}</td>
                    </tr>
                </table>
                <div class="totals">
                    <div>Subtotal: $${data.subtotal}</div>
                    <div>Tax (0%): $${data.tax}</div>
                    <div><strong>Total:</strong> $${data.total}</div>
                </div>
                <div class="notes">
                    <strong>Notes:</strong>
                    ${data.notes}
                </div>
                <div class="terms">
                    <strong>Terms:</strong>
                    ${data.terms}
                </div>
                <div class="payment-qr-container">
                    <div class="qr-block">
                        <span class="qr-label-main">Cash App</span><br>
                        <span>$XodiaMG</span>
                        <img 
                            src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=https%3A%2F%2Fcash.app%2F%24XodiaMG" 
                            alt="Cash App $XodiaMG QR Code">
                    </div>
                    <div class="qr-block">
                        <span class="qr-label-main">Venmo</span><br>
                        <span>@raidenlabs</span>
                        <img 
                            src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=https%3A%2F%2Fvenmo.com%2Fraidenlabs" 
                            alt="Venmo @raidenlabs QR Code">
                    </div>
                </div>
            `;
            document.getElementById('invoicePreview').innerHTML = html;
        }

        function printInvoice() {
            window.print();
        }
        // Add event listeners to all form inputs for real-time updates
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('#invoiceForm input, #invoiceForm textarea');
            inputs.forEach(input => {
                input.addEventListener('input', generateInvoice);
                input.addEventListener('change', generateInvoice);
            });
        });
        
        // Also trigger on any input/change event (backup in case DOM isn't fully loaded)
        const allInputs = document.querySelectorAll('#invoiceForm input, #invoiceForm textarea');
        allInputs.forEach(input => {
            input.addEventListener('input', generateInvoice);
            input.addEventListener('change', generateInvoice);
        });

        // Auto-generate preview on load
        generateInvoice();
    </script>
</body>
</html>
