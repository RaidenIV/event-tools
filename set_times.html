<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Set Time Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<!-- Theme bootstrap: default DARK, persist in localStorage -->
<script>
(function () {
    try {
        var saved = localStorage.getItem('xmg_theme');
        var theme = saved || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
})();
</script>

<style>
    :root {
        --accent: #0099ff;
        --accent2: #00ffff;
        --success: #228B22;
        --danger: #d13b3b;
        --radius: 12px;
        --shadow: 0 10px 30px rgba(0,0,0,0.18);

        --line: #2a2a2f;
        --button-bg: #1b1b20;
        --button-hover: #22222a;

        /* Shared top UI height for menu button */
        --top-ui-height: 48px;

        /* Fixed column card height (prevents growth when DJ count increases) */
        --col-card-height: 700px;
    }

    html[data-theme="light"] {
        --bg: #ffffff;
        --text: #111111;
        --muted: rgba(0,0,0,0.65);
        --panel: #fafafa;
        --panel-2: #ffffff;
        --border: rgba(0,0,0,0.10);
        --border-2: rgba(0,0,0,0.08);
        --input-bg: #ffffff;
        --input-text: #111111;
        --chip: rgba(0,0,0,0.06);
        --chip-text: rgba(0,0,0,0.72);
    }

    html[data-theme="dark"] {
        --bg: #0b0b0c;
        --text: #f2f2f4;
        --muted: #a7a7ad;
        --panel: #131316;
        --panel-2: #0f0f12;
        --border: #2a2a2f;
        --border-2: #2a2a2f;
        --input-bg: #0f0f12;
        --input-text: #f2f2f4;
        --chip: rgba(255,255,255,0.08);
        --chip-text: rgba(255,255,255,0.78);
    }

    * {
        box-sizing: border-box;
        font-family: 'Rajdhani', sans-serif;
    }

    body {
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 30px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
    }

    /* ======= MENU NAV (from events_menu_v7.html) ======= */
    .nav-dropdown {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10000;
    }

    .nav-toggle {
        background: rgba(26, 26, 26, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        height: var(--top-ui-height);
        padding: 0 16px;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    html[data-theme="light"] .nav-toggle {
        background: rgba(245, 245, 245, 0.92);
        border: 1px solid rgba(0, 0, 0, 0.18);
        color: rgba(0,0,0,0.88);
    }

    .nav-toggle:hover {
        background: rgba(36, 36, 36, 0.9);
        border-color: var(--accent);
    }

    html[data-theme="light"] .nav-toggle:hover {
        background: rgba(235, 235, 235, 0.95);
        border-color: var(--accent);
    }

    .nav-menu {
        position: absolute;
        top: 60px;
        left: 0;
        background: rgba(26, 26, 26, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 8px;
        min-width: 180px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    html[data-theme="light"] .nav-menu {
        background: rgba(245, 245, 245, 0.96);
        border: 1px solid rgba(0, 0, 0, 0.16);
    }

    .nav-dropdown.active .nav-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    .nav-menu a,
    .nav-menu button.nav-item-btn {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px 16px;
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        border-radius: 8px;
        transition: all 0.3s ease;
        background: transparent;
        border: none;
        cursor: pointer;
    }

    html[data-theme="light"] .nav-menu a,
    html[data-theme="light"] .nav-menu button.nav-item-btn {
        color: rgba(0,0,0,0.75);
    }

    .nav-menu a:hover,
    .nav-menu button.nav-item-btn:hover {
        background: rgba(0, 153, 255, 0.12);
        color: var(--accent);
    }

    /* ======= APP UI ======= */
    .panel {
        background: var(--panel);
        padding: 20px;
        border-radius: 14px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 1400px;
    }

    /* 3-COLUMN LAYOUT INSIDE MAIN CARD */
    .panel-grid{
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
        align-items: stretch;
        margin-top: 10px;
    }

    .panel-grid .col{
        min-width: 0;
        display: flex;
    }

    /* Keep headings tight inside columns */
    .panel-grid h2{
        margin-top: 0;
    }

    @media (max-width: 1100px){
        .panel-grid{
            grid-template-columns: 1fr;
        }
        .col-card{
            height: auto;
        }
        #djNamesContainer.dj-list,
        #results,
        .preview-box{
            overflow: visible;
        }
    }


    h1 {
        text-align: center;
        margin: 10px 0 20px 0;
        letter-spacing: 0.5px;
    }

    /* ---------- PANEL HEADER (title left, logo right) ---------- */
    .panel-header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:16px;
        margin: -10px 0 18px 0;
    }
    .panel-header h1{
        text-align:left;
        margin:0;
    }
    .panel-logo{
        height: 44px;
        width: auto;
        max-width: 45%;
        object-fit: contain;
        flex: 0 0 auto;
        display:block;
        pointer-events:none;
        user-select:none;
    }

    .panel-titlewrap{
        display:flex;
        flex-direction:column;
        gap: 4px;
        min-width: 0;
    }
    .panel-subtitle{
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        line-height: 1.2;
    }

    /* Each column gets its own card */
    .col-card{
        flex: 1;
        background: var(--panel-2);
        border: 1px solid var(--border-2);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 8px 22px rgba(0,0,0,0.14);
        height: var(--col-card-height);
        min-width: 0;
        min-height: 0; /* enables child overflow areas */
    }

    /* Ensure all column card content starts at the same height */
    .col-card h2{ margin-top: 0; }
    .col-card .preview-label{ margin-top: 0; }


    h2 {
        margin: 18px 0 10px 0;
        font-size: 18px;
    }

    label {
        display: block;
        font-weight: 700;
        margin-top: 10px;
        font-size: 14px;
        color: var(--muted);
    }

    input[type="text"], input[type="time"], input[type="number"], select {
        padding: 10px;
        margin-top: 6px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        width: 50%;
        background: var(--input-bg);
        color: var(--input-text);
        font-family: 'Rajdhani', sans-serif;
        outline: none;
    }

    input[type="text"]::placeholder,
    input[type="number"]::placeholder {
        color: rgba(255,255,255,0.45);
    }

    html[data-theme="light"] input[type="text"]::placeholder,
    html[data-theme="light"] input[type="number"]::placeholder {
        color: rgba(0,0,0,0.45);
    }

    input[type="text"]:focus,
    input[type="time"]:focus,
    input[type="number"]:focus,
    select:focus {
        border-color: rgba(0,153,255,0.75);
        box-shadow: 0 0 0 3px rgba(0,153,255,0.18);
    }

    .time-small {
        width: 120px !important;
    }

    /* Time input clock icon: force WHITE in dark mode by drawing our own icon
       (hides native indicator because some browsers ignore filter on time inputs). */
    html[data-theme="dark"] {
        color-scheme: dark;
    }
    html[data-theme="light"] {
        color-scheme: light;
    }

    html[data-theme="dark"] input[type="time"] {
        color-scheme: dark;
        padding-right: 38px;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>');
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 18px 18px;
    }

    /* Hide native picker icon so our white clock is the visible one */
    html[data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator {
        opacity: 0;
        display: block;
    }

    /* Keep native icon in light mode */
    html[data-theme="light"] input[type="time"] {
        color-scheme: light;
        background-image: none;
        padding-right: 10px;
    }

    .row {
        display: flex;
        gap: 12px;
        margin-top: 12px;
    }

    #presetSelect {
        width: 180px !important;
        padding-right: 30px;
        background-position: right 10px center !important;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;

        /* Keep the custom arrow */
        background-image: url('data:image/svg+xml;utf8,<svg fill="%23ffffff" height="20" width="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><polygon points="5,7 15,7 10,12" /></svg>');
        background-repeat: no-repeat;
    }

    /* Ensure preset dropdown is DARK in dark theme (incl. opened list) */
    html[data-theme="dark"] #presetSelect{
        background-color: var(--input-bg);
        color: var(--input-text);
        border-color: var(--border);
    }
    html[data-theme="dark"] #presetSelect option{
        background-color: #0f0f12; /* deterministic dark list background */
        color: rgba(255,255,255,0.92);
    }

    /* Light theme defaults */
    html[data-theme="light"] #presetSelect{
        background-color: var(--input-bg);
        color: var(--input-text);
        border-color: var(--border);
    }
    html[data-theme="light"] #presetSelect option{
        background-color: #ffffff;
        color: #111111;
    }.dj-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
    }

    /* Prevent card growth: scroll within content areas */
    #djNamesContainer.dj-list{
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding-right: 4px;
    }

    #results{
        flex: 1;
        min-height: 0;
        overflow: auto;
    }

    .preview-box{
        overflow: auto;
        min-height: 0;
    }

    .dj-item {
        display: flex;
        align-items: center;
        padding: 8px;
        background: var(--panel-2);
        border-radius: 10px;
        border: 1px solid var(--border-2);
        gap: 10px;
        padding-top: 15px;
    }

    .drag-handle {
        padding: 6px 10px;
        background: var(--chip);
        border-radius: 8px;
        cursor: grab;
        font-weight: 800;
        color: var(--chip-text);
        user-select: none;
    }

    .dj-item input.name {
        width: 120px;
        flex: initial;
        border: none;
        background: transparent;
        font-size: 15px;
        font-weight: 800;
        padding: 6px 0;
    }

    .dj-item input.name:focus {
        outline: none;
        box-shadow: none;
    }

    button.primary {
        background: var(--success);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 800;
        font-family: 'Rajdhani', sans-serif;
    }

    button.primary:hover {
        filter: brightness(0.95);
    }

    button.ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--accent);
        padding: 10px 16px;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
    }

    button.danger {
        background: var(--danger);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 800;
        font-family: 'Rajdhani', sans-serif;
    }

    button.danger:hover {
        filter: brightness(0.95);
    }

    /* Actions pinned to bottom of column cards */
    .actions-row{
        margin-top: auto;     /* pin buttons to bottom of the card */
        padding-top: 10px;    /* match button-to-button spacing */
        display: flex;
        gap: 10px;
    }

    .result-row {
        display: flex;
        flex-direction: column;
        background: transparent;
        border: none;
        padding: 10px 0;
        border-bottom: 1px solid var(--border-2);
        margin-bottom: 0;
        gap: 6px;
    }

    .result-row:last-child {
        border-bottom: none;
    }

    #results {
        background: var(--panel-2);
        border: 1px solid var(--border-2);
        padding: 10px;
        border-radius: 12px;
        margin-top: 10px;
    }

    .result-row input.inline {
        width: 130px;
        padding: 8px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--input-text);
        font-family: 'Rajdhani', sans-serif;
        font-weight: 800;
    }

    /* PREVIEW BOX */
    .preview-label {
        margin-top: 18px;
        font-size: 14px;
        font-weight: 800;
        color: var(--muted);
    }

    .preview-box {
        margin-top: 6px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
                flex: 1;
font-size: 16px;
        font-weight: 800;
        white-space: pre-line;
        min-height: 60px;
        color: var(--text);
    }

    @media (max-width: 768px) {
        :root {
            --top-ui-height: 44px;
        }
        body {
            padding: 18px;
        }
        .panel {
            max-width: 520px;
        }
    }

    @media (max-width: 480px) {
        :root {
            --top-ui-height: 42px;
        }
        body {
            padding: 14px;
        }
    }
</style>
</head>
<body>

<!-- Navigation Dropdown -->
<div class="nav-dropdown" id="navDropdown">
  <button class="nav-toggle" id="navToggle">
   Menu
  </button>

  </div>
 </div>

<div class="panel">

    <div class="panel-header">
        <div class="panel-titlewrap">
            <h1>Set Time Generator</h1>
            <div class="panel-subtitle">Generates set times for easy editing, copying, and pasting</div>
        </div>
        <img class="panel-logo" src="https://images.squarespace-cdn.com/content/v1/681ea18dd168a935c26295bd/c311da3d-6fbf-446a-858c-227fa011e7e3/Xodia+MEDIA+Group+%28TRANS%29+%281%29+%281%29.png?format=750w" alt="XODIA Media Group Logo">
    </div>

        <div class="panel-grid">

                <div class="col-card">
                <h2>Show Information</h2>
        <div class="row">
            <div style="flex:1;">
                <label>Number of DJs</label>
                <input id="djCount" type="number" min="1" value="6">
            </div>

                <label>Presets</label>
                <select id="presetSelect">
                    <option value="">None</option>
                    <option value="newstandard">New Standard</option>
                    <option value="legacy">Legacy</option>
                    <option value="latestart">Late Start (9PM)</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div style="flex:1;">
                <label>Show Start Time</label>
                <input id="startTime" type="time" value="20:00" class="time-small">
            </div>
            <div style="flex:1;">
                <label>Show End Time</label>
                <input id="endTime" type="time" value="02:00" class="time-small">
            </div>
        </div>

        <label style="margin-top:12px;">DJ Lineup (edit names & drag to reorder)</label>
        <div id="djNamesContainer" class="dj-list"></div>
                </div>

                <div class="col-card">
                <h2>Edit Schedule</h2>
        <div id="results"></div>
                </div>
            </div>

                <div class="col-card">
    <h2>Schedule Preview</h2>
        <div id="previewBox" class="preview-box">Schedule preview will appear here.</div>

        <div class="actions-row">
            <button id="copyBtnBottom" class="primary">Copy</button>
            <button id="resetBtn" class="danger">Reset</button>
        </div>
                </div>
            </div>

</div>

<script>
/* ======= NAV DROPDOWN (from events_menu_v7.html) ======= */
const navDropdown = document.getElementById('navDropdown');
const navToggle = document.getElementById('navToggle');

navToggle.addEventListener('click', function (e) {
    e.stopPropagation();
    navDropdown.classList.toggle('active');
});

document.addEventListener('click', function (e) {
    if (!navDropdown.contains(e.target)) {
        navDropdown.classList.remove('active');
    }
});

const navLinks = document.querySelectorAll('.nav-menu a');
navLinks.forEach(link => {
    link.addEventListener('click', function () {
        navDropdown.classList.remove('active');
    });
});

/* ======= DARK MODE (default) ======= */
// Theme toggle removed per request. Default remains dark via bootstrap script in <head>.

/* ---------- TIME HELPERS ---------- */
function hhmmToMin(t){ let[p,q]=t.split(":").map(Number); return p*60+q; }
function minToDisplay(m){
    m=((m%1440)+1440)%1440;
    let h=Math.floor(m/60), mm=m%60;
    h=(h%12)||12;
    return `${h}:${String(mm).padStart(2,'0')}`;
}
function parseDisplay(s){
    let m=s.match(/(\d{1,2}):(\d{2}) ?(AM|PM)?/i);
    if(!m)return null;
    let h=+m[1], mm=+m[2], ap=(m[3]||"AM").toUpperCase();
    if(ap==="AM"&&h===12)h=0;
    if(ap==="PM"&&h!==12)h+=12;
    return h*60+mm;
}

/* ---------- PRESETS ---------- */
const presets = {
    newstandard: {
        count: 7,
        start: "20:00",
        end: "02:00",
        slotDurations: [45,45,45,45,45,60,60,15]
    },
    legacy: {
        count: 7,
        start: "20:00",
        end: "02:00",
        slotDurations: [45,45,45,45,45,45,60,30]
    },
    latestart: {
        count: 6,
        start: "21:00",
        end: "02:00",
        slotDurations: [45,45,45,45,45,60,15]
    }
};

let currentPreset = null;

/* ---------- DOM ---------- */
const container=document.getElementById("djNamesContainer");
const djCountEl=document.getElementById("djCount");
const startEl=document.getElementById("startTime");
const endEl=document.getElementById("endTime");
const resultsEl=document.getElementById("results");
const presetSelect=document.getElementById("presetSelect");
const previewBox=document.getElementById("previewBox");

let sortable;

/* ---------- SCHEDULE TEXT + PREVIEW ---------- */
function scheduleToText(rows){
    if(!rows || !rows.length) return "";
    const schedule = rows.map(r =>
        `${minToDisplay(r.start)}-${minToDisplay(r.end)}: ${r.label}`
    ).join("\n");
    return `SET TIMES:\n${schedule}`;
}

function updatePreview(){
    const rows = resultsEl._rows || [];
    const text = scheduleToText(rows);
    previewBox.textContent = text || "Schedule preview will appear here.";
}

/* ---------- BUILD DJ INPUTS ---------- */
function buildDJInputs(){
    let count=+djCountEl.value;
    let existing=[...container.querySelectorAll("input.name")].map(i=>i.value);

    container.innerHTML="";

    for(let i=0;i<count;i++){
        let name=existing[i] || `DJ ${i+1}`;
        let row=document.createElement("div");
        row.className="dj-item";

        row.innerHTML=`
            <div class="drag-handle">☰</div>
            <input class="name" type="text" value="${name}">
        `;

        container.appendChild(row);

        let inp=row.querySelector("input.name");
        inp.onfocus=()=>inp.select();
        inp.oninput=calculate;
    }

    if(sortable) sortable.destroy();

    sortable = Sortable.create(container,{
        handle:".drag-handle",
        animation:150,
        onEnd(){ calculate(); }
    });
}

/* ---------- SYNC TIMES ---------- */
function syncTimes(idx, type, value){
    let rows = resultsEl._rows;
    if(!rows) return;

    let t = parseDisplay(value);
    if(t == null) return;

    let row = rows[idx];

    if(type === "start"){
        row.start = t;
        row.dur = row.end - row.start;

        if(idx > 0){
            rows[idx-1].end = t;
            rows[idx-1].dur = rows[idx-1].end - rows[idx-1].start;
        }
    } else if(type === "end"){
        row.end = t;
        row.dur = row.end - row.start;

        if(idx < rows.length - 1){
            rows[idx+1].start = t;
            rows[idx+1].dur = rows[idx+1].end - rows[idx+1].start;
        }
    }

    renderTimesOnly();
    updatePreview();
}

/* ---------- RENDER TIMES ONLY ---------- */
function renderTimesOnly(){
    let rows = resultsEl._rows;
    if(!rows) return;

    [...resultsEl.querySelectorAll("input.inline")].forEach(inp => {
        let idx = +inp.dataset.idx;
        let type = inp.dataset.type;
        let row = rows[idx];

        if(type === "start"){
            inp.value = minToDisplay(row.start);
        } else if(type === "end"){
            inp.value = minToDisplay(row.end);
        }
    });
}

/* ---------- CALCULATE ---------- */
function calculate(){
    let names=[...container.querySelectorAll("input.name")].map(i=>i.value.trim()||"DJ");

    let start=hhmmToMin(startEl.value);
    let end=hhmmToMin(endEl.value);
    if(end<=start)end+=1440;

    let rows=[];

    if(currentPreset && presets[currentPreset]){
        const p = presets[currentPreset];
        let cur = start;

        p.slotDurations.forEach((dur, i)=>{
            rows.push({
                label: i === p.slotDurations.length-1 ? "B2B" : names[i] || `DJ ${i+1}`,
                start: cur,
                end: cur + dur,
                dur: dur,
                isB2B: i === p.slotDurations.length-1
            });
            cur += dur;
        });
    }
    else {
        const total=end-start;
        let count=names.length;

        let per = Math.floor((total/count)/5)*5;
        if(per<5) per=5;

        let used = per * count;
        let leftover = total - used;

        let cur = start;

        names.forEach(name=>{
            rows.push({
                label:name,
                start:cur,
                end:cur+per,
                dur:per,
                isB2B:false
            });
            cur += per;
        });

        if(leftover>0){
            rows.push({
                label:"B2B",
                start:cur,
                end:cur+leftover,
                dur:leftover,
                isB2B:true
            });
        }
    }

    render(rows);
}

/* ---------- RENDER ---------- */
function render(rows){
    resultsEl.innerHTML="";

    rows.forEach((r,i)=>{
        let div=document.createElement("div");
        div.className="result-row";

        let nameBlock=document.createElement("div");
        nameBlock.style.fontWeight="800";

        if(r.isB2B){
            let nameInput=document.createElement("input");
            nameInput.className="inline";
            nameInput.dataset.idx=i;
            nameInput.dataset.type="name";
            nameInput.value=r.label;
            nameBlock.appendChild(nameInput);
        } else {
            nameBlock.textContent=r.label;
        }

        let timeRow=document.createElement("div");
        timeRow.style.display="flex";
        timeRow.style.gap="8px";
        timeRow.style.alignItems="center";

        let s=document.createElement("input");
        s.className="inline";
        s.dataset.idx=i;
        s.dataset.type="start";
        s.value=minToDisplay(r.start);

        let e=document.createElement("input");
        e.className="inline";
        e.dataset.idx=i;
        e.dataset.type="end";
        e.value=minToDisplay(r.end);

        s.oninput = () => syncTimes(i, 'start', s.value);
        e.oninput = () => syncTimes(i, 'end', e.value);

        timeRow.appendChild(s);
        timeRow.appendChild(document.createTextNode("-"));
        timeRow.appendChild(e);

        div.appendChild(nameBlock);
        div.appendChild(timeRow);

        resultsEl.appendChild(div);
    });

    resultsEl._rows = rows;
    updatePreview();
}

/* ---------- COPY ---------- */
function copySchedule(){
    let rows=resultsEl._rows||[];
    let text = scheduleToText(rows);
    navigator.clipboard.writeText(text);
}

/* ---------- RESET ---------- */
document.getElementById("resetBtn").onclick=()=>{
    resultsEl.innerHTML="";
    resultsEl._rows=[];
    updatePreview();
};

/* ---------- BUTTON WIRING ---------- */
document.getElementById("copyBtnBottom").onclick = copySchedule;

/* ---------- INPUT WATCHERS ---------- */
djCountEl.oninput = ()=>{
    currentPreset=null;
    presetSelect.value="";
    buildDJInputs();
    calculate();
};

startEl.oninput = ()=>{ currentPreset=null; presetSelect.value=""; calculate(); };
endEl.oninput   = ()=>{ currentPreset=null; presetSelect.value=""; calculate(); };

presetSelect.onchange = ()=>{
    const key=presetSelect.value;
    currentPreset=key||null;
    const p=presets[key];

    if(p){
        djCountEl.value=p.count;
        startEl.value=p.start;
        endEl.value=p.end;
        buildDJInputs();
    }
    calculate();
};

/* ---------- INIT ---------- */
buildDJInputs();
calculate();
</script>
