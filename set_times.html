<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Set Time Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<style>
    body {
        font-family: 'Rajdhani', sans-serif;
        background: #ffffff;
        color: #111;
        margin: 0;
        padding: 30px;
        display: flex;
        justify-content: center;
    }

    .back-button {
        position: fixed;
        top: 18px;
        left: 18px;
        background: #228B22;
        color: #fff;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        z-index: 9999;
        font-weight: 700;
    }

    .panel {
        background: #fafafa;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        width: 100%;
        max-width: 450px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-weight: 700;
        margin-top: 10px;
        font-size: 14px;
    }

    input[type="text"], input[type="time"], input[type="number"], select {
        padding: 10px;
        margin-top: 6px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        width: 50%;
        font-family: 'Rajdhani';
    }

    .time-small {
        width: 120px !important;
    }

    .row {
        display: flex;
        gap: 12px;
        margin-top: 12px;
    }

    #presetSelect {
        width: 150px !important;   /* Or any width you prefer */
    }

    .dj-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
    }

    .dj-item {
        display: flex;
        align-items: center;
        padding: 8px;
        background: #fff;
        border-radius: 8px;
        border: 1px solid #eee;
        gap: 10px;
    }

    .drag-handle {
        padding: 6px 10px;
        background: #f2f2f2;
        border-radius: 6px;
        cursor: grab;
        font-weight: 700;
        color: #444;
    }

    .dj-item input.name {
        width: 120px;   /* Adjust size as needed */
        flex: initial;  /* Disable flex expansion */
        border: none;
        background: transparent;
        font-size: 15px;
        font-weight: 700;
    }

    #presetSelect {
        width: 180px !important;
        padding-right: 30px; /* ensures text doesn't overlap arrow */

        /* Move the dropdown arrow left */
        background-position: right 10px center !important;

        /* Required for custom arrow alignment on some browsers */
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;

        background-image: url('data:image/svg+xml;utf8,<svg fill="%23228B22" height="20" width="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><polygon points="5,7 15,7 10,12" /></svg>');
        background-repeat: no-repeat;
    }

    button.primary {
        background: #228B22;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        font-family: 'Rajdhani';
    }

    button.primary:hover {
        background: #1d701d;
    }

    button.ghost {
        background: white;
        border: 1px solid #ddd;
        color: #228B22;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
    }

    button.danger {
        background: #dc3545;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        font-family: 'Rajdhani';
    }

    button.danger:hover {
        background: #c82333;
    }

    .result-row {
        display: flex;
        flex-direction: column;
        background: transparent;
        border: none;
        padding: 8px 0;
        border-bottom: 1px solid #eee;
        margin-bottom: 0;
        gap: 4px;
    }

    .result-row:last-child {
        border-bottom: none;
    }

    #results {
        background: #fff;
        border: 1px solid #eee;
        padding: 10px;
        border-radius: 8px;
        margin-top: 10px;
    }

    .result-row input.inline {
        width: 130px;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #ddd;
        font-family: 'Rajdhani';
        font-weight: bold;
    }

    /* PREVIEW BOX */
    .preview-label {
        margin-top: 18px;
        font-size: 14px;
        font-weight: 700;
    }

    .preview-box {
        margin-top: 6px;
        background: #ffffff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px;
        font-size: 16px;
        font-weight: 700;
        white-space: pre-line;
        min-height: 60px;
    }
</style>
</head>
<body>
    <button class="back-button" onclick="window.location.href='https://www.xodiamediagroup.com/tools'">⬅ Back to Tools</button>

<div class="panel">

    <h1>Set Time Calculator</h1>

    <div class="row">
        <div style="flex:1;">
            <label># of DJs?</label>
            <input id="djCount" type="number" min="1" value="6">
        </div>

        <div style="flex:1;">
            <label>Presets</label>
            <select id="presetSelect">
                <option value="">None</option>
                <option value="newstandard">New Standard</option>
                <option value="legacy">Legacy</option>
                <option value="latestart">Late Start (9PM)</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div style="flex:1;">
            <label>Show Start Time</label>
            <input id="startTime" type="time" value="20:00" class="time-small">
        </div>
        <div style="flex:1;">
            <label>Show End Time</label>
            <input id="endTime" type="time" value="02:00" class="time-small">
        </div>
    </div>

    <label style="margin-top:12px;">DJ Lineup (drag to reorder)</label>
    <div id="djNamesContainer" class="dj-list"></div>

    <h2 style="margin-top:20px; font-size:18px;">Edit Schedule</h2>
    <div id="results"></div>

    <!-- LIVE PREVIEW BOX -->
    <div class="preview-label" style="margin-top:18px;">Schedule Preview</div>
    <div id="previewBox" class="preview-box">Schedule preview will appear here.</div>

    <div style="margin-top:15px; display:flex; gap:10px;">
        <button id="copyBtnBottom" class="primary">Copy</button>
        <button id="resetBtn" class="danger">Reset</button>
    </div>

</div>

<script>
/* ---------- TIME HELPERS ---------- */
function hhmmToMin(t){ let[p,q]=t.split(":").map(Number); return p*60+q; }
function minToDisplay(m){
    m=((m%1440)+1440)%1440;
    let h=Math.floor(m/60), mm=m%60;
    h=(h%12)||12;
    return `${h}:${String(mm).padStart(2,'0')}`;
}
function parseDisplay(s){
    let m=s.match(/(\d{1,2}):(\d{2}) ?(AM|PM)?/i);
    if(!m)return null;
    let h=+m[1], mm=+m[2], ap=(m[3]||"AM").toUpperCase();
    if(ap==="AM"&&h===12)h=0;
    if(ap==="PM"&&h!==12)h+=12;
    return h*60+mm;
}

/* ---------- PRESETS ---------- */
const presets = {
    newstandard: {
        count: 7,
        start: "20:00",
        end: "02:00",
        slotDurations: [45,45,45,45,45,60,60,15]
    },
    legacy: {
        count: 7,
        start: "20:00",
        end: "02:00",
        slotDurations: [45,45,45,45,45,45,60,30]
    },
    latestart: {
        count: 6,
        start: "21:00",
        end: "02:00",
        slotDurations: [45,45,45,45,45,60,15]
    }
};

let currentPreset = null;

/* ---------- DOM ---------- */
const container=document.getElementById("djNamesContainer");
const djCountEl=document.getElementById("djCount");
const startEl=document.getElementById("startTime");
const endEl=document.getElementById("endTime");
const resultsEl=document.getElementById("results");
const presetSelect=document.getElementById("presetSelect");
const previewBox=document.getElementById("previewBox");

let sortable;

/* ---------- SCHEDULE TEXT + PREVIEW ---------- */
function scheduleToText(rows){
    if(!rows || !rows.length) return "";
    const schedule = rows.map(r =>
        `${minToDisplay(r.start)}-${minToDisplay(r.end)}: ${r.label}`
    ).join("\n");
    return `SET TIMES:\n${schedule}`;
}

function updatePreview(){
    const rows = resultsEl._rows || [];
    const text = scheduleToText(rows);
    previewBox.textContent = text || "Schedule preview will appear here.";
}

/* ---------- BUILD DJ INPUTS ---------- */
function buildDJInputs(){
    let count=+djCountEl.value;
    let existing=[...container.querySelectorAll("input.name")].map(i=>i.value);

    container.innerHTML="";

    for(let i=0;i<count;i++){
        let name=existing[i] || `DJ ${i+1}`;
        let row=document.createElement("div");
        row.className="dj-item";

        row.innerHTML=`
            <div class="drag-handle">☰</div>
            <input class="name" type="text" value="${name}">
        `;

        container.appendChild(row);

        let inp=row.querySelector("input.name");
        inp.onfocus=()=>inp.select();
        inp.oninput=calculate;
    }

    if(sortable) sortable.destroy();

    sortable = Sortable.create(container,{
        handle:".drag-handle",
        animation:150,
        onEnd(){ calculate(); }
    });
}

/* ---------- SYNC TIMES ---------- */
function syncTimes(idx, type, value){
    let rows = resultsEl._rows;
    if(!rows) return;

    let t = parseDisplay(value);
    if(t == null) return;

    let row = rows[idx];

    if(type === "start"){
        row.start = t;
        row.dur = row.end - row.start;
        
        // Update previous slot's end time
        if(idx > 0){
            rows[idx-1].end = t;
            rows[idx-1].dur = rows[idx-1].end - rows[idx-1].start;
        }
    } else if(type === "end"){
        row.end = t;
        row.dur = row.end - row.start;
        
        // Update next slot's start time
        if(idx < rows.length - 1){
            rows[idx+1].start = t;
            rows[idx+1].dur = rows[idx+1].end - rows[idx+1].start;
        }
    }

    // Re-render to show updated times
    renderTimesOnly();
    updatePreview();
}

/* ---------- RENDER TIMES ONLY ---------- */
function renderTimesOnly(){
    let rows = resultsEl._rows;
    if(!rows) return;

    [...resultsEl.querySelectorAll("input.inline")].forEach(inp => {
        let idx = +inp.dataset.idx;
        let type = inp.dataset.type;
        let row = rows[idx];

        if(type === "start"){
            inp.value = minToDisplay(row.start);
        } else if(type === "end"){
            inp.value = minToDisplay(row.end);
        }
    });
}

/* ---------- CALCULATE ---------- */
function calculate(){
    let names=[...container.querySelectorAll("input.name")].map(i=>i.value.trim()||"DJ");

    let start=hhmmToMin(startEl.value);
    let end=hhmmToMin(endEl.value);
    if(end<=start)end+=1440;

    let rows=[];

    if(currentPreset && presets[currentPreset]){
        const p = presets[currentPreset];
        let cur = start;

        p.slotDurations.forEach((dur, i)=>{
            rows.push({
                label: i === p.slotDurations.length-1 ? "B2B" : names[i] || `DJ ${i+1}`,
                start: cur,
                end: cur + dur,
                dur: dur,
                isB2B: i === p.slotDurations.length-1
            });
            cur += dur;
        });
    }
    else {
        const total=end-start;
        let count=names.length;

        let per = Math.floor((total/count)/5)*5;
        if(per<5) per=5;

        let used = per * count;
        let leftover = total - used;

        let cur = start;

        names.forEach(name=>{
            rows.push({
                label:name,
                start:cur,
                end:cur+per,
                dur:per,
                isB2B:false
            });
            cur += per;
        });

        if(leftover>0){
            rows.push({
                label:"B2B",
                start:cur,
                end:cur+leftover,
                dur:leftover,
                isB2B:true
            });
        }
    }

    render(rows);
}

/* ---------- RENDER ---------- */
function render(rows){
    resultsEl.innerHTML="";

    rows.forEach((r,i)=>{
        let div=document.createElement("div");
        div.className="result-row";

        let nameBlock=document.createElement("div");
        nameBlock.style.fontWeight="700";

        if(r.isB2B){
            let nameInput=document.createElement("input");
            nameInput.className="inline";
            nameInput.dataset.idx=i;
            nameInput.dataset.type="name";
            nameInput.value=r.label;
            nameBlock.appendChild(nameInput);
        } else {
            nameBlock.textContent=r.label;
        }

        let timeRow=document.createElement("div");
        timeRow.style.display="flex";
        timeRow.style.gap="8px";
        timeRow.style.alignItems="center";

        let s=document.createElement("input");
        s.className="inline";
        s.dataset.idx=i;
        s.dataset.type="start";
        s.value=minToDisplay(r.start);

        let e=document.createElement("input");
        e.className="inline";
        e.dataset.idx=i;
        e.dataset.type="end";
        e.value=minToDisplay(r.end);

        // Add real-time sync on input
        s.oninput = () => syncTimes(i, 'start', s.value);
        e.oninput = () => syncTimes(i, 'end', e.value);

        timeRow.appendChild(s);
        timeRow.appendChild(document.createTextNode("-"));
        timeRow.appendChild(e);

        div.appendChild(nameBlock);
        div.appendChild(timeRow);

        resultsEl.appendChild(div);
    });

    resultsEl._rows = rows;
    updatePreview();
}

/* ---------- COPY ---------- */
function copySchedule(){
    let rows=resultsEl._rows||[];
    let text = scheduleToText(rows);

    navigator.clipboard.writeText(text);
    alert("Copied!");
}

/* ---------- RESET ---------- */
document.getElementById("resetBtn").onclick=()=>{
    resultsEl.innerHTML="";
    resultsEl._rows=[];
    updatePreview();
};

/* ---------- BUTTON WIRING ---------- */
document.getElementById("copyBtnBottom").onclick = copySchedule;

/* ---------- INPUT WATCHERS ---------- */
djCountEl.oninput = ()=>{
    currentPreset=null;
    presetSelect.value="";
    buildDJInputs();
    calculate();
};

startEl.oninput = ()=>{ currentPreset=null; presetSelect.value=""; calculate(); };
endEl.oninput   = ()=>{ currentPreset=null; presetSelect.value=""; calculate(); };

presetSelect.onchange = ()=>{
    const key=presetSelect.value;
    currentPreset=key||null;
    const p=presets[key];

    if(p){
        djCountEl.value=p.count;
        startEl.value=p.start;
        endEl.value=p.end;
        buildDJInputs();
    }
    calculate();
};

/* ---------- INIT ---------- */
buildDJInputs();
calculate();
</script>

</body>
</html>
