<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Set Time Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<style>
    body {
        font-family: 'Rajdhani', sans-serif;
        background: #ffffff;
        color: #111;
        margin: 0;
        padding: 30px;
    }

    .back-button {
        position: fixed;
        top: 18px;
        left: 18px;
        background: #228B22;
        color: #fff;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 700;
        z-index: 9999;
    }

    h1 { text-align:center; margin-bottom:16px; }

    .wrap {
        max-width: 780px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    .panel {
        background: #fafafa;
        padding: 18px;
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    label { display:block; font-weight:700; margin-top:10px; font-size:14px; }

    input[type="text"], input[type="time"], input[type="number"] {
        padding:10px;
        margin-top:6px;
        border:1px solid #ddd;
        border-radius:8px;
        font-size:15px;
        font-weight: bold;
        font-family:'Rajdhani';
    }

    /* Smaller time boxes */
    .time-small {
        width: 120px !important;
        font-weight:700;
    }

    #djCount {
        width: 60px;
    }

    .dj-list { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
    .dj-item {
        display:flex;
        align-items:center;
        padding:8px;
        background:#fff;
        border-radius:8px;
        border:1px solid #eee;
        gap:10px;
    }

    .drag-handle {
        padding:6px 10px;
        background:#f2f2f2;
        border-radius:6px;
        cursor:grab;
        font-weight:700;
        color:#444;
    }

    .dj-item input.name {
        flex:1;
        border:none;
        background:transparent;
        font-size:15px;
        font-weight:700;
    }

    button.primary {
        background:#228B22;
        color:white;
        border:none;
        padding:10px 16px;
        border-radius:8px;
        cursor:pointer;
        font-weight:700;
    }
    button.primary:hover { background:#1d701d; }

    button.ghost {
        background:white;
        border:1px solid #ddd;
        color:#228B22;
        padding:10px 16px;
        border-radius:8px;
        font-weight:700;
        cursor:pointer;
    }

    .result-row {
        display:flex;
        flex-direction: column;
        justify-content:flex-start;
        align-items:flex-start;
        background:#fff;
        border:1px solid #eee;
        padding:10px;
        border-radius:8px;
        margin-bottom:8px;
        gap:4px;
    }

    .result-row .label { font-weight:700; }

    .result-row input.inline {
        width:130px;
        padding:8px;
        border-radius:6px;
        border:1px solid #ddd;
        font-family:'Rajdhani';
        font-weight:bold;
    }
</style>
</head>
<body>

<button class="back-button" onclick="window.location.href='index.html'">⬅ Back to Tools</button>

<h1>Set Time Calculator</h1>

<div class="wrap">

    <!-- LEFT PANEL -->
    <div class="panel">

        <label>How many DJs?</label>
        <div style="display:flex; gap:12px; align-items:center;">
            <input id="djCount" type="number" min="1" value="3">

            <!-- PRESET DROPDOWN -->
            <select id="presetSelect" style="padding:8px; border-radius:8px; font-family:'Rajdhani'; font-weight:700;">
                <option value="">Preset</option>
                <option value="newstandard">New Standard</option>
                <option value="legacy">Legacy</option>
                <option value="latestart">Late Start (9PM)</option>
            </select>
        </div>

        <div style="display:flex; gap:12px; margin-top:12px;">
            <div style="flex:1;">
                <label>Show Start Time</label>
                <input id="startTime" type="time" value="20:00" class="time-small">
            </div>
            <div style="flex:1;">
                <label>Show End Time</label>
                <input id="endTime" type="time" value="02:00" class="time-small">
            </div>
        </div>

        <label style="margin-top:12px">DJ Lineup (drag to reorder)</label>
        <div id="djNamesContainer" class="dj-list"></div>

        <div style="margin-top:15px; display:flex; gap:10px;">
            <button id="calcBtn" class="primary">Recalculate</button>
            <button id="resetBtn" class="ghost">Reset</button>
        </div>

    </div>

    <!-- RIGHT PANEL -->
    <div class="panel">

        <div style="font-weight:700; font-size:16px; margin-bottom:10px;">Calculated Schedule</div>

        <div id="results"></div>

        <div style="margin-top:15px; display:flex; gap:10px;">
            <button id="updateBtn" class="primary">Update</button>
            <button id="copyBtnBottom" class="primary">Copy</button>
        </div>

    </div>

</div>

<script>
/* ---------- TIME HELPERS ---------- */
function hhmmToMin(t){ let[p,q]=t.split(":").map(Number); return p*60+q; }
function minToDisplay(m){
    m=((m%1440)+1440)%1440;
    let h=Math.floor(m/60), mm=m%60;
    let ap=h>=12?"PM":"AM";
    h=(h%12)||12;
    return `${h}:${String(mm).padStart(2,'0')} ${ap}`;
}
function parseDisplay(s){
    let m=s.match(/(\d{1,2}):(\d{2}) ?(AM|PM)?/i);
    if(!m)return null;
    let h=+m[1], mm=+m[2], ap=(m[3]||"AM").toUpperCase();
    if(ap==="AM"&&h===12)h=0;
    if(ap==="PM"&&h!==12)h+=12;
    return h*60+mm;
}

/* ---------- DOM REFS ---------- */
const container=document.getElementById("djNamesContainer");
const djCountEl=document.getElementById("djCount");
const startEl=document.getElementById("startTime");
const endEl=document.getElementById("endTime");
const resultsEl=document.getElementById("results");
const presetSelect=document.getElementById("presetSelect");

let sortable;
let currentPreset = null;

/* ---------- PRESETS (exact patterns) ---------- */
const presets = {
    newstandard: {
        count: 7,
        start: "20:00",
        end: "02:00",
        // durations in minutes: 7 DJs + B2B
        slotDurations: [45,45,45,45,45,60,60,15]
    },
    legacy: {
        count: 7,
        start: "20:00",
        end: "02:00",
        slotDurations: [45,45,45,45,45,45,60,30]
    },
    latestart: {
        count: 6,
        start: "21:00",
        end: "02:00",
        slotDurations: [45,45,45,45,45,60,15]
    }
};

/* ---------- BUILD DJ INPUTS ---------- */
function buildDJInputs(){
    let count=+djCountEl.value;
    let existing=[...container.querySelectorAll("input.name")].map(i=>i.value);

    container.innerHTML="";

    for(let i=0;i<count;i++){
        let name=existing[i] || `DJ ${i+1}`;
        let row=document.createElement("div");
        row.className="dj-item";
        row.innerHTML=`
            <div class="drag-handle">☰</div>
            <input class="name" type="text" value="${name}">
        `;
        container.appendChild(row);

        let inp=row.querySelector("input.name");
        inp.onfocus=()=>inp.select();
        inp.oninput=calculate;  // live update names into schedule
    }

    initSortable();
}

function initSortable(){
    if(sortable)sortable.destroy();
    sortable=Sortable.create(container,{
        handle:".drag-handle",
        animation:150,
        onEnd(){ calculate(); }
    });
}

/* ---------- CALCULATE ---------- */
function calculate(){
    let names=[...container.querySelectorAll("input.name")].map(i=>i.value.trim()||"DJ");

    let start=hhmmToMin(startEl.value);
    let end=hhmmToMin(endEl.value);
    if(end<=start)end+=1440;

    const total=end-start;
    let rows=[];

    // If a preset is active, use its fixed slot durations
    if(currentPreset && presets[currentPreset]){
        const p = presets[currentPreset];
        const durs = p.slotDurations;
        let cur = start;

        for(let i=0;i<durs.length;i++){
            const dur = durs[i];
            const isLast = (i === durs.length-1);
            const isB2B = isLast;
            const label = isB2B ? "B2B" : (names[i] || `DJ ${i+1}`);

            rows.push({
                label,
                start: cur,
                end: cur + dur,
                dur: dur,
                isB2B: isB2B
            });

            cur += dur;
        }
    } else {
        // Generic mode: even division in 5-minute increments, leftover to B2B
        const count = names.length;
        if(count === 0){
            resultsEl.innerHTML = "";
            resultsEl._rows = [];
            return;
        }

        let rawPer = total / count;
        let per = Math.floor(rawPer / 5) * 5;
        if(per < 5) per = 5;

        let used = per * count;
        let leftover = total - used;

        let cur = start;
        for(let n of names){
            rows.push({
                label:n,
                start:cur,
                end:cur+per,
                dur:per,
                isB2B:false
            });
            cur += per;
        }

        if(leftover > 0){
            rows.push({
                label:"B2B",
                start:cur,
                end:cur+leftover,
                dur:leftover,
                isB2B:true
            });
        }
    }

    render(rows);
}

/* ---------- RENDER (name above times) ---------- */
function render(rows){
    resultsEl.innerHTML="";

    rows.forEach((r,i)=>{
        let div=document.createElement("div");
        div.className="result-row";

        // NAME BLOCK (top)
        const nameBlock = document.createElement("div");
        nameBlock.style.fontWeight = "700";

        if(r.isB2B){
            const nameInput = document.createElement("input");
            nameInput.className = "inline";
            nameInput.dataset.type = "name";
            nameInput.dataset.idx = i;
            nameInput.value = r.label;
            nameBlock.appendChild(nameInput);
        } else {
            nameBlock.textContent = r.label;
        }

        // TIME ROW
        const timeRow = document.createElement("div");
        timeRow.style.display = "flex";
        timeRow.style.gap = "8px";
        timeRow.style.alignItems = "center";

        const startInput = document.createElement("input");
        startInput.className = "inline";
        startInput.dataset.type = "start";
        startInput.dataset.idx = i;
        startInput.value = minToDisplay(r.start);

        const arrow = document.createElement("span");
        arrow.textContent = "→";

        const endInput = document.createElement("input");
        endInput.className = "inline";
        endInput.dataset.type = "end";
        endInput.dataset.idx = i;
        endInput.value = minToDisplay(r.end);

        timeRow.appendChild(startInput);
        timeRow.appendChild(arrow);
        timeRow.appendChild(endInput);

        div.appendChild(nameBlock);
        div.appendChild(timeRow);

        resultsEl.appendChild(div);
    });

    resultsEl._rows = rows;
}

/* ---------- UPDATE BUTTON (resync after manual edits) ---------- */
function updateSchedule(){
    let rows = resultsEl._rows;
    if(!rows)return;

    let end=hhmmToMin(endEl.value);

    [...resultsEl.querySelectorAll("input.inline")].forEach(inp=>{
        let idx=+inp.dataset.idx;
        let type=inp.dataset.type;
        let row=rows[idx];

        if(type==="name"){ row.label = inp.value.trim(); return; }

        let t=parseDisplay(inp.value);
        if(t==null)return;

        if(type==="start") { row.start=t; row.end=t+row.dur; }
        if(type==="end")   { row.end=t;   row.dur=row.end-row.start; }
    });

    for(let i=1;i<rows.length;i++){
        rows[i].start=rows[i-1].end;
        rows[i].end=rows[i].start+rows[i].dur;
    }

    // Auto-B2B at end (only in non-preset mode)
    if(!currentPreset){
        let last=rows[rows.length-1];
        if(last.end < end){
            rows.push({
                label:"B2B",
                start:last.end,
                end:end,
                dur:end-last.end,
                isB2B:true
            });
        } else if(last.isB2B && last.end >= end){
            rows.pop();
        }
    }

    render(rows);
}

/* ---------- COPY (times first, then name) ---------- */
function copySchedule(){
    let rows=resultsEl._rows||[];
    if(!rows.length){
        alert("No schedule to copy.");
        return;
    }

    let text = rows.map(r =>
        `${minToDisplay(r.start)} → ${minToDisplay(r.end)} — ${r.label}`
    ).join("\n");

    navigator.clipboard.writeText(text);
    alert("Copied!");
}

/* ---------- RESET ---------- */
document.getElementById("resetBtn").onclick=()=>{
    resultsEl.innerHTML="";
    resultsEl._rows = [];
};

/* ---------- BUTTON WIRING ---------- */
document.getElementById("calcBtn").onclick = calculate;
document.getElementById("updateBtn").onclick = updateSchedule;
document.getElementById("copyBtnBottom").onclick = copySchedule;

/* ---------- INPUT REACTIONS ---------- */
djCountEl.oninput = () => {
    currentPreset = null;
    presetSelect.value = "";
    buildDJInputs();
    calculate();
};

startEl.oninput = () => {
    currentPreset = null;
    presetSelect.value = "";
    calculate();
};

endEl.oninput = () => {
    currentPreset = null;
    presetSelect.value = "";
    calculate();
};

/* ---------- PRESET SELECT ---------- */
presetSelect.onchange = () => {
    const key = presetSelect.value;
    currentPreset = key || null;

    const p = presets[key];
    if (!p) {
        calculate();
        return;
    }

    djCountEl.value = p.count;
    startEl.value = p.start;
    endEl.value = p.end;

    buildDJInputs();
    calculate();
};

/* ---------- INIT ---------- */
buildDJInputs();
calculate();

</script>
</body>
</html>
