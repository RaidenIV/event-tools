<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Advance Email Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Theme bootstrap: default DARK, persist in localStorage -->
<script>
(function () {
    try {
        var saved = localStorage.getItem('xmg_theme');
        var theme = saved || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
})();
</script>

<style>
    :root {
        --accent: #0099ff;
        --accent2: #00ffff;
        --success: #228B22;
        --danger: #dc3545;
        --radius: 12px;
        --shadow: 0 10px 30px rgba(0,0,0,0.18);

        /* Shared top UI height for menu button */
        --top-ui-height: 48px;

        /* Fixed box heights (do not auto-resize) */
        --ros-box-height: 260px;
        --preview-box-height: 510px;
    
        /* Field alignment metrics */
        --label-margin-top: 12px;
        --label-line-height: 18px;
        --control-margin-top: 6px;
        --control-height: 42px;
}

    html[data-theme="light"] {
        --bg: #ffffff;
        --text: #111111;
        --muted: rgba(0,0,0,0.65);
        --panel: #fafafa;
        --panel-2: #ffffff;
        --border: rgba(0,0,0,0.10);
        --border-2: rgba(0,0,0,0.08);
        --input-bg: #ffffff;
        --input-text: #111111;
        --chip: rgba(0,0,0,0.06);
        --chip-text: rgba(0,0,0,0.72);
    }

    html[data-theme="dark"] {
        --bg: #0b0b0c;
        --text: #f2f2f4;
        --muted: #a7a7ad;
        --panel: #131316;
        --panel-2: #131316;
        --border: #2a2a2f;
        --border-2: #2a2a2f;
        --input-bg: #0f0f12;
        --input-text: #f2f2f4;
        --chip: rgba(255,255,255,0.08);
        --chip-text: rgba(255,255,255,0.78);
    }

    * {
        box-sizing: border-box;
        font-family: 'Rajdhani', sans-serif;
    }

    body {
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 30px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
    }

    /* Ensure all page content sits above the canvas */
    .nav-dropdown,
    .wrap {
        position: relative;
        z-index: 1;
    }

    /* ======= MENU NAV (Hamburger Style) ======= */
    .nav-dropdown {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 9999;
    }

    .nav-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 0;
        cursor: pointer;
        background: var(--bg);
        color: #fff;
        box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.6), -2px -2px 8px rgba(255, 255, 255, 0.05);
        transition: 0.2s;
    }

    .nav-toggle-icon {
        position: relative;
        width: 18px;
        height: 2px;
        background: currentColor;
        transition: 0.3s;
    }

    .nav-toggle-icon::before,
    .nav-toggle-icon::after {
        content: "";
        position: absolute;
        width: 18px;
        height: 2px;
        background: currentColor;
        left: 0;
        transition: 0.3s;
    }

    .nav-toggle-icon::before { top: -6px; }
    .nav-toggle-icon::after { top: 6px; }

    .active .nav-toggle-icon { background: transparent; }
    .active .nav-toggle-icon::before { top: 0; transform: rotate(45deg); }
    .active .nav-toggle-icon::after { top: 0; transform: rotate(-45deg); }

    .nav-menu {
        position: absolute;
        top: 55px;
        left: 0;
        background: var(--bg);
        border-radius: 12px;
        padding: 8px;
        min-width: 200px;
        box-shadow: 10px 10px 25px rgba(0, 0, 0, 0.5);
        display: none;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .active .nav-menu {
        display: block;
        animation: fadeInUp 0.2s ease;
    }

    .nav-menu a {
        display: block;
        padding: 12px;
        color: #ccc;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: 0.2s;
    }

    .nav-menu a:hover {
        background: rgba(0, 153, 255, 0.1);
        color: #0099ff;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

        /* ======= APP UI ======= */
    .panel {
        background: var(--panel);
        padding: 20px;
        border-radius: 14px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 1200px;
        position: relative;
    }

    .logo {
        position: absolute;
        top: 20px;
        right: 20px;
        height: 40px;
        width: auto;
        z-index: 100;
    }

    h1 {
        text-align: center;
        font-size: 40px;
        margin: 10px 0 8px 0;
        letter-spacing: 0.5px;
    }

    .subtitle {
        text-align: center;
        font-size: 16px;
        color: var(--muted);
        margin: 0 0 20px 0;
        font-weight: 400;
    }

    label {
        display: block;
        font-weight: 700;
        margin-top: 12px;
        font-size: 14px;
        color: var(--muted);
        line-height: var(--label-line-height);
}

    input[type="text"], 
    input[type="time"],
    textarea {
        padding: 10px;
        margin-top: var(--control-margin-top);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 15px;
        font-weight: bold;
        width: 100%;
        background: var(--input-bg);
        color: var(--input-text);
        font-family: 'Rajdhani';
        box-sizing: border-box;
        outline: none;
    }

    input[type="text"]:focus,
    input[type="time"]:focus,
    textarea:focus {
        border-color: rgba(0,153,255,0.75);
        box-shadow: 0 0 0 3px rgba(0,153,255,0.18);
    }
    input[type="text"],
    input[type="time"] {
        height: var(--control-height);
    }



    /* Mobile/time input width hardening: prevents native time control from overflowing the card on some browsers */
    input[type="time"]{
        display: block;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow: hidden;
        -webkit-appearance: none;
        appearance: none;
    }
    /* Keep picker functionality on WebKit while avoiding intrinsic sizing overflow */
    input[type="time"]::-webkit-calendar-picker-indicator{
        cursor: pointer;
    }


    input[type="text"]::placeholder {
        color: rgba(255,255,255,0.45);
    }

    html[data-theme="light"] input[type="text"]::placeholder {
        color: rgba(0,0,0,0.45);
    }

    textarea {
        min-height: 120px;
        resize: none;
    }

    /* Time input styling for dark mode */
    html[data-theme="dark"] {
        color-scheme: dark;
    }
    html[data-theme="light"] {
        color-scheme: light;
    }

    html[data-theme="dark"] input[type="time"] {
        color-scheme: dark;
        padding-right: 38px;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>');
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 18px 18px;
    }

    html[data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator {
        opacity: 0;
        display: block;
    }

    html[data-theme="light"] input[type="time"] {
        color-scheme: light;
        background-image: none;
        padding-right: 10px;
    }

    button.primary {
        background: var(--accent);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        font-family: 'Rajdhani';
        margin-top: 15px;
        transition: all 0.3s ease;
    }

    button.primary:hover {
        background: #0077cc;
        box-shadow: 0 4px 12px rgba(0, 153, 255, 0.4);
    }

    button.ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 16px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 15px;
        transition: all 0.3s ease;
    }

    button.ghost:hover {
        background: var(--input-bg);
        border-color: var(--accent);
    }

    button.reset-btn {
        background: #dc3545;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        font-family: 'Rajdhani';
        margin-top: 15px;
        transition: all 0.3s ease;
        width: auto;
    }

    button.reset-btn:hover {
        background: #c82333;
        box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
    }

    .preview-box {
        margin-top: 0;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 15px;
        font-size: 16px;
        font-weight: 400;
        white-space: pre-wrap;
        line-height: 1.6;
        font-family: 'Rajdhani', sans-serif;
        color: var(--text);
    }

    .preview-box .label {
        font-weight: 700;
    }

    .form-section {
        margin-bottom: 10px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 2fr;
        gap: 20px;
        margin-top: 20px;
        grid-template-rows: 1fr;
    }

    .form-column {
        display: flex;
        flex-direction: column;
    }

    .form-column:nth-child(2) {
        display: flex;
        flex-direction: column;
    }

    .run-of-show-span {
        overflow-y: auto;
        flex: 0 0 auto;
        height: calc((var(--control-height) * 4) + ((var(--label-margin-top) + var(--label-line-height) + var(--control-margin-top)) * 3));
        min-height: 0;
        resize: none;
    }

    .preview-column {
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .preview-column .preview-box {
        flex: 0 0 auto;
        height: var(--preview-box-height);
        overflow-y: auto;
        margin-bottom: 0px;
        min-height: 0;
    }

    .preview-spacer{
        flex: 0 0 auto;
        height: calc(var(--label-margin-top) + var(--label-line-height) + var(--control-margin-top));
        /* aligns buttons to Confirmation # input baseline */
    }



.preview-column label.preview-label {
    margin-top: 12px;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
}

.preview-actions {
    display: flex;
    gap: 10px;
    margin-top: 0;
    flex-shrink: 0;
    height: var(--control-height);            /* match Confirmation # input height */
    align-items: stretch;                      /* buttons fill full height */
}

.preview-actions button {
    flex: 1 1 0;
    margin: 0;
    width: auto;
    min-width: 0;
    height: 100%;                              /* bottom edge aligns to Confirmation # input bottom */
    padding: 0 16px;                           /* keep horizontal padding, no vertical growth */
    display: flex;
    align-items: center;
    justify-content: center;
}


    @media (max-width: 1024px) {
        body {
            padding-top: 80px;
            padding-left: 15px;
            padding-right: 15px;
        }
        
        .form-grid {
            grid-template-columns: 1fr;
            gap: 0;
        }
        
        .panel {
            max-width: 600px;
            padding: 16px;
        }
        
        .logo {
            position: static;
            display: block;
            margin: 0 auto 10px auto;
            height: 36px;
        }
        
        h1 {
            font-size: 28px;
            margin-top: 0;
        }
        
        input[type="text"],
        input[type="time"],
        textarea {
            max-width: 100%;
            width: 100%;
            box-sizing: border-box;
        }
        
        html[data-theme="dark"] input[type="time"] {
            padding-right: 10px;
            background-image: none;
        }
        
        html[data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator {
            opacity: 1;
        }
    }
</style>
</head>

<script>
  /* ======= NAV DROPDOWN ======= */
  const navDropdown = document.getElementById('navDropdown');
  const navToggle = document.getElementById('navToggle');

  navToggle.addEventListener('click', function (e) {
    e.stopPropagation();
    navDropdown.classList.toggle('active');
  });

  document.addEventListener('click', function (e) {
    if (!navDropdown.contains(e.target)) {
      navDropdown.classList.remove('active');
    }
  });

  const navLinks = document.querySelectorAll('.nav-menu a');
  navLinks.forEach(link => {
    link.addEventListener('click', function () {
      navDropdown.classList.remove('active');
    });
  });
/* ======= DARK MODE (default) ======= */
// Theme toggle removed. Default remains dark via bootstrap script in <head>.

/* ---------- DOM ---------- */
const inputs = {
    venueContact: document.getElementById("venueContact"),
    entranceAddress: document.getElementById("entranceAddress"),
    dosContact: document.getElementById("dosContact"),
    onsiteContact: document.getElementById("onsiteContact"),
    transportation: document.getElementById("transportation"),
    production: document.getElementById("production"),
    productionTech: document.getElementById("productionTech"),
    techVisualsConfirmed: document.getElementById("techVisualsConfirmed"),
    settlementContact: document.getElementById("settlementContact"),
    media: document.getElementById("media"),
    soundCheck: document.getElementById("soundCheck"),
    doors: document.getElementById("doors"),
    runOfShow: document.getElementById("runOfShow"),
    hospitalityConfirmed: document.getElementById("hospitalityConfirmed"),
    hotel: document.getElementById("hotel"),
    confirmation: document.getElementById("confirmation")
};

const previewBox = document.getElementById("previewBox");
const csvUpload = document.getElementById("csvUpload");

/* ---------- TIME CONVERSION ---------- */
function convertTo12Hour(time24) {
    if (!time24) return '';
    const [hours, minutes] = time24.split(':');
    let h = parseInt(hours);
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${minutes} ${ampm}`;
}

/* ---------- GENERATE EMAIL ---------- */
function generateEmail() {
    const data = {};
    for (let key in inputs) {
        data[key] = inputs[key].value.trim();
    }

    // Build email text with labels and spacing
    let emailText = '';
    let emailHTML = '';
    
    if (data.venueContact) {
        emailText += `Venue Contact: ${data.venueContact}\n\n`;
        emailHTML += `<span class="label">Venue Contact:</span> ${data.venueContact}\n\n`;
    }
    if (data.entranceAddress) {
        emailText += `Venue Artist Entrance Address: ${data.entranceAddress}\n\n`;
        emailHTML += `<span class="label">Venue Artist Entrance Address:</span> ${data.entranceAddress}\n\n`;
    }
    if (data.settlementContact) {
        emailText += `Venue/Settlement Contact: ${data.settlementContact}\n\n`;
        emailHTML += `<span class="label">Venue/Settlement Contact:</span> ${data.settlementContact}\n\n`;
    }
    if (data.dosContact) {
        emailText += `Primary DOS Contact [Promoter]: ${data.dosContact}\n\n`;
        emailHTML += `<span class="label">Primary DOS Contact [Promoter]:</span> ${data.dosContact}\n\n`;
    }
    if (data.onsiteContact) {
        emailText += `Primary On-Site Contact: ${data.onsiteContact}\n\n`;
        emailHTML += `<span class="label">Primary On-Site Contact:</span> ${data.onsiteContact}\n\n`;
    }
    if (data.transportation) {
        emailText += `Transportation: ${data.transportation}\n\n`;
        emailHTML += `<span class="label">Transportation:</span> ${data.transportation}\n\n`;
    }
    if (data.production) {
        emailText += `Production: ${data.production}\n\n`;
        emailHTML += `<span class="label">Production:</span> ${data.production}\n\n`;
    }
    if (data.productionTech) {
        emailText += `Production/Tech: ${data.productionTech}\n\n`;
        emailHTML += `<span class="label">Production/Tech:</span> ${data.productionTech}\n\n`;
    }
    if (data.techVisualsConfirmed) {
        emailText += `Tech/Visuals Confirmed? ${data.techVisualsConfirmed}\n\n`;
        emailHTML += `<span class="label">Tech/Visuals Confirmed?</span> ${data.techVisualsConfirmed}\n\n`;
    }
    if (data.media) {
        emailText += `Media: ${data.media}\n\n`;
        emailHTML += `<span class="label">Media:</span> ${data.media}\n\n`;
    }
    
    if (data.soundCheck) {
        const time12 = convertTo12Hour(data.soundCheck);
        emailText += `Sound Check: ${time12}\n\n`;
        emailHTML += `<span class="label">Sound Check:</span> ${time12}\n\n`;
    }
    if (data.doors) {
        const time12 = convertTo12Hour(data.doors);
        emailText += `Doors: ${time12}\n\n`;
        emailHTML += `<span class="label">Doors:</span> ${time12}\n\n`;
    }

    if (data.runOfShow) {
        emailText += `Run of Show (Set Times): ${data.runOfShow}\n\n`;
        emailHTML += `<span class="label">Run of Show (Set Times):</span> ${data.runOfShow}\n\n`;
    }
    if (data.hospitalityConfirmed) {
        emailText += `Hospitality Confirmed? ${data.hospitalityConfirmed}\n\n`;
        emailHTML += `<span class="label">Hospitality Confirmed?</span> ${data.hospitalityConfirmed}\n\n`;
    }

    if (data.hotel) {
        emailText += `Hotel: ${data.hotel}\n\n`;
        emailHTML += `<span class="label">Hotel:</span> ${data.hotel}\n\n`;
    }
    if (data.confirmation) {
        emailText += `Confirmation #: ${data.confirmation}\n\n`;
        emailHTML += `<span class="label">Confirmation #:</span> ${data.confirmation}\n\n`;
    }

    // Store plain text for copying
    previewBox.dataset.plainText = emailText;
    
    // Display HTML version with bold labels
    previewBox.innerHTML = emailHTML || "Email preview will appear here as you type.";
}

/* ---------- RESET ---------- */
function resetForm() {
    for (let key in inputs) {
        inputs[key].value = '';
    }
    generateEmail();
}

/* ---------- CSV IMPORT ---------- */
function importCSV(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const text = e.target.result;
        const lines = text.split('\n');
        
        // Parse CSV - expecting "Field,Value" format
        lines.forEach(line => {
            line = line.trim();
            if (!line) return;
            
            // Split on first comma only
            const commaIndex = line.indexOf(',');
            if (commaIndex === -1) return;
            
            const field = line.substring(0, commaIndex).trim().toLowerCase();
            const value = line.substring(commaIndex + 1).trim();
            
            // Map CSV field names to input IDs
            const fieldMap = {
                'venue contact': 'venueContact',
                'venue artist entrance address': 'entranceAddress',
                'primary dos contact [promoter]': 'dosContact',
                'primary dos contact': 'dosContact',
                'primary on-site contact': 'onsiteContact',
                'transportation': 'transportation',
                'production': 'production',
                'production/tech': 'productionTech',
                'tech/visuals confirmed?': 'techVisualsConfirmed',
                'tech/visuals confirmed': 'techVisualsConfirmed',
                'venue/settlement contact': 'settlementContact',
                'media': 'media',
                'sound check': 'soundCheck',
                'doors': 'doors',
                'run of show (set times)': 'runOfShow',
                'run of show': 'runOfShow',
                'hospitality confirmed?': 'hospitalityConfirmed',
                'hospitality confirmed': 'hospitalityConfirmed',
                'hotel': 'hotel',
                'confirmation #': 'confirmation',
                'confirmation': 'confirmation'
            };
            
            const inputKey = fieldMap[field];
            if (inputKey && inputs[inputKey]) {
                inputs[inputKey].value = value;
            }
        });
        
        generateEmail();
    };
    reader.readAsText(file);
}

csvUpload.onchange = function(e) {
    const file = e.target.files[0];
    if (file) {
        importCSV(file);
    }
    // Reset input so same file can be uploaded again
    e.target.value = '';
};

/* ---------- COPY ---------- */
function copyEmail() {
    const text = previewBox.dataset.plainText || previewBox.textContent;
    if (text === "Email preview will appear here as you type.") {
        alert("Nothing to copy yet!");
        return;
    }
    navigator.clipboard.writeText(text);
    alert("Copied!");
}

/* ---------- EXPORT CSV ---------- */
function exportCSV() {
    const data = {};
    for (let key in inputs) {
        data[key] = inputs[key].value.trim();
    }

    // Create CSV content
    let csv = '';
    const fieldLabels = {
        venueContact: 'Venue Contact',
        entranceAddress: 'Venue Artist Entrance Address',
        dosContact: 'Primary DOS Contact [Promoter]',
        onsiteContact: 'Primary On-Site Contact',
        transportation: 'Transportation',
        production: 'Production',
        productionTech: 'Production/Tech',
        techVisualsConfirmed: 'Tech/Visuals Confirmed?',
        settlementContact: 'Venue/Settlement Contact',
        media: 'Media',
        soundCheck: 'Sound Check',
        doors: 'Doors',
        runOfShow: 'Run of Show (Set Times)',
        hospitalityConfirmed: 'Hospitality Confirmed?',
        hotel: 'Hotel',
        confirmation: 'Confirmation #'
    };

    for (let key in inputs) {
        const value = data[key];
        if (value) {
            // Escape quotes and wrap in quotes if contains comma or newline
            const escapedValue = value.includes(',') || value.includes('\n') || value.includes('"')
                ? '"' + value.replace(/"/g, '""') + '"'
                : value;
            csv += `${fieldLabels[key]},${escapedValue}\n`;
        }
    }

    if (!csv) {
        alert("No data to export!");
        return;
    }

    // Create download link
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ros_email_data.csv';
    a.click();
    URL.revokeObjectURL(url);
}

/* ---------- EVENT LISTENERS ---------- */
for (let key in inputs) {
    inputs[key].oninput = generateEmail;
}

document.getElementById("importBtn").onclick = () => csvUpload.click();
document.getElementById("exportBtn").onclick = exportCSV;
document.getElementById("resetBtn").onclick = resetForm;
document.getElementById("copyBtn").onclick = copyEmail;

/* ---------- INIT ---------- */
generateEmail();
</script>
