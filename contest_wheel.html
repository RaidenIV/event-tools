<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contest Spinner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --green: #228B22;
        --green-dark: #1d701d;
        --accent:  #acc7ff;
        --accent2: #498fff;
        --top-ui-height: 48px;
        --bg:         #10131a;
        --panel:      #1d2027;
        --panel-2:    #272a31;
        --text:       #e0e2ec;
        --muted:      #c1c6d6;
        --border:     #414754;
        --line:       #414754;
        --input-bg:   #181c23;
        --input-text: #e0e2ec;
        --canvas-bg:  #10131a;
        --shadow: 0 4px 14px rgba(0,0,0,0.55);
        --radius-sm:  0.125rem;
        --radius:     0.25rem;
        --radius-md:  0.375rem;
        --radius-lg:  0.5rem;
        --radius-xl:  0.75rem;
    }

/* ======= MENU NAV ======= */
    .nav-dropdown {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10000;
    }

    .nav-toggle {
        background: rgba(29, 32, 39, 0.92);
        border: 1px solid var(--border);
        border-radius: 6px;
        width: var(--top-ui-height);
        height: var(--top-ui-height);
        padding: 0;
        color: var(--text);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color 0.2s ease, background 0.2s ease;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    .nav-toggle:hover {
        background: rgba(39, 42, 49, 0.95);
        border-color: var(--accent);
    }

    .nav-toggle .hamburger {
        display: flex;
        flex-direction: column;
        gap: 5px;
        pointer-events: none;
    }
    .nav-toggle .hamburger span {
        display: block;
        width: 20px;
        height: 2px;
        background: var(--text);
        border-radius: 2px;
        transition: background 0.2s;
    }
    .nav-toggle:hover .hamburger span { background: var(--accent); }

    .nav-menu {
        position: absolute;
        top: 56px;
        left: 0;
        background: rgba(29, 32, 39, 0.97);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        min-width: 180px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px);
        transition: all 0.2s ease;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        overflow: hidden;
    }

    .nav-dropdown.active .nav-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    .nav-menu a,
    .nav-menu button.nav-item-btn {
        display: block;
        text-align: left;
        padding: 10px 16px;
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        border-radius: 4px;
        transition: background 0.15s ease, color 0.15s ease;
        background: transparent;
        border: none;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        box-sizing: border-box;
    }

    .nav-menu a:hover,
    .nav-menu button.nav-item-btn:hover {
        background: rgba(172, 199, 255, 0.08);
        color: var(--accent);
    }

/* ======= APP SCOPE ======= */
    #contest-wheel-app, #contest-wheel-app * {
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
    }

    html, body {
        background: var(--bg) !important;
        color: var(--text) !important;
        margin: 0 !important;
        padding: 0 !important;
        min-height: 100vh !important;
        width: 100% !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
    }

    .xmg-app-logo {
        position: absolute !important;
        top: 12px;
        right: 12px;
        width: 100px;
        height: auto;
        z-index: 10;
        pointer-events: none;
    }
    .xmg-app-logo img { width: 100%; height: auto; display: block; }

    #contest-wheel-app {
        background: transparent;
        color: var(--text);
        padding: 80px 20px 20px 20px;
        border-radius: 0;
        border: none;
        max-width: 1400px;
        margin: 0 auto;
        position: relative;
    }

    #contest-wheel-app h1 {
        text-align: left;
        font-size: 20px;
        margin: 0 0 6px 0;
        font-weight: 700;
        color: var(--text);
    }

    #contest-wheel-app .subtitle {
        text-align: left;
        font-size: 13px;
        margin: 0 0 16px 0;
        color: var(--muted);
        line-height: 1.4;
    }

    #contest-wheel-app .layout {
        display: flex;
        flex-direction: row;
        gap: 16px;
        align-items: stretch;
    }

    #contest-wheel-app .panel { flex: 1; overflow-y: auto; }
    #contest-wheel-app .panel-input { order: 1; }
    #contest-wheel-app .panel-wheel { order: 2; }

    @media (max-width: 900px) {
        #contest-wheel-app { padding: 80px 16px 20px 16px; }
        #contest-wheel-app .layout {
            flex-direction: column;
            align-items: center;
        }
        #contest-wheel-app .panel { max-width: 100%; overflow-y: visible; }
        #contest-wheel-app .panel-input { order: 2; }
        #contest-wheel-app .panel-wheel { order: 1; }
        #contest-wheel-app textarea { height: 200px; }
    }

    #contest-wheel-app .panel {
        background: var(--panel);
        padding: 16px;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        width: 100%;
        border: 1px solid var(--line);
    }

    #contest-wheel-app label {
        display: block;
        font-weight: 600;
        font-size: 12px;
        margin: 10px 0 6px;
        color: var(--muted);
    }

    #contest-wheel-app textarea {
        width: 100%;
        background: var(--input-bg);
        color: var(--input-text);
        height: 180px;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        font-family: 'Inter', monospace;
        font-size: 14px;
        resize: vertical;
        font-weight: 400;
    }

    #contest-wheel-app input[type="text"],
    #contest-wheel-app select {
        width: 100%;
        background: var(--input-bg);
        color: var(--input-text);
        padding: 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        font-size: 14px;
        margin-bottom: 8px;
        font-weight: 400;
    }

    #contest-wheel-app textarea::placeholder,
    #contest-wheel-app input::placeholder {
        color: rgba(167,167,173,0.55);
        font-weight: 400;
    }

    #contest-wheel-app .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        margin-bottom: 8px;
    }

    #contest-wheel-app .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
        margin-bottom: 10px;
    }

    #contest-wheel-app button {
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 700;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s ease;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
    }

    #contest-wheel-app button:active {
        transform: translateY(1px);
        box-shadow: 0 2px 6px rgba(0,0,0,0.15) inset;
    }

    #contest-wheel-app .btn-primary { background: var(--green); color: #fff; }
    #contest-wheel-app .btn-primary:hover { background: var(--green-dark); }

    #contest-wheel-app .btn-ghost {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
    }
    #contest-wheel-app .btn-ghost:hover { background: #22222a; }

    #contest-wheel-app .options-row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        margin-top: 6px;
        font-size: 13px;
        color: var(--text);
    }

    /* Spin time slider */
    #contest-wheel-app .spin-slider-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
    }
    #contest-wheel-app input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100px;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        outline: none;
        margin: 0;
        padding: 0;
        border: none;
        cursor: pointer;
    }
    #contest-wheel-app input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
    }
    #contest-wheel-app input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        border: none;
    }

    /* Presets section */
    #contest-wheel-app .presets-section {
        margin-top: 14px;
        border-top: 1px solid var(--border);
        padding-top: 12px;
    }
    #contest-wheel-app .presets-section .section-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 8px;
    }
    #contest-wheel-app .preset-name-row {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
    }
    #contest-wheel-app .preset-name-row input {
        flex: 1;
        margin-bottom: 0;
        padding: 7px 10px;
        font-size: 13px;
    }
    #contest-wheel-app .preset-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    #contest-wheel-app .preset-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s;
    }
    #contest-wheel-app .preset-chip:hover { border-color: var(--accent); color: var(--accent); }
    #contest-wheel-app .preset-chip .preset-del {
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        margin-left: 2px;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        font-weight: 400;
        transition: color 0.15s;
    }
    #contest-wheel-app .preset-chip .preset-del:hover { color: #ffb4ab; }

    /* CSV import */
    #contest-wheel-app .import-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
    }
    #contest-wheel-app .import-row label {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 12px;
        transition: border-color 0.15s, color 0.15s;
    }
    #contest-wheel-app .import-row label:hover { border-color: var(--accent); color: var(--accent); }
    #contest-wheel-app #csvFileInput { display: none; }

    #contest-wheel-app .spin-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }

    #contest-wheel-app canvas {
        background: var(--canvas-bg);
        border-radius: 50%;
        box-shadow: 0 4px 18px rgba(0,0,0,0.45);
        width: 100%;
        max-width: 420px;
        height: auto;
        aspect-ratio: 1 / 1;
        border: 1px solid rgba(255,255,255,0.06);
        display: block;
        cursor: pointer;
        touch-action: manipulation;
        transition: box-shadow 0.2s;
    }
    #contest-wheel-app canvas:hover {
        box-shadow: 0 4px 28px rgba(172,199,255,0.15);
    }

    #contest-wheel-app .spin-button {
        margin-top: 10px;
        font-size: 16px;
        padding: 10px 36px;
        letter-spacing: 0.04em;
    }
    #contest-wheel-app .spin-button[disabled] { opacity: 0.6; cursor: not-allowed; }

    #contest-wheel-app .winner-display {
        margin-top: 12px;
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        min-height: 24px;
        color: var(--text);
    }
    #contest-wheel-app .winner-display span {
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(34,139,34,0.15);
        border: 1px solid rgba(34,139,34,0.35);
    }

    #contest-wheel-app .history {
        margin-top: 16px;
        margin-left: auto;
        margin-right: auto;
        width: 100%;
        max-width: 420px;
    }
    #contest-wheel-app .history-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 4px;
        color: var(--text);
        text-align: center;
    }
    #contest-wheel-app .history-list {
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        max-height: 170px;
        overflow-y: auto;
        padding: 6px 10px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
    }
    #contest-wheel-app .history-item {
        padding: 3px 0;
        border-bottom: 1px dashed var(--border);
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }
    #contest-wheel-app .history-item:last-child { border-bottom: none; }
    #contest-wheel-app .history-index,
    #contest-wheel-app .history-time { color: var(--muted); }

    #contest-wheel-app .status-line {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        text-align: center;
    }

    #contest-wheel-app .show-info { text-align: center; margin-bottom: 8px; }
    #contest-wheel-app .show-title-display { font-size: 20px; font-weight: 700; margin-bottom: 2px; color: var(--text); }
    #contest-wheel-app .prize-display { font-size: 14px; color: var(--muted); }

    /* ======= WINNER MODAL — bounce-in animation ======= */
    #contest-wheel-app .winner-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        z-index: 9999;
    }
    #contest-wheel-app .winner-modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }
    #contest-wheel-app .winner-modal {
        background: var(--panel);
        border-radius: var(--radius-lg);
        padding: 28px 32px;
        max-width: 340px;
        width: 90%;
        box-shadow: 0 10px 40px rgba(0,0,0,0.65);
        text-align: center;
        border: 1px solid var(--border);
        color: var(--text);
        transform: scale(0.85);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #contest-wheel-app .winner-modal-overlay.active .winner-modal {
        transform: scale(1);
    }
    #contest-wheel-app .winner-modal-title {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 10px;
    }
    #contest-wheel-app .winner-modal-body {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 20px;
        word-break: break-word;
    }
    #contest-wheel-app .winner-modal-close {
        padding: 10px 32px;
        font-size: 14px;
    }

    /* ======= CONFETTI CANVAS ======= */
    #confetti-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9998;
    }

    /* ======= POINTER GLOW ======= */
    #contest-wheel-app canvas.pointer-glow {
        box-shadow: 0 4px 28px rgba(172,199,255,0.5), 0 0 0 2px rgba(172,199,255,0.25);
    }

    /* ======= ARIA live region ======= */
    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0,0,0,0);
        white-space: nowrap;
        border: 0;
    }

    #contest-wheel-app textarea:focus,
    #contest-wheel-app input[type="text"]:focus,
    #contest-wheel-app select:focus,
    #contest-wheel-app input[type="range"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(172,199,255,0.18);
    }

    /* keyboard-focus ring for spin button */
    #contest-wheel-app #btnSpin:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
    }

    /* Undo button */
    #contest-wheel-app #btnUndo { display: none; }
    #contest-wheel-app #btnUndo.visible { display: inline-flex; }
</style>

</head>
<body style="margin:0; padding:0; background: transparent;">

<!-- Confetti canvas (behind modal) -->
<canvas id="confetti-canvas"></canvas>

<!-- Accessible live region for screen readers -->
<div id="wheelAnnouncer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

<!-- Navigation Dropdown -->
<div class="nav-dropdown" id="navDropdown">
  <button class="nav-toggle" id="navToggle" aria-label="Open navigation menu">
    <div class="hamburger">
      <span></span><span></span><span></span>
    </div>
  </button>
  <div class="nav-menu">
    <a href="https://www.xodiamediagroup.com/" target="_top" rel="noopener">Home</a>
    <a href="https://www.xodiamediagroup.com/upcoming-events" target="_top" rel="noopener">Upcoming Events</a>
    <a href="https://www.xodiamediagroup.com/contact" target="_top" rel="noopener">Contact Us</a>
    <a href="https://tools-dashboard-production-1c7c.up.railway.app/" target="_top" rel="noopener">Tools</a>
  </div>
</div>

<div id="contest-wheel-app">
    <div class="xmg-app-logo">
        <img src="https://images.squarespace-cdn.com/content/v1/681ea18dd168a935c26295bd/c311da3d-6fbf-446a-858c-227fa011e7e3/Xodia+MEDIA+Group+%28TRANS%29+%281%29+%281%29.png?format=750w" alt="Xodia Media Group" />
    </div>
    <h1>Contest Wheel</h1>
    <p class="subtitle">Interactive prize wheel for giveaways</p>

<div class="layout">

    <!-- Input / entries panel (LEFT) -->
    <div class="panel panel-input">

        <label for="showTitleInput">Show Title</label>
        <input id="showTitleInput" type="text" placeholder="SPACE CAMP: SKRILLEX">

        <label for="prizeInput">Prize</label>
        <input id="prizeInput" type="text" placeholder="2 Free Tickets!">

        <label for="entriesInput">Entries (one per line)</label>
        <textarea id="entriesInput" placeholder="Alice&#10;Bob&#10;Charlie&#10;..."></textarea>
        <div class="hint">Each line = one entry. Duplicate a name for weighted entries.</div>

        <!-- CSV Import -->
        <div class="import-row">
            <label for="csvFileInput">⬆ Import CSV</label>
            <input type="file" id="csvFileInput" accept=".csv,.txt">
        </div>

        <div class="btn-row">
            <button class="btn-ghost" id="btnShuffle">Shuffle</button>
            <button class="btn-ghost" id="btnClear">Clear All</button>
            <button class="btn-ghost" id="btnUndo">↩ Undo Remove</button>
        </div>

        <div class="options-row">
            <label><input type="checkbox" id="chkRemoveWinner"> Remove winner after spin</label>
            <div class="spin-slider-row">
                <span>Speed:</span>
                <input type="range" id="spinTimeSlider" min="1500" max="7000" step="500" value="4000">
                <span id="spinTimeLabel">Normal</span>
            </div>
        </div>

        <!-- Named Presets -->
        <div class="presets-section">
            <div class="section-label">Saved Lists</div>
            <div class="preset-name-row">
                <input type="text" id="presetNameInput" placeholder="List name…" style="margin-bottom:0;">
                <button class="btn-ghost" id="btnSavePreset" style="padding:7px 12px;font-size:12px;">Save</button>
            </div>
            <div class="preset-list" id="presetList"></div>
        </div>
    </div>

    <!-- Wheel + winner panel (RIGHT) -->
    <div class="panel panel-wheel">
        <div class="spin-area">
            <div class="show-info">
                <div id="showTitleDisplay" class="show-title-display"></div>
                <div id="prizeDisplay" class="prize-display"></div>
            </div>

            <canvas id="wheelCanvas" width="420" height="420"
                    role="img" aria-label="Prize wheel"
                    tabindex="0"></canvas>
            <button class="btn-primary spin-button" id="btnSpin">SPIN</button>
            <div class="status-line" id="statusLine">Start typing names to update the wheel.</div>
        </div>

        <div class="winner-display" id="winnerDisplay"></div>

        <div class="history">
            <div class="history-title">Winners History</div>
            <div class="history-list" id="historyList">
                <div style="color:#999;font-size:12px;">No spins yet.</div>
            </div>
        </div>
    </div>

</div>

<!-- Winner modal -->
<div id="winnerModal" class="winner-modal-overlay">
    <div class="winner-modal">
        <div class="winner-modal-title">We have a winner!</div>
        <div class="winner-modal-body" id="winnerModalName"></div>
        <button id="winnerModalClose" class="btn-primary winner-modal-close">OK</button>
    </div>
</div>

<script>
/* =============================================================
   STATE
============================================================= */
let entries = [];
let winners = [];
let isSpinning = false;
let currentRotation = 0;
let spinDuration = 4000;
let startRotation = 0;
let targetRotation = 0;
let lastRemovedEntry = null;   // for undo
let lastRemovedIndex = null;

const canvas     = document.getElementById('wheelCanvas');
const ctx        = canvas.getContext('2d');
const dpr        = window.devicePixelRatio || 1;
const logicalSize = 420;

canvas.width  = logicalSize * dpr;
canvas.height = logicalSize * dpr;
ctx.scale(dpr, dpr);

const btnSpin        = document.getElementById('btnSpin');
const btnShuffle     = document.getElementById('btnShuffle');
const btnClear       = document.getElementById('btnClear');
const btnUndo        = document.getElementById('btnUndo');
const entriesInput   = document.getElementById('entriesInput');
const chkRemoveWinner= document.getElementById('chkRemoveWinner');

/* =============================================================
   LOCAL STORAGE — persist entries, winners, presets
============================================================= */
const LS_ENTRIES  = 'cw_entries';
const LS_WINNERS  = 'cw_winners';
const LS_PRESETS  = 'cw_presets';
const LS_SHOW     = 'cw_show';
const LS_PRIZE    = 'cw_prize';

function saveState() {
    try {
        localStorage.setItem(LS_ENTRIES, JSON.stringify(entries));
        localStorage.setItem(LS_WINNERS, JSON.stringify(winners));
        localStorage.setItem(LS_SHOW,    showTitleInput.value);
        localStorage.setItem(LS_PRIZE,   prizeInput.value);
    } catch(e) {}
}

function loadState() {
    try {
        const e = localStorage.getItem(LS_ENTRIES);
        const w = localStorage.getItem(LS_WINNERS);
        const s = localStorage.getItem(LS_SHOW);
        const p = localStorage.getItem(LS_PRIZE);
        if (e) { entries = JSON.parse(e); entriesInput.value = entries.join('\n'); }
        if (w) { winners = JSON.parse(w); }
        if (s) { showTitleInput.value = s; }
        if (p) { prizeInput.value     = p; }
    } catch(e) {}
}

/* =============================================================
   PRESETS
============================================================= */
function getPresets() {
    try { return JSON.parse(localStorage.getItem(LS_PRESETS) || '{}'); } catch(e) { return {}; }
}
function savePresets(presets) {
    try { localStorage.setItem(LS_PRESETS, JSON.stringify(presets)); } catch(e) {}
}
function renderPresets() {
    const presets = getPresets();
    presetListEl.innerHTML = '';
    Object.keys(presets).forEach(name => {
        const chip = document.createElement('div');
        chip.className = 'preset-chip';
        chip.innerHTML = `<span>${name}</span><button class="preset-del" title="Delete">×</button>`;
        chip.querySelector('span').addEventListener('click', () => loadPreset(name));
        chip.querySelector('.preset-del').addEventListener('click', (e) => {
            e.stopPropagation();
            deletePreset(name);
        });
        presetListEl.appendChild(chip);
    });
}
function saveCurrentAsPreset() {
    const name = presetNameInput.value.trim();
    if (!name) return;
    const presets = getPresets();
    presets[name] = { entries: entries.slice(), show: showTitleInput.value, prize: prizeInput.value };
    savePresets(presets);
    presetNameInput.value = '';
    renderPresets();
}
function loadPreset(name) {
    const presets = getPresets();
    if (!presets[name]) return;
    const p = presets[name];
    entries = p.entries.slice();
    entriesInput.value = entries.join('\n');
    if (p.show) { showTitleInput.value = p.show; updateShowInfo(); }
    if (p.prize){ prizeInput.value     = p.prize; updateShowInfo(); }
    updateStatus();
    drawWheel();
    saveState();
}
function deletePreset(name) {
    const presets = getPresets();
    delete presets[name];
    savePresets(presets);
    renderPresets();
}

/* =============================================================
   CSV IMPORT
============================================================= */
csvFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        const text = ev.target.result;
        // Split by newline and/or comma, flatten, trim, dedupe blanks
        const names = text
            .split(/[\r\n,]+/)
            .map(s => s.replace(/^["'\s]+|["'\s]+$/g, ''))
            .filter(s => s.length > 0);
        entries = names;
        entriesInput.value = entries.join('\n');
        updateStatus();
        drawWheel();
        saveState();
    };
    reader.readAsText(file);
    csvFileInput.value = '';
});

/* =============================================================
   RANDOM HELPER
============================================================= */
function secureRandom() {
    if (window.crypto && window.crypto.getRandomValues) {
        const arr = new Uint32Array(1);
        window.crypto.getRandomValues(arr);
        return arr[0] / (0xFFFFFFFF + 1);
    }
    return Math.random();
}

        .map(s => s.trim())

}

function shuffleEntries() {
    for (let i = entries.length - 1; i > 0; i--) {
        const j = Math.floor(secureRandom() * (i + 1));
        [entries[i], entries[j]] = [entries[j], entries[i]];
    }
}

}

/* =============================================================
   COLOUR HELPERS
============================================================= */
function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    const c  = (1 - Math.abs(2 * l - 1)) * s;
    const hp = (h % 360) / 60;
    const x  = c * (1 - Math.abs((hp % 2) - 1));
    let r1 = 0, g1 = 0, b1 = 0;
    if (hp < 1)      { r1 = c; g1 = x; }
    else if (hp < 2) { r1 = x; g1 = c; }
    else if (hp < 3) { g1 = c; b1 = x; }
    else if (hp < 4) { g1 = x; b1 = c; }
    else if (hp < 5) { r1 = x; b1 = c; }
    else             { r1 = c; b1 = x; }
    const m = l - c / 2;
    return [r1 + m, g1 + m, b1 + m];
}

function relativeLuminance(rgb) {
    const lin = rgb.map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
}

function textColorForHue(hue) {
    const rgb = hslToRgb(hue, 70, 60);
    return relativeLuminance(rgb) > 0.45 ? "#0b0c0f" : "#e8eaf0";
}

/* =============================================================
   DRAW WHEEL
============================================================= */
function drawWheel() {
    const size    = logicalSize;
    const centerX = size / 2;
    const centerY = size / 2;
    const radius  = size / 2 - 10;

    ctx.clearRect(0, 0, size, size);

    if (entries.length === 0) {
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#12141a";
        ctx.fill();
        ctx.strokeStyle = "#2a2f3a";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#a6adbb";
        ctx.font = "16px Inter";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("No entries", 0, -8);
        ctx.font = "12px Inter";
        ctx.fillText("Type names to update wheel", 0, 14);
        ctx.restore();
        drawPointer();
        return;
    }

    const sliceAngle = (Math.PI * 2) / entries.length;
    const baseStart  = -Math.PI / 2 - sliceAngle / 2;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(currentRotation);

    for (let i = 0; i < entries.length; i++) {
        const startAngle = baseStart + i * sliceAngle;
        const endAngle   = startAngle + sliceAngle;
        const hue        = (i / entries.length) * 360;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
        ctx.fill();
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.save();
        const midAngle = startAngle + sliceAngle / 2;
        ctx.rotate(midAngle);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = textColorForHue(hue);
        ctx.font = "bold 16px Inter";
        ctx.translate(radius * 0.6, 0);
        const label = entries[i];
        const maxChars = 26;
        const text = label.length > maxChars ? label.slice(0, maxChars) + "…" : label;
        ctx.fillText(text, 0, 0, radius * 0.9);
        ctx.restore();
    }

    // Center circle
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = "#000000";
    ctx.fill();
    ctx.strokeStyle = "#2a2f3a";
    ctx.lineWidth = 2;
    ctx.stroke();

    if (logoLoaded && logoImg.width && logoImg.height) {
        const maxSize = radius * 0.32;
        const scale   = Math.min(1, maxSize / logoImg.width, maxSize / logoImg.height);
        const drawW   = logoImg.width  * scale;
        const drawH   = logoImg.height * scale;
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.25 - 3, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(logoImg, -drawW / 2, -drawH / 2, drawW, drawH);
        ctx.restore();
    } else {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 22px Inter";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("XODIA", 0, 0);
    }

    ctx.restore();
    drawPointer();
}

function drawPointer(glowing) {
    const size        = logicalSize;
    const centerX     = size / 2;
    const centerY     = size / 2;
    const radius      = size / 2 - 10;
    const pLen        = 26;
    const pWidth      = 18;
    const topOfCircle = centerY - radius;
    const baseY       = topOfCircle - pLen + 10;

    ctx.save();
    ctx.translate(centerX, baseY);

    if (glowing) {
        ctx.shadowColor  = '#acc7ff';
        ctx.shadowBlur   = 18;
    }

    ctx.beginPath();
    ctx.moveTo(-pWidth / 2, 0);
    ctx.lineTo(pWidth / 2, 0);
    ctx.lineTo(0, pLen);
    ctx.closePath();
    ctx.fillStyle   = glowing ? '#acc7ff' : '#1967E9';
    ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth   = 2;
    ctx.stroke();
    ctx.restore();
}

   CONFETTI
============================================================= */
const confettiCanvas = document.getElementById('confetti-canvas');
const cctx = confettiCanvas.getContext('2d');
let confettiPieces = [];
let confettiAnim = null;

function resizeConfettiCanvas() {
    confettiCanvas.width  = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeConfettiCanvas);
resizeConfettiCanvas();

function launchConfetti() {
    confettiPieces = [];
    const colors = ['#acc7ff','#498fff','#a8edea','#fed6e3','#ffecd2','#c3f0ca','#f9d423','#ff6b6b'];
    for (let i = 0; i < 140; i++) {
        confettiPieces.push({
            x:     Math.random() * confettiCanvas.width,
            y:     -10 - Math.random() * 200,
            w:     6 + Math.random() * 8,
            h:     10 + Math.random() * 8,
            color: colors[Math.floor(Math.random() * colors.length)],
            angle: Math.random() * Math.PI * 2,
            spin:  (Math.random() - 0.5) * 0.2,
            vx:    (Math.random() - 0.5) * 3,
            vy:    2 + Math.random() * 4,
            life:  1,
            decay: 0.004 + Math.random() * 0.004
        });
    }
    if (confettiAnim) cancelAnimationFrame(confettiAnim);
    animateConfetti();
}

function animateConfetti() {
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    confettiPieces = confettiPieces.filter(p => p.life > 0);
    confettiPieces.forEach(p => {
        p.x     += p.vx;
        p.y     += p.vy;
        p.angle += p.spin;
        p.life  -= p.decay;
        cctx.save();
        cctx.globalAlpha = Math.max(0, p.life);
        cctx.translate(p.x, p.y);
        cctx.rotate(p.angle);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        cctx.restore();
    });
    if (confettiPieces.length > 0) {
        confettiAnim = requestAnimationFrame(animateConfetti);
    } else {
        cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
}

/* =============================================================
   SOUND (Web Audio API — no external files)
============================================================= */
let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

function playTick() {
    try {
        const ac  = getAudioCtx();
        const osc = ac.createOscillator();
        const g   = ac.createGain();
        osc.connect(g);
        g.connect(ac.destination);
        osc.frequency.setValueAtTime(600 + Math.random() * 200, ac.currentTime);
        g.gain.setValueAtTime(0.06, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.04);
        osc.start(ac.currentTime);
        osc.stop(ac.currentTime + 0.04);
    } catch(e) {}
}

function playFanfare() {
    try {
        const ac   = getAudioCtx();
        const notes = [523, 659, 784, 1047];
        notes.forEach((freq, i) => {
            const osc = ac.createOscillator();
            const g   = ac.createGain();
            osc.connect(g);
            g.connect(ac.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ac.currentTime + i * 0.12);
            g.gain.setValueAtTime(0, ac.currentTime + i * 0.12);
            g.gain.linearRampToValueAtTime(0.12, ac.currentTime + i * 0.12 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i * 0.12 + 0.25);
            osc.start(ac.currentTime + i * 0.12);
            osc.stop(ac.currentTime + i * 0.12 + 0.3);
        });
    } catch(e) {}
}

/* =============================================================
   SPINNING
============================================================= */
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

// Tick sound: track last segment index during spin
let lastTickIndex = -1;

function spinWheel() {
    if (isSpinning) return;
    if (entries.length === 0) {
        statusLine.textContent = "Add some entries first.";
        return;
    }

    isSpinning     = true;
    btnSpin.disabled = true;
    statusLine.textContent = "Spinning…";
    lastTickIndex  = -1;

    // resume AudioContext on user gesture
    try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch(e) {}

    startRotation  = currentRotation % (Math.PI * 2);
    const spins    = 3 + Math.floor(secureRandom() * 3);
    const extra    = secureRandom() * Math.PI * 2;
    targetRotation = startRotation + spins * Math.PI * 2 + extra;

    const startTime = performance.now();

    function animate(now) {
        const elapsed = now - startTime;
        const t       = Math.min(1, elapsed / spinDuration);
        const eased   = easeOutCubic(t);
        currentRotation = startRotation + (targetRotation - startRotation) * eased;

        // Tick on each new segment passing the pointer
        if (entries.length > 0) {
            const sliceAngle   = (Math.PI * 2) / entries.length;
            const normalised   = (((-Math.PI / 2) - (currentRotation % (Math.PI * 2))) + Math.PI * 4) % (Math.PI * 2);
            const currentIndex = Math.floor(normalised / sliceAngle) % entries.length;
            if (currentIndex !== lastTickIndex) {
                playTick();
                lastTickIndex = currentIndex;
            }
        }

        drawWheel();

        if (t < 1) {
            requestAnimationFrame(animate);
        } else {
            finishSpin();
        }
    }

    requestAnimationFrame(animate);
}

function finishSpin() {
    isSpinning = false;
    btnSpin.disabled = false;

    if (entries.length === 0) {
        statusLine.textContent = "No entries left.";
        return;
    }

    const sliceAngle     = (Math.PI * 2) / entries.length;
    const baseStart      = -Math.PI / 2 - sliceAngle / 2;
    const pointerAngle   = -Math.PI / 2;
    let   paw            = pointerAngle - (currentRotation % (Math.PI * 2));
    paw = (paw + Math.PI * 2) % (Math.PI * 2);
    let normalized = paw - baseStart;
    normalized = (normalized + Math.PI * 2) % (Math.PI * 2);
    let index = Math.floor(normalized / sliceAngle);
    if (index < 0) index = 0;
    if (index >= entries.length) index = entries.length - 1;

    const winnerName = entries[index];

    // Pointer glow
    canvas.classList.add('pointer-glow');
    drawWheel();
    drawPointer(true);
    setTimeout(() => { canvas.classList.remove('pointer-glow'); drawWheel(); }, 1200);

    showWinner(winnerName);
    addWinnerToHistory(winnerName);
    playFanfare();
    launchConfetti();
    openWinnerModal(winnerName);

    // Announce for screen readers
    announcer.textContent = `The winner is ${winnerName}!`;

    if (chkRemoveWinner.checked) {
        lastRemovedEntry = winnerName;
        lastRemovedIndex = index;
        entries.splice(index, 1);
        entriesInput.value = entries.join('\n');
        btnUndo.classList.add('visible');
    }

    updateStatus();
    drawWheel();
    saveState();
}

function showWinner(name) {
    winnerDisplay.innerHTML = name ? `<span>Winner: ${name}</span>` : "";
}

function addWinnerToHistory(name) {
    if (!name) return;
    const stamp = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    winners.unshift({ name, time: stamp });
    updateHistory();
}

/* =============================================================
   HISTORY & STATUS
============================================================= */
function updateHistory() {
    historyList.innerHTML = "";
    if (winners.length === 0) {
        historyList.innerHTML = `<div style="color:#999;font-size:12px;">No spins yet.</div>`;
        return;
    }
    winners.forEach((w, idx) => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
            <div class="history-index">${winners.length - idx}.</div>
            <div class="history-name">${w.name}</div>
            <div class="history-time">${w.time}</div>`;
        historyList.appendChild(div);
    });
}

function updateStatus() {
    if (entries.length === 0) {
        statusLine.textContent = "Start typing names to update the wheel.";
    } else {
        statusLine.textContent = `Ready: ${entries.length} entr${entries.length === 1 ? "y" : "ies"} on the wheel.`;
    }
}

/* =============================================================
   UNDO
============================================================= */
btnUndo.addEventListener('click', () => {
    if (lastRemovedEntry === null) return;
    entries.splice(lastRemovedIndex, 0, lastRemovedEntry);
    entriesInput.value = entries.join('\n');
    lastRemovedEntry = null;
    lastRemovedIndex = null;
    btnUndo.classList.remove('visible');
    updateStatus();
    drawWheel();
    saveState();
});

/* =============================================================
   TOUCH SWIPE TO SPIN
============================================================= */
let touchStartY = null;
canvas.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
canvas.addEventListener('touchend', (e) => {
    if (touchStartY === null) return;
    const dy = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(dy) > 30) spinWheel(); // swipe up/down to spin
    else spinWheel();                   // tap to spin
    touchStartY = null;
});

/* =============================================================
   EVENT HOOKUP
============================================================= */
entriesInput.addEventListener("input", parseEntriesFromTextarea);

btnShuffle.addEventListener("click", () => {
    if (entries.length === 0) parseEntriesFromTextarea();
    shuffleEntries();
    entriesInput.value = entries.join("\n");
    updateStatus();
    drawWheel();
    saveState();
});

btnClear.addEventListener("click", clearAll);
btnSpin.addEventListener("click", spinWheel);
canvas.addEventListener("click", spinWheel);

// Keyboard: Space/Enter on canvas or anywhere (when modal closed)
canvas.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); spinWheel(); }
});
window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeWinnerModal(); return; }
    const activeTag = document.activeElement ? document.activeElement.tagName : '';
    if ((e.key === ' ' || e.key === 'Enter') && !winnerModal.classList.contains('active') && activeTag !== 'INPUT' && activeTag !== 'TEXTAREA') {
        e.preventDefault();
        spinWheel();
    }
});

winnerModalClose.addEventListener("click", closeWinnerModal);
winnerModal.addEventListener("click", (e) => { if (e.target === winnerModal) closeWinnerModal(); });

btnSavePreset.addEventListener('click', saveCurrentAsPreset);
presetNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveCurrentAsPreset(); });

/* =============================================================
   INIT
============================================================= */
loadState();
renderPresets();
updateShowInfo();
updateHistory();
updateStatus();
// Wait for Inter font to load before first draw so canvas uses the correct typeface
document.fonts.ready.then(() => drawWheel());
</script>

</div>

<script>
/* ======= NAV DROPDOWN ======= */
const navDropdown = document.getElementById('navDropdown');
const navToggle   = document.getElementById('navToggle');

navToggle.addEventListener('click', function(e) {
    e.stopPropagation();
    navDropdown.classList.toggle('active');
});

document.addEventListener('click', function(e) {
    if (!navDropdown.contains(e.target)) navDropdown.classList.remove('active');
});

document.querySelectorAll('.nav-menu a').forEach(link => {
    link.addEventListener('click', () => navDropdown.classList.remove('active'));
});
</script>
</body>
