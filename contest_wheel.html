<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contest Spinner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<!-- gif.js for GIF encoding -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<!-- ffmpeg.wasm for WebM -> MP4 conversion -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/ffmpeg.min.js"></script>

<style>
    :root {
        --green: #228B22;
        --green-dark: #1d701d;
        --bg: #f5f5f5;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Rajdhani', sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 24px;
        color: #111;
    }

    h1 {
        text-align: center;
        font-size: 28px;
        margin-bottom: 10px;
        font-weight: 700;
    }

    .subtitle {
        text-align: center;
        font-size: 14px;
        margin-bottom: 24px;
        color: #555;
    }

    .layout {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
    }

    .panel {
        background: #fafafa;
        padding: 18px;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .panel-input {
        flex: 1 1 320px;
        min-width: 280px;
    }

    .panel-wheel {
        flex: 1 1 400px;
        min-width: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 6px;
    }

    textarea {
        width: 100%;
        height: 260px;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-family: 'Rajdhani', monospace;
        font-size: 14px;
        resize: vertical;
    }

    .hint {
        font-size: 12px;
        color: #777;
        margin-top: 4px;
        margin-bottom: 8px;
    }

    .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
        margin-bottom: 10px;
    }

    button {
        padding: 8px 14px;
        font-family: 'Rajdhani', sans-serif;
        font-size: 14px;
        font-weight: 700;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s ease;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
    }

    button:active {
        transform: translateY(1px);
        box-shadow: 0 2px 6px rgba(0,0,0,0.15) inset;
    }

    .btn-primary {
        background: var(--green);
        color: #fff;
    }

    .btn-primary:hover {
        background: var(--green-dark);
    }

    .btn-ghost {
        background: #e9e9e9;
        color: #333;
    }

    .btn-ghost:hover {
        background: #ddd;
    }

    .options-row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        margin-top: 6px;
        font-size: 13px;
    }

    .options-row input[type="checkbox"] {
        margin-right: 5px;
    }

    .spin-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }

    canvas {
        background: #ffffff;
        border-radius: 50%;
        box-shadow: 0 4px 18px rgba(0,0,0,0.12);
        max-width: 100%;
    }

    .spin-button {
        margin-top: 10px;
        font-size: 16px;
        padding: 10px 24px;
    }

    .spin-button[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .winner-display {
        margin-top: 12px;
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        min-height: 24px;
    }

    .winner-display span {
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(34,139,34,0.08);
        border: 1px solid rgba(34,139,34,0.3);
    }

    .history {
        margin-top: 16px;
        width: 100%;
        max-width: 420px;
    }

    .history-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 4px;
    }

    .history-list {
        border-radius: 8px;
        border: 1px solid #ddd;
        background: #fff;
        max-height: 170px;
        overflow-y: auto;
        padding: 6px 10px;
        font-size: 13px;
    }

    .history-item {
        padding: 3px 0;
        border-bottom: 1px dashed #eee;
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }

    .history-item:last-child {
        border-bottom: none;
    }

    .history-index {
        color: #777;
        min-width: 22px;
    }

    .history-name {
        flex: 1;
    }

    .history-time {
        color: #aaa;
        font-size: 11px;
    }

    .status-line {
        font-size: 12px;
        color: #999;
        margin-top: 4px;
        text-align: center;
    }

    /* Winner modal */
    .winner-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
        z-index: 9999;
    }

    .winner-modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    .winner-modal {
        background: #ffffff;
        border-radius: 14px;
        padding: 20px 24px;
        max-width: 320px;
        width: 90%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        text-align: center;
    }

    .winner-modal-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .winner-modal-body {
        font-size: 16px;
        margin-bottom: 16px;
    }

    .winner-modal-body span {
        font-weight: 700;
    }

    .winner-modal-close {
        width: 100%;
        justify-content: center;
    }

    @media (max-width: 800px) {
        body {
            padding: 16px;
        }
    }
</style>
</head>
<body>

<h1>Contest Spinner</h1>
<div class="subtitle">Enter names, spin the wheel, pick a random winner.</div>

<div class="layout">

    <!-- Input / entries panel -->
    <div class="panel panel-input">
        <label for="entriesInput">Entries (one per line)</label>
        <textarea id="entriesInput" placeholder="Alice&#10;Bob&#10;Charlie&#10;..."></textarea>
        <div class="hint">Each line counts as one entry. Leave duplicates if someone has multiple entries.</div>

        <div class="btn-row">
            <!-- Update button removed -->
            <button class="btn-ghost" id="btnShuffle">Shuffle</button>
            <button class="btn-ghost" id="btnClear">Clear All</button>
        </div>

        <div class="options-row">
            <label><input type="checkbox" id="chkRemoveWinner" checked> Remove winner after each spin</label>

            <label>
                Spin time:
                <select id="spinTimeSelect" style="padding:3px 6px;border-radius:6px;border:1px solid #ccc;font-family:'Rajdhani';font-size:13px;">
                    <option value="2500">Fast</option>
                    <option value="4000" selected>Normal</option>
                    <option value="6000">Slow</option>
                </select>
            </label>

            <label><input type="checkbox" id="chkRecordGif"> Export spin as GIF</label>
            <label><input type="checkbox" id="chkRecordVideo"> Export spin as video</label>
        </div>
    </div>

    <!-- Wheel + winner panel -->
    <div class="panel panel-wheel">
        <div class="spin-area">
            <canvas id="wheelCanvas" width="420" height="420"></canvas>
            <button class="btn-primary spin-button" id="btnSpin">SPIN</button>
            <div class="status-line" id="statusLine">Start typing names to update the wheel.</div>
        </div>

        <div class="winner-display" id="winnerDisplay"></div>

        <div class="history">
            <div class="history-title">Winners History</div>
            <div class="history-list" id="historyList">
                <div style="color:#999;font-size:12px;">No spins yet.</div>
            </div>
        </div>
    </div>

</div>

<!-- Winner message box -->
<div id="winnerModal" class="winner-modal-overlay">
    <div class="winner-modal">
        <div class="winner-modal-title">We have a winner!</div>
        <div class="winner-modal-body">
            "<span id="winnerModalName"></span>"
        </div>
        <button id="winnerModalClose" class="btn-primary winner-modal-close">OK</button>
    </div>
</div>

<script>
/* -----------------------------------------------------------
   STATE
----------------------------------------------------------- */
let entries = [];          // current list of names on the wheel
let winners = [];          // history of winners
let isSpinning = false;
let currentRotation = 0;   // radians
let spinDuration = 4000;   // ms
let startRotation = 0;
let targetRotation = 0;

const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');

// Hi-DPI / sharper rendering
const dpr = window.devicePixelRatio || 1;
const logicalSize = 420; // logical coordinates for drawing

canvas.style.width = logicalSize + "px";
canvas.style.height = logicalSize + "px";
canvas.width = logicalSize * dpr;
canvas.height = logicalSize * dpr;
ctx.scale(dpr, dpr);

const btnSpin = document.getElementById('btnSpin');
const btnShuffle = document.getElementById('btnShuffle');
const btnClear = document.getElementById('btnClear');
const entriesInput = document.getElementById('entriesInput');
const chkRemoveWinner = document.getElementById('chkRemoveWinner');
const chkRecordGif = document.getElementById('chkRecordGif');
const chkRecordVideo = document.getElementById('chkRecordVideo');
const spinTimeSelect = document.getElementById('spinTimeSelect');
const winnerDisplay = document.getElementById('winnerDisplay');
const historyList = document.getElementById('historyList');
const statusLine = document.getElementById('statusLine');

const winnerModal = document.getElementById('winnerModal');
const winnerModalName = document.getElementById('winnerModalName');
const winnerModalClose = document.getElementById('winnerModalClose');

/* GIF recorder state */
let gifRecorder = null;
let isRecordingGif = false;
let gifFrameCount = 0;
const GIF_FPS = 30;
const GIF_FRAME_DELAY = Math.round(1000 / GIF_FPS); // ms between frames

/* VIDEO recorder state */
let videoRecorder = null;
let videoChunks = [];
let isRecordingVideo = false;

/* Winner overlay state (drawn on canvas so it's in the GIF/Video) */
let overlayWinnerName = "";
let overlayActive = false;

/* XODIA logo in the center */
const logoImg = new Image();
let logoLoaded = false;
// Set this to your actual logo source:
// logoImg.src = "xodia-logo.png";
// or base64: logoImg.src = "data:image/png;base64,AAAA...";
logoImg.src = "";
logoImg.onload = () => {
    logoLoaded = true;
    drawWheel();
};

/* ffmpeg.wasm instance for WebM -> MP4 */
let ffmpegInstance = null;
let ffmpegLoading = null;

async function convertWebMToMp4(webmBlob) {
    try {
        if (!window.FFmpeg || !FFmpeg.createFFmpeg) {
            console.warn("FFmpeg.wasm not available.");
            return null;
        }
        const { createFFmpeg, fetchFile } = FFmpeg;

        if (!ffmpegInstance) {
            ffmpegInstance = createFFmpeg({ log: false });
        }

        if (!ffmpegInstance.isLoaded()) {
            if (!ffmpegLoading) {
                ffmpegLoading = ffmpegInstance.load();
            }
            await ffmpegLoading;
        }

        // Write the recorded WebM into ffmpeg's virtual FS
        ffmpegInstance.FS('writeFile', 'input.webm', await fetchFile(webmBlob));

        // High-quality H.264 MP4:
        // - scale to 1080 wide (height auto, multiple of 2) using lanczos
        // - crf 18 ~= visually lossless
        // - preset medium = better quality than veryfast (slower but fine for short clips)
        await ffmpegInstance.run(
            '-i', 'input.webm',
            '-vf', 'scale=1080:-2:flags=lanczos',
            '-c:v', 'libx264',
            '-preset', 'medium',
            '-crf', '18',
            '-pix_fmt', 'yuv420p',
            '-movflags', 'faststart',
            'output.mp4'
        );

        const data = ffmpegInstance.FS('readFile', 'output.mp4');

        // Clean up
        try {
            ffmpegInstance.FS('unlink', 'input.webm');
            ffmpegInstance.FS('unlink', 'output.mp4');
        } catch (e) {}

        return new Blob([data.buffer], { type: 'video/mp4' });
    } catch (err) {
        console.error("FFmpeg conversion error:", err);
        return null;
    }
}

/* -----------------------------------------------------------
   RANDOM HELPER (crypto if available)
----------------------------------------------------------- */
function secureRandom() {
    if (window.crypto && window.crypto.getRandomValues) {
        const arr = new Uint32Array(1);
        window.crypto.getRandomValues(arr);
        return arr[0] / (0xFFFFFFFF + 1);
    }
    return Math.random();
}

/* -----------------------------------------------------------
   ENTRIES HANDLING
----------------------------------------------------------- */
function parseEntriesFromTextarea() {
    const raw = entriesInput.value
        .split('\n')
        .map(s => s.trim())
        .filter(s => s.length > 0);

    entries = raw.slice(); // keep duplicates as-is
    updateStatus();
    drawWheel();
}

function shuffleEntries() {
    for (let i = entries.length - 1; i > 0; i--) {
        const j = Math.floor(secureRandom() * (i + 1));
        [entries[i], entries[j]] = [entries[j], entries[i]];
    }
}

function clearAll() {
    entries = [];
    entriesInput.value = '';
    winners = [];
    overlayActive = false;
    overlayWinnerName = "";
    updateHistory();
    updateStatus();
    winnerDisplay.innerHTML = '';
    drawWheel();
}

/* -----------------------------------------------------------
   DRAWING THE WHEEL + OVERLAY
----------------------------------------------------------- */
function drawWheel() {
    const size = logicalSize;
    const centerX = size / 2;
    const centerY = size / 2;
    const radius = size / 2 - 10;

    ctx.clearRect(0, 0, size, size);

    // No entries: placeholder wheel
    if (entries.length === 0) {
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#f0f0f0";
        ctx.fill();
        ctx.strokeStyle = "#ccc";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#999";
        ctx.font = "16px Rajdhani";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("No entries", 0, -8);
        ctx.font = "12px Rajdhani";
        ctx.fillText("Type names to update wheel", 0, 14);
        ctx.restore();

        drawPointer();
        return;
    }

    const sliceAngle = (Math.PI * 2) / entries.length;
    const baseStart = -Math.PI / 2 - sliceAngle / 2;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(currentRotation);

    // Wedges + labels
    for (let i = 0; i < entries.length; i++) {
        const startAngle = baseStart + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        // Segment fill
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.closePath();
        const hue = (i / entries.length) * 360;
        ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Label
        ctx.save();
        const midAngle = startAngle + sliceAngle / 2;
        ctx.rotate(midAngle);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#222";
        ctx.font = "bold 16px Rajdhani";
        ctx.translate(radius * 0.72, 0);

        const label = entries[i];
        const maxChars = 26;
        const text = label.length > maxChars ? label.slice(0, maxChars) + "…" : label;
        ctx.fillText(text, 0, 0, radius * 0.9);
        ctx.restore();
    }

    // Center circle – BLACK
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = "#000000";
    ctx.fill();
    ctx.strokeStyle = "#ccc";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Logo with correct aspect ratio, no upscaling
    if (logoLoaded && logoImg.width && logoImg.height) {
        const maxSize = radius * 0.32;  // tweak 0.28–0.35 to taste
        const scale = Math.min(
            1,
            maxSize / logoImg.width,
            maxSize / logoImg.height
        );

        const drawW = logoImg.width * scale;
        const drawH = logoImg.height * scale;

        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.25 - 3, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(logoImg, -drawW / 2, -drawH / 2, drawW, drawH);
        ctx.restore();
    } else {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 22px Rajdhani";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("XODIA", 0, 0);
    }

    ctx.restore();

    // Winner overlay drawn on canvas (so it appears in GIF & video)
    if (overlayActive && overlayWinnerName) {
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const boxX = size * 0.1;
        const boxY = size * 0.42;
        const boxW = size * 0.8;
        const boxH = size * 0.16;

        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.fillRect(boxX, boxY, boxW, boxH);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px Rajdhani";
        ctx.fillText("We have a winner!", size / 2, boxY + boxH * 0.35);

        ctx.font = "bold 18px Rajdhani";
        ctx.fillText(`"${overlayWinnerName}"`, size / 2, boxY + boxH * 0.75);

        ctx.restore();
    }

    // Pointer on top
    drawPointer();
}

function drawPointer() {
    const size = logicalSize;
    const centerX = size / 2;
    const centerY = size / 2;
    const radius = size / 2 - 10;

    const pointerLength = 26;
    const pointerWidth = 18;

    const topOfCircle = centerY - radius;
    const baseY = topOfCircle - pointerLength + 10;

    ctx.save();
    ctx.translate(centerX, baseY);
    ctx.beginPath();
    ctx.moveTo(-pointerWidth / 2, 0);
    ctx.lineTo(pointerWidth / 2, 0);
    ctx.lineTo(0, pointerLength);
    ctx.closePath();
    ctx.fillStyle = '#1967E9';
    ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
}

/* -----------------------------------------------------------
   WINNER MODAL
----------------------------------------------------------- */
function openWinnerModal(name) {
    winnerModalName.textContent = name || "";
    winnerModal.classList.add("active");
}

function closeWinnerModal() {
    winnerModal.classList.remove("active");
}

/* -----------------------------------------------------------
   GIF & VIDEO SETUP
----------------------------------------------------------- */
function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
}

function initGifRecorderIfNeeded() {
    if (!chkRecordGif.checked) {
        gifRecorder = null;
        isRecordingGif = false;
        gifFrameCount = 0;
        return;
    }

    isRecordingGif = true;
    gifFrameCount = 0;

    gifRecorder = new GIF({
        workers: 2,
        quality: 10,
        repeat: -1,             // no looping
        width: canvas.width,
        height: canvas.height,
        workerScript: "gif.worker.js"   // local worker in same folder
    });

    gifRecorder.on("finished", function(blob) {
        if (gifFrameCount === 0) {
            statusLine.textContent = "Unable to export GIF (no frames captured). Check logo hosting / CORS.";
            return;
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "spin.gif";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        statusLine.textContent = entries.length
            ? `Ready: ${entries.length} entr${entries.length === 1 ? "y" : "ies"} on the wheel.`
            : "Start typing names to update the wheel.";
    });
}

function initVideoRecorderIfNeeded() {
    if (!chkRecordVideo.checked || typeof MediaRecorder === "undefined" || !canvas.captureStream) {
        isRecordingVideo = false;
        videoRecorder = null;
        videoChunks = [];
        return;
    }

    try {
        const stream = canvas.captureStream(30); // 30 FPS
        videoChunks = [];
        videoRecorder = new MediaRecorder(stream, { mimeType: "video/webm" });

        videoRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) {
                videoChunks.push(e.data);
            }
        };

        videoRecorder.onstop = async () => {
            if (!videoChunks.length) return;
            const webmBlob = new Blob(videoChunks, { type: "video/webm" });

            statusLine.textContent = "Converting video to MP4… (this may take a moment)";
            const mp4Blob = await convertWebMToMp4(webmBlob);

            if (mp4Blob) {
                const url = URL.createObjectURL(mp4Blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "spin.mp4";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                statusLine.textContent = "MP4 downloaded (ready for Instagram).";
            } else {
                // Fallback: download WebM if MP4 failed
                const url = URL.createObjectURL(webmBlob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "spin.webm";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                statusLine.textContent = "Video downloaded as WebM (MP4 conversion unavailable).";
            }
        };

        videoRecorder.start();
        isRecordingVideo = true;
    } catch (e) {
        console.error("Video recording error:", e);
        isRecordingVideo = false;
    }
}

/* -----------------------------------------------------------
   SPINNING
----------------------------------------------------------- */
function spinWheel() {
    if (isSpinning) return;
    if (entries.length === 0) {
        alert("Add some entries first.");
        return;
    }

    isSpinning = true;
    btnSpin.disabled = true;
    overlayActive = false;  // clear any previous overlay during spin
    overlayWinnerName = "";
    statusLine.textContent =
        chkRecordGif.checked || chkRecordVideo.checked
            ? "Spinning + recording…"
            : "Spinning…";

    // Spin duration from select
    spinDuration = parseInt(spinTimeSelect.value, 10) || 4000;

    // Init GIF and video recorders if needed
    initGifRecorderIfNeeded();
    initVideoRecorderIfNeeded();

    startRotation = currentRotation % (Math.PI * 2);

    const spins = 3 + Math.floor(secureRandom() * 3); // 3–5 full rotations
    const extra = secureRandom() * Math.PI * 2;       // random final offset
    targetRotation = startRotation + spins * Math.PI * 2 + extra;

    const startTime = performance.now();
    let lastGifFrameTime = startTime;

    function animate(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / spinDuration);
        const eased = easeOutCubic(t);
        currentRotation = startRotation + (targetRotation - startRotation) * eased;

        drawWheel();

        // Add frame to GIF at ~GIF_FPS
        if (isRecordingGif && gifRecorder) {
            if (now - lastGifFrameTime >= GIF_FRAME_DELAY) {
                lastGifFrameTime = now;
                gifFrameCount++;
                try {
                    gifRecorder.addFrame(canvas, { copy: true, delay: GIF_FRAME_DELAY });
                } catch (e) {
                    console.error("GIF addFrame error:", e);
                    isRecordingGif = false;
                    statusLine.textContent = "GIF recording error (likely CORS / logo issue).";
                }
            }
        }

        if (t < 1) {
            requestAnimationFrame(animate);
        } else {
            finishSpin();
        }
    }

    requestAnimationFrame(animate);
}

function finishSpin() {
    isSpinning = false;
    btnSpin.disabled = false;

    if (entries.length === 0) {
        statusLine.textContent = "No entries left.";
        if (isRecordingGif && gifRecorder) {
            statusLine.textContent = "Rendering GIF…";
            gifRecorder.render();
            isRecordingGif = false;
        }
        if (isRecordingVideo && videoRecorder) {
            try { videoRecorder.stop(); } catch (e) { console.error(e); }
            isRecordingVideo = false;
        }
        return;
    }

    const sliceAngle = (Math.PI * 2) / entries.length;
    const baseStart = -Math.PI / 2 - sliceAngle / 2;
    const pointerAngleFixed = -Math.PI / 2; // top

    let pointerAngleWheel = pointerAngleFixed - (currentRotation % (Math.PI * 2));
    pointerAngleWheel = (pointerAngleWheel + Math.PI * 2) % (Math.PI * 2);

    let normalized = pointerAngleWheel - baseStart;
    normalized = (normalized + Math.PI * 2) % (Math.PI * 2);

    let index = Math.floor(normalized / sliceAngle);
    if (index < 0) index = 0;
    if (index >= entries.length) index = entries.length - 1;

    const winnerName = entries[index];

    showWinner(winnerName);
    addWinnerToHistory(winnerName);

    // Turn on overlay so it's drawn on the wheel (and in GIF/video)
    overlayWinnerName = winnerName;
    overlayActive = true;
    drawWheel();

    // Modal message box
    openWinnerModal(winnerName);

    if (chkRemoveWinner.checked) {
        entries.splice(index, 1);
        entriesInput.value = entries.join("\n");
    }

    updateStatus();

    // Finish GIF – add a few extra frames with the overlay visible
    if (isRecordingGif && gifRecorder) {
        try {
            for (let i = 0; i < 15; i++) { // ~0.5s at 30 FPS
                gifRecorder.addFrame(canvas, { copy: true, delay: GIF_FRAME_DELAY });
                gifFrameCount++;
            }
        } catch (e) {
            console.error("GIF addFrame (overlay) error:", e);
        }

        statusLine.textContent = "Rendering GIF…";
        gifRecorder.render();
        isRecordingGif = false;
    }

    // Stop video recording after overlay is shown
    if (isRecordingVideo && videoRecorder) {
        try { videoRecorder.stop(); } catch (e) { console.error("Error stopping video recorder:", e); }
        isRecordingVideo = false;
    }
}

function showWinner(name) {
    winnerDisplay.innerHTML = name
        ? `<span>Winner: ${name}</span>`
        : "";
}

function addWinnerToHistory(name) {
    if (!name) return;
    const time = new Date();
    const stamp = time.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    winners.unshift({ name, time: stamp }); // newest first
    updateHistory();
}

/* -----------------------------------------------------------
   HISTORY & STATUS
----------------------------------------------------------- */
function updateHistory() {
    historyList.innerHTML = "";

    if (winners.length === 0) {
        historyList.innerHTML = `<div style="color:#999;font-size:12px;">No spins yet.</div>`;
        return;
    }

    winners.forEach((w, idx) => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
            <div class="history-index">${winners.length - idx}.</div>
            <div class="history-name">${w.name}</div>
            <div class="history-time">${w.time}</div>
        `;
        historyList.appendChild(div);
    });
}

function updateStatus() {
    if (entries.length === 0) {
        statusLine.textContent = "Start typing names to update the wheel.";
    } else {
        statusLine.textContent = `Ready: ${entries.length} entr${entries.length === 1 ? "y" : "ies"} on the wheel.`;
    }
}

/* -----------------------------------------------------------
   EVENT HOOKUP
----------------------------------------------------------- */
// LIVE updates: wheel changes instantly as you type
entriesInput.addEventListener("input", parseEntriesFromTextarea);

btnShuffle.addEventListener("click", () => {
    if (entries.length === 0) {
        parseEntriesFromTextarea();
    }
    shuffleEntries();
    entriesInput.value = entries.join("\n");
    updateStatus();
    drawWheel();
});
btnClear.addEventListener("click", clearAll);
btnSpin.addEventListener("click", spinWheel);

// Allow clicking wheel to spin
canvas.addEventListener("click", spinWheel);

// Winner modal close handlers
winnerModalClose.addEventListener("click", closeWinnerModal);
winnerModal.addEventListener("click", (e) => {
    if (e.target === winnerModal) closeWinnerModal();
});
window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeWinnerModal();
});

// Initial paint
drawWheel();
</script>
