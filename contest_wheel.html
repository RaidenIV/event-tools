<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contest Spinner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --green: #228B22;
        --green-dark: #1d701d;
        --bg: #f5f5f5;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Rajdhani', sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 24px;
        color: #111;
    }

    h1 {
        text-align: center;
        font-size: 32px;
        margin-bottom: 10px;
        font-weight: 700;
    }

    .back-button {
        position: fixed;
        top: 18px;
        left: 18px;
        background: #228B22;
        color: #fff;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        z-index: 9999;
        font-weight: 700;
    }

    .subtitle {
        text-align: center;
        font-size: 14px;
        margin-bottom: 24px;
        color: #555;
    }

    .layout {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
    }

    .panel {
        background: #fafafa;
        padding: 18px;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.06);
        width: 100%;          /* <-- change from 60% to 100% */
        max-width: 900px;     /* still keeps it nice on desktop */
    }

    .panel-input {
        min-width: 280px;
    }

    .panel-wheel {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 6px;
    }

    textarea {
        width: 100%;
        height: 260px;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-family: 'Rajdhani', monospace;
        font-size: 16px;
        resize: vertical;
        font-weight: 600; /* USER INPUT BOLD */
    }

    input[type="text"] {
        width: 100%;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-family: 'Rajdhani', sans-serif;
        font-size: 16px;
        margin-bottom: 8px;
        font-weight: 600; /* USER INPUT BOLD */
    }

    .hint {
        font-size: 12px;
        color: #777;
        margin-top: 4px;
        margin-bottom: 8px;
    }

    .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
        margin-bottom: 10px;
    }

    button {
        padding: 8px 14px;
        font-family: 'Rajdhani', sans-serif;
        font-size: 14px;
        font-weight: 700;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s ease;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
    }

    button:active {
        transform: translateY(1px);
        box-shadow: 0 2px 6px rgba(0,0,0,0.15) inset;
    }

    .btn-primary {
        background: var(--green);
        color: #fff;
    }

    .btn-primary:hover {
        background: var(--green-dark);
    }

    .btn-ghost {
        background: #e9e9e9;
        color: #333;
    }

    .btn-ghost:hover {
        background: #ddd;
    }

    .options-row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        margin-top: 6px;
        font-size: 13px;
    }

    .options-row input[type="checkbox"] {
        margin-right: 5px;
    }

    .spin-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }

    canvas {
        background: #ffffff;
        border-radius: 50%;
        box-shadow: 0 4px 18px rgba(0,0,0,0.12);
        width: 100%;          /* fill the panel width */
        max-width: 420px;      /* don’t get bigger than your logical size */
        height: auto;          /* let height follow width */
        aspect-ratio: 1 / 1;   /* keep it perfectly square */
    }

    .spin-button {
        margin-top: 10px;
        font-size: 16px;
        padding: 10px 24px;
    }

    .spin-button[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .winner-display {
        margin-top: 12px;
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        min-height: 24px;
    }

    .winner-display span {
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(34,139,34,0.08);
        border: 1px solid rgba(34,139,34,0.3);
    }

    .history {
        margin-top: 16px;
        width: 100%;
        max-width: 420px;
    }

    .history-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 4px;
    }

    .history-list {
        border-radius: 8px;
        border: 1px solid #ddd;
        background: #fff;
        max-height: 170px;
        overflow-y: auto;
        padding: 6px 10px;
        font-size: 14px;
        font-weight: 600;
    }

    .history-item {
        padding: 3px 0;
        border-bottom: 1px dashed #eee;
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }

    .history-item:last-child {
        border-bottom: none;
    }

    .history-index {
        color: #777;
        min-width: 22px;
    }

    .history-name {
        flex: 1;
    }

    .history-time {
        color: #000000;
        font-size: 12px;
        font-weight: 600;
    }

    .status-line {
        font-size: 12px;
        color: #999;
        margin-top: 4px;
        text-align: center;
    }

    /* Show title / prize above wheel */
    .show-info {
        text-align: center;
        margin-bottom: 8px;
    }

    .show-title-display {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 2px;
    }

    .prize-display {
        font-size: 14px;
        color: #333;
    }

    /* Winner modal */
    .winner-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
        z-index: 9999;
    }

    .winner-modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    .winner-modal {
        background: #ffffff;
        border-radius: 14px;
        padding: 20px 24px;
        max-width: 320px;
        width: 90%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        text-align: center;
    }

    .winner-modal-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .winner-modal-body {
        font-size: 16px;
        margin-bottom: 16px;
    }

    .winner-modal-body span {
        font-weight: 700;
    }

    .winner-modal-close {
        width: 100%;
        justify-content: center;
    }

    @media (max-width: 800px) {
        body {
            padding: 16px;
        }
    }
</style>
</head>
<body>
    <button class="back-button" onclick="window.location.href='https://www.xodiamediagroup.com/tools'">⬅</button>

<h1>Contest Wheel</h1>
<div class="layout">

    <!-- Wheel + winner panel (TOP) -->
    <div class="panel panel-wheel">
        <div class="spin-area">

            <!-- Show title + prize (display above wheel) -->
            <div class="show-info">
                <div id="showTitleDisplay" class="show-title-display"></div>
                <div id="prizeDisplay" class="prize-display"></div>
            </div>

            <canvas id="wheelCanvas" width="420" height="420"></canvas>
            <button class="btn-primary spin-button" id="btnSpin">SPIN</button>
            <div class="status-line" id="statusLine">Start typing names to update the wheel.</div>
        </div>

        <div class="winner-display" id="winnerDisplay"></div>

        <div class="history">
            <div class="history-title">Winners History</div>
            <div class="history-list" id="historyList">
                <div style="color:#999;font-size:12px;">No spins yet.</div>
            </div>
        </div>
    </div>

    <!-- Input / entries panel (BOTTOM) -->
    <div class="panel panel-input">

        <label for="showTitleInput">Show Title</label>
        <input id="showTitleInput" type="text" placeholder="SPACE CAMP: SKRILLEX">

        <label for="prizeInput">Prize</label>
        <input id="prizeInput" type="text" placeholder="2 Free Tickets!">

        <label for="entriesInput">Entries (one per line)</label>
        <textarea id="entriesInput" placeholder="Alice&#10;Bob&#10;Charlie&#10;..."></textarea>
        <div class="hint">Each line counts as one entry. Leave duplicates if someone has multiple entries.</div>

        <div class="btn-row">
            <button class="btn-ghost" id="btnShuffle">Shuffle</button>
            <button class="btn-ghost" id="btnClear">Clear All</button>
        </div>

        <div class="options-row">
            <!-- DEFAULT: unchecked now (removed 'checked') -->
            <label><input type="checkbox" id="chkRemoveWinner"> Remove winner after each spin</label>

            <label>
                Spin time:
                <select id="spinTimeSelect" style="padding:3px 6px;border-radius:6px;border:1px solid #ccc;font-family:'Rajdhani';font-size:13px;">
                    <option value="2500">Fast</option>
                    <option value="4000" selected>Normal</option>
                    <option value="6000">Slow</option>
                </select>
            </label>
        </div>
    </div>

</div>

<!-- Winner message box (white modal) -->
<div id="winnerModal" class="winner-modal-overlay">
    <div class="winner-modal">
        <div class="winner-modal-title">We have a winner!</div>
        <div class="winner-modal-body">
            "<span id="winnerModalName"></span>"
        </div>
        <button id="winnerModalClose" class="btn-primary winner-modal-close">OK</button>
    </div>
</div>

logoImg.onload = () => {
    logoLoaded = true;

/* -----------------------------------------------------------
   SHOW TITLE / PRIZE
----------------------------------------------------------- */
function updateShowInfo() {
    showTitleDisplay.textContent = showTitleInput.value.trim();
    prizeDisplay.textContent = prizeInput.value.trim();
}

showTitleInput.addEventListener('input', updateShowInfo);
prizeInput.addEventListener('input', updateShowInfo);

/* -----------------------------------------------------------
   RANDOM HELPER (crypto if available)
----------------------------------------------------------- */
function secureRandom() {
    if (window.crypto && window.crypto.getRandomValues) {
        const arr = new Uint32Array(1);
        window.crypto.getRandomValues(arr);
        return arr[0] / (0xFFFFFFFF + 1);
    }
    return Math.random();
}

/* -----------------------------------------------------------
   ENTRIES HANDLING
----------------------------------------------------------- */
function parseEntriesFromTextarea() {
    const raw = entriesInput.value
        .split('\n')
        .map(s => s.trim())
        .filter(s => s.length > 0);

    entries = raw.slice(); // keep duplicates as-is
    updateStatus();
    drawWheel();
}

function shuffleEntries() {
    for (let i = entries.length - 1; i > 0; i--) {
        const j = Math.floor(secureRandom() * (i + 1));
        [entries[i], entries[j]] = [entries[j], entries[i]];
    }
}

function clearAll() {
    entries = [];
    entriesInput.value = '';
    winners = [];
    updateHistory();
    updateStatus();
    winnerDisplay.innerHTML = '';
    drawWheel();
}

/* -----------------------------------------------------------
   DRAWING THE WHEEL
----------------------------------------------------------- */
function drawWheel() {
    const size = logicalSize;
    const centerX = size / 2;
    const centerY = size / 2;
    const radius = size / 2 - 10;

    ctx.clearRect(0, 0, size, size);

    // No entries: placeholder wheel
    if (entries.length === 0) {
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#f0f0f0";
        ctx.fill();
        ctx.strokeStyle = "#ccc";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#999";
        ctx.font = "16px Rajdhani";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("No entries", 0, -8);
        ctx.font = "12px Rajdhani";
        ctx.fillText("Type names to update wheel", 0, 14);
        ctx.restore();

        drawPointer();
        return;
    }

    const sliceAngle = (Math.PI * 2) / entries.length;
    const baseStart = -Math.PI / 2 - sliceAngle / 2;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(currentRotation);

    // Wedges + labels
    for (let i = 0; i < entries.length; i++) {
        const startAngle = baseStart + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        // Segment fill
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.closePath();
        const hue = (i / entries.length) * 360;
        ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Label
        ctx.save();
        const midAngle = startAngle + sliceAngle / 2;
        ctx.rotate(midAngle);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#222";
        ctx.font = "bold 16px Rajdhani";

        // Text closer to center so it's not on the edge
        ctx.translate(radius * 0.6, 0);

        const label = entries[i];
        const maxChars = 26;
        const text = label.length > maxChars ? label.slice(0, maxChars) + "…" : label;
        ctx.fillText(text, 0, 0, radius * 0.9);
        ctx.restore();
    }

    // Center circle – BLACK
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = "#000000";
    ctx.fill();
    ctx.strokeStyle = "#ccc";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Logo with correct aspect ratio, no upscaling
    if (logoLoaded && logoImg.width && logoImg.height) {
        const maxSize = radius * 0.32;
        const scale = Math.min(
            1,
            maxSize / logoImg.width,
            maxSize / logoImg.height
        );

        const drawW = logoImg.width * scale;
        const drawH = logoImg.height * scale;

        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.25 - 3, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(logoImg, -drawW / 2, -drawH / 2, drawW, drawH);
        ctx.restore();
    } else {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 22px Rajdhani";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("XODIA", 0, 0);
    }

    ctx.restore();

    // Pointer on top
    drawPointer();
}

function drawPointer() {
    const size = logicalSize;
    const centerX = size / 2;
    const centerY = size / 2;
    const radius = size / 2 - 10;

    const pointerLength = 26;
    const pointerWidth = 18;

    const topOfCircle = centerY - radius;
    const baseY = topOfCircle - pointerLength + 10;

    ctx.save();
    ctx.translate(centerX, baseY);
    ctx.beginPath();
    ctx.moveTo(-pointerWidth / 2, 0);
    ctx.lineTo(pointerWidth / 2, 0);
    ctx.lineTo(0, pointerLength);
    ctx.closePath();
    ctx.fillStyle = '#1967E9';
    ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
}

/* -----------------------------------------------------------
   WINNER MODAL
----------------------------------------------------------- */
function openWinnerModal(name) {
    winnerModalName.textContent = name || "";
    winnerModal.classList.add("active");
}

function closeWinnerModal() {
    winnerModal.classList.remove("active");
}

/* -----------------------------------------------------------
   SPINNING
----------------------------------------------------------- */
function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
}

function spinWheel() {
    if (isSpinning) return;
    if (entries.length === 0) {
        alert("Add some entries first.");
        return;
    }

    isSpinning = true;
    btnSpin.disabled = true;
    statusLine.textContent = "Spinning…";

    // Spin duration from select
    spinDuration = parseInt(spinTimeSelect.value, 10) || 4000;

    startRotation = currentRotation % (Math.PI * 2);

    const spins = 3 + Math.floor(secureRandom() * 3); // 3–5 full rotations
    const extra = secureRandom() * Math.PI * 2;       // random final offset
    targetRotation = startRotation + spins * Math.PI * 2 + extra;

    const startTime = performance.now();

    function animate(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / spinDuration);
        const eased = easeOutCubic(t);
        currentRotation = startRotation + (targetRotation - startRotation) * eased;

        drawWheel();

        if (t < 1) {
            requestAnimationFrame(animate);
        } else {
            finishSpin();
        }
    }

    requestAnimationFrame(animate);
}

function finishSpin() {
    isSpinning = false;
    btnSpin.disabled = false;

    if (entries.length === 0) {
        statusLine.textContent = "No entries left.";
        return;
    }

    const sliceAngle = (Math.PI * 2) / entries.length;
    const baseStart = -Math.PI / 2 - sliceAngle / 2;
    const pointerAngleFixed = -Math.PI / 2; // top

    let pointerAngleWheel = pointerAngleFixed - (currentRotation % (Math.PI * 2));
    pointerAngleWheel = (pointerAngleWheel + Math.PI * 2) % (Math.PI * 2);

    let normalized = pointerAngleWheel - baseStart;
    normalized = (normalized + Math.PI * 2) % (Math.PI * 2);

    let index = Math.floor(normalized / sliceAngle);
    if (index < 0) index = 0;
    if (index >= entries.length) index = entries.length - 1;

    const winnerName = entries[index];

    showWinner(winnerName);
    addWinnerToHistory(winnerName);

    // Show only the white modal
    openWinnerModal(winnerName);

    if (chkRemoveWinner.checked) {
        entries.splice(index, 1);
        entriesInput.value = entries.join("\n");
    }

    updateStatus();
    drawWheel(); // redraw wheel (possibly without the removed winner)
}

function showWinner(name) {
    winnerDisplay.innerHTML = name
        ? `<span>Winner: ${name}</span>`
        : "";
}

function addWinnerToHistory(name) {
    if (!name) return;
    const time = new Date();
    const stamp = time.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    winners.unshift({ name, time: stamp }); // newest first
    updateHistory();
}

/* -----------------------------------------------------------
   HISTORY & STATUS
----------------------------------------------------------- */
function updateHistory() {
    historyList.innerHTML = "";

    if (winners.length === 0) {
        historyList.innerHTML = `<div style="color:#999;font-size:12px;">No spins yet.</div>`;
        return;
    }

    winners.forEach((w, idx) => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
            <div class="history-index">${winners.length - idx}.</div>
            <div class="history-name">${w.name}</div>
            <div class="history-time">${w.time}</div>
        `;
        historyList.appendChild(div);
    });
}

function updateStatus() {
    if (entries.length === 0) {
        statusLine.textContent = "Start typing names to update the wheel.";
    } else {
        statusLine.textContent = `Ready: ${entries.length} entr${entries.length === 1 ? "y" : "ies"} on the wheel.`;
    }
}

/* -----------------------------------------------------------
   EVENT HOOKUP
----------------------------------------------------------- */
// LIVE updates: wheel changes instantly as you type
entriesInput.addEventListener("input", parseEntriesFromTextarea);

btnShuffle.addEventListener("click", () => {
    if (entries.length === 0) {
        parseEntriesFromTextarea();
    }
    shuffleEntries();
    entriesInput.value = entries.join("\n");
    updateStatus();
    drawWheel();
});
btnClear.addEventListener("click", clearAll);
btnSpin.addEventListener("click", spinWheel);

// Allow clicking wheel to spin
canvas.addEventListener("click", spinWheel);

// Winner modal close handlers
winnerModalClose.addEventListener("click", closeWinnerModal);
winnerModal.addEventListener("click", (e) => {
    if (e.target === winnerModal) closeWinnerModal();
});
window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeWinnerModal();
});

// Initial paint + initial show info
updateShowInfo();
drawWheel();
