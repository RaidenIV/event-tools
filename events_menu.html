<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap');

/* Hide Squarespace header on this page */
#header {
    display: none !important;
}

/* Hide footer */
#footer-sections {
    display: none !important;
}

/* Make the page full screen */
#page {
    padding: 0 !important;
    margin: 0 !important;
}

.page-section {
    padding: 0 !important;
    min-height: 100vh !important;
}

:root {
    --primary: #0099ff;
    --secondary: #00ffff;
    --darker: #000000;
    --light: #ffffff;
    /* Shared top UI height (Menu button + top logo) */
    --top-ui-height: 48px;
}

* {
    font-family: 'Rajdhani', sans-serif;
}

/* Force Rajdhani for headings (Squarespace can override h1/h2/h3) */
#homepage-container h1,
#homepage-container h2,
#homepage-container h3,
.tagline {
    font-family: 'Rajdhani', sans-serif !important;
}

.tagline {
    font-weight: 900 !important;
}

/* --- Three.js background layer --- */
#three-bg{
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: #000; /* fallback */
}

body {
    overflow: hidden !important;
    height: 100vh;
}

/* Navigation Dropdown */
.nav-dropdown {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
}

.nav-toggle {
    background: rgba(26, 26, 26, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    height: var(--top-ui-height);
    padding: 0 16px;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.nav-toggle:hover {
    background: rgba(36, 36, 36, 0.9);
    border-color: var(--primary);
}

.nav-menu {
    position: absolute;
    top: 60px;
    left: 0;
    background: rgba(26, 26, 26, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    padding: 8px;
    min-width: 180px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.nav-dropdown.active .nav-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.nav-menu a {
    display: block;
    padding: 12px 16px;
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.nav-menu a:hover {
    background: rgba(0, 153, 255, 0.1);
    color: var(--primary);
}

/* Main Container */

/* Squarespace code-block/section padding resets (prevents the page from being pushed down) */
#page,
.page-section,
.content-wrapper,
.sqs-block,
.sqs-block-content {
    padding: 0 !important;
    margin: 0 !important;
}

/* Ensure our full-screen container ignores Squarespace layout flow */
#homepage-container {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100vh;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    /* Top padding keeps content visually aligned with the fixed Menu button */
    padding: 20px 30px 40px;
    box-sizing: border-box;
    overflow: hidden;
    z-index: 10;
}

/* Page Logo */
.page-logo {
    height: var(--top-ui-height);
    width: auto;
    max-width: 85vw;
    display: block;
    margin: 10px 0 8px 0;
    filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.18));
}

/* Tagline */
.tagline {
    color: #ffffff;
    font-size: 72px;
    font-weight: 900;
    text-align: center;
    margin: 0 0 10px 0;
    letter-spacing: 2px;
    text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
}

/* Subtitle */
.subtitle {
    color: rgba(255, 255, 255, 0.7);
    font-size: 18px;
    font-weight: 500;
    text-align: center;
    margin: 0 0 30px 0;
    letter-spacing: 1px;
}

/* Events Grid */
.events-grid {
    width: 100%;
    max-width: 1400px;
    display: flex;
    gap: 30px;
    margin-bottom: 30px;
    justify-content: center;
    flex-wrap: wrap;
}

/* Event Card */
.event-card {
    background: linear-gradient(135deg, rgba(26, 26, 26, 0.8) 0%, rgba(20, 20, 20, 0.9) 100%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    text-decoration: none;
    color: #ffffff;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    width: 320px;
    flex-shrink: 0;
}

.event-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent 0%, rgba(0, 153, 255, 0.1) 50%, transparent 100%);
    transition: left 0.6s ease;
    z-index: 1;
}

.event-card:hover::before {
    left: 100%;
}

.event-card-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, #0099ff 0%, #00ffff 100%);
    opacity: 0;
    transition: opacity 0.4s ease;
}

.event-card:hover .event-card-bg {
    opacity: 0.1;
}

.event-card:hover {
    border-color: #0099ff;
    transform: translateY(-8px);
    box-shadow: 0 15px 40px rgba(0, 153, 255, 0.3), inset 0 1px 0 rgba(0, 153, 255, 0.5);
}

/* Flyer Thumbnail */
.event-flyer {
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    position: relative;
    z-index: 2;
    border-radius: 12px;
    margin: 12px;
    width: calc(100% - 24px);
}

.event-flyer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
}

.event-card:hover .event-flyer img {
    transform: scale(1.05);
}

/* Event Content */
.event-content {
    padding: 16px 24px 24px 24px;
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.event-title {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 8px 0;
    color: #ffffff;
}

.event-venue {
    font-size: 14px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.7);
    margin: 0 0 12px 0;
}

.event-description {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.5;
    margin: 0 0 16px 0;
    flex: 1;
}

.event-date {
    font-size: 13px;
    color: #0099ff;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.event-arrow {
    position: absolute;
    bottom: 24px;
    right: 24px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 153, 255, 0.1);
    border-radius: 50%;
    transition: all 0.3s ease;
}

.event-card:hover .event-arrow {
    background: rgba(0, 153, 255, 0.2);
    transform: translateX(4px);
}

.event-arrow-icon {
    width: 20px;
    height: 20px;
    color: #0099ff;
}

.event-card-shine {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.1) 50%, transparent 100%);
    z-index: 3;
    pointer-events: none;
}

.event-card:hover .event-card-shine {
    animation: cardShine 1.2s ease;
}

@keyframes cardShine {
    0% {
        left: -100%;
    }
    100% {
        left: 100%;
    }
}

/* Social Media Icons */
.social-container {
    margin-top: 0;
    display: flex;
    gap: 2rem;
    justify-content: center;
    align-items: center;
}

.social-icon {
    color: rgba(255, 255, 255, 0.5);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.social-icon:hover {
    color: var(--primary);
    transform: translateY(-3px);
}

/* Short desktop screens (e.g., 1366x768) */
@media (max-height: 800px) {
    /* Allow vertical scroll if content exceeds viewport height */
    #homepage-container {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        -webkit-overflow-scrolling: touch;
        padding: 14px 24px 26px; /* reduce vertical padding */
    }

    /* Slightly tighten top branding spacing */
    .page-logo {
        margin: 6px 0 6px 0;
    }

    .tagline {
        font-size: 56px; /* was 72px */
        margin: 0 0 8px 0;
    }

    .subtitle {
        margin: 0 0 20px 0;
        font-size: 16px; /* was 18px */
    }

    /* Tighten grid spacing so header stays visible */
    .events-grid {
        gap: 22px;       /* was 30px */
        margin-bottom: 22px; /* was 30px */
    }

    .social-container {
        gap: 1.5rem;     /* was 2rem */
    }
}

/* Responsive Design */
@media (max-width: 768px) {
    /* Mobile scrolling: allow the full-page container to scroll */
    #homepage-container {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        -webkit-overflow-scrolling: touch;
    }

    :root {
        --top-ui-height: 44px;
    }
    /* Page Logo - Mobile */
    .page-logo {
        margin: 8px 0 6px 0;
    }
    .tagline {
        font-size: 48px;
        margin: 0 0 8px 0;
    }
    
    .subtitle {
        font-size: 16px;
        margin-bottom: 20px;
    }
    
    .events-grid {
        flex-direction: column;
        align-items: center;
        gap: 24px;
        margin-bottom: 20px;
    }
    
    .event-card {
        width: 100%;
        max-width: 320px;
    }
    
    #homepage-container {
        padding: 15px 20px 30px;
    }
    
    .social-container {
        margin-top: 0;
        gap: 1.5rem;
    }

    .social-icon svg {
        width: 28px;
        height: 28px;
    }
}

@media (max-width: 480px) {
    :root {
        --top-ui-height: 42px;
    }
    /* Page Logo - Small Mobile */
    .page-logo {
        margin: 6px 0 6px 0;
    }
    .tagline {
        font-size: 36px;
        margin: 0 0 6px 0;
    }
    
    .subtitle {
        font-size: 14px;
        margin-bottom: 15px;
    }
    
    .event-title {
        font-size: 20px;
    }
    
    .event-card {
        width: 100%;
        max-width: 280px;
    }
}
</style>

<script>
// Navigation dropdown toggle
const navDropdown = document.getElementById('navDropdown');
const navToggle = document.getElementById('navToggle');

navToggle.addEventListener('click', function(e) {
    e.stopPropagation();
    navDropdown.classList.toggle('active');
});

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
    if (!navDropdown.contains(e.target)) {
        navDropdown.classList.remove('active');
    }
});

// Close dropdown when clicking a link
const navLinks = document.querySelectorAll('.nav-menu a');
navLinks.forEach(link => {
    link.addEventListener('click', function() {
        navDropdown.classList.remove('active');
    });
});
</script>

<script type="module">
  import * as THREE from "https://unpkg.com/three@0.160.1/build/three.module.js";

  const mount = document.getElementById("three-bg");
  if (!mount) throw new Error("three-bg mount not found");

  // Basic WebGL support check
  const canvas = document.createElement("canvas");
  const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
  if (!gl) {
    mount.style.background = "#000";
  } else {
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    mount.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 40, 100); // Add subtle fog for depth

    const camera = new THREE.PerspectiveCamera(
      12.5,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );
    camera.position.set(0, 18, 28);
    camera.lookAt(0, 0, 0);

    // Lights
    const key = new THREE.DirectionalLight(0xffffff, 4.0); // Main key light    
    key.position.set(10, 30, 10);
    key.castShadow = true;
    key.shadow.mapSize.width = 2048;
    key.shadow.mapSize.height = 2048;
    key.shadow.camera.left = -30;
    key.shadow.camera.right = 30;
    key.shadow.camera.top = 30;
    key.shadow.camera.bottom = -30;
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 100;
    key.shadow.bias = -0.0001;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0xffffff, 2.5); // Rim light
    rim.position.set(-20, 15, -10);
    rim.castShadow = true;
    rim.shadow.mapSize.width = 2048;
    rim.shadow.mapSize.height = 2048;
    rim.shadow.camera.left = -30;
    rim.shadow.camera.right = 30;
    rim.shadow.camera.top = 30;
    rim.shadow.camera.bottom = -30;
    scene.add(rim);

    scene.add(new THREE.AmbientLight(0xffffff, 0.3));// Base ambient light - reduced to make shadows more visible

    // Hex tiles (instanced)
    const HEX_R = 0.65; // Hexagon radius (distance from center to vertex)
    const HEX_H = 4.5; // Hexagon height

    const hexGeo = new THREE.CylinderGeometry(HEX_R, HEX_R, 1, 6, 1, false);
    hexGeo.rotateY(Math.PI / 6); //

    const mat = new THREE.MeshStandardMaterial({
      color: 0x242424, // Lighter grey
      roughness: 0.0, // Smooth, reflective surface
      metalness: 0.9, // Highly metallic for strong reflections
      emissive: 0x000000,     // No emissive color
      emissiveIntensity: 0.0      // No emissive glow
    });

    const isMobile = matchMedia("(max-width: 768px)").matches;
    const GRID = isMobile ? 34 : 52; // Number of hexes along the width, reduced for mobile to maintain performance
    const rows = Math.round(GRID * 0.72*2); // Adjust rows based on grid width for a balanced layout
    const count = GRID * rows; // Total number of hex tiles

    const mesh = new THREE.InstancedMesh(hexGeo, mat, count);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    // Ground plane to receive shadows
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ 
      color: 0x0a0a0a,
      roughness: 0.8,
      metalness: 0.2
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -2.5;
    ground.receiveShadow = true;
    scene.add(ground);

    const xStep = HEX_R * 1.5;
    const zStep = HEX_R * Math.sqrt(3);

    const tile = new Array(count);
    let k = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < GRID; c++) {
        const x = (c - GRID / 2) * xStep;
        const z = (r - rows / 2) * zStep + (c % 2 ? zStep * 0.5 : 0);
        tile[k++] = { x, z };
      }
    }

    // Fast layered trig "noise"
    function fBm(x, z, t) {
      let a = 1.0, f = 0.12, sum = 0.0;
      for (let i = 0; i < 4; i++) {
        sum += a * Math.sin((x * f + t * 0.35) + Math.cos(z * f - t * 0.25));
        sum += a * Math.cos((z * f - t * 0.30) + Math.sin(x * f + t * 0.20));
        a *= 0.5;
        f *= 2.05;
      }
      return sum * 0.55;
    }

    // Subtle parallax
    const pointer = { x: 0, y: 0 };
    window.addEventListener("mousemove", (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
    }, { passive: true });

    const dummy = new THREE.Object3D();
    const baseY = -2.0;

    // Movement reversal tracking with smooth transitions
    let currentDirection = 1; // Current direction (smoothly animated)
    let targetDirection = 1;  // Target direction (1 or -1)
    let lastHoveredCard = -1;
    let animationTime = 0; // Separate time tracking that can go forward/backward

    // Add hover listeners to EVENT CARDS (changed from nav-card)
    const eventCards = document.querySelectorAll('.event-card');
    eventCards.forEach((card, index) => {
      card.addEventListener('mouseenter', () => {
        // Only reverse if hovering over a different card
        if (lastHoveredCard !== index) {
          targetDirection *= -1; // Flip target direction
          lastHoveredCard = index;
        }
      });
    });

    let lastFrameTime = 0;

    function animate(tMs) {
      // Calculate delta time
      const deltaTime = lastFrameTime === 0 ? 0 : (tMs - lastFrameTime) * 0.001;
      lastFrameTime = tMs;

      // Smoothly transition current direction toward target direction
      currentDirection = THREE.MathUtils.lerp(currentDirection, targetDirection, 0.05);
      
      // Update animation time based on current direction (maintains constant speed)
      animationTime += deltaTime * currentDirection;

      const px = pointer.x * 1.6;
      const py = pointer.y * 0.9;
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, px, 0.04);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, 18 + (-py), 0.04);
      camera.lookAt(0, 0, 0);

      for (let i = 0; i < count; i++) {
        const { x, z } = tile[i];

        const n = fBm(x, z, animationTime);
        const h = THREE.MathUtils.clamp((n + 1.25) * 0.55, 0.1, 1.0);

        dummy.position.set(x, baseY + h * (HEX_H * 0.35), z);
        dummy.scale.set(1, h * HEX_H, 1);
        dummy.rotation.y = 0.10 * Math.sin(animationTime * 0.35 + (x + z) * 0.05);

        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      mesh.instanceMatrix.needsUpdate = true;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }, { passive: true });
  }
</script>
