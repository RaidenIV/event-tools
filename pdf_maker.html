<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFER PDF Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    
<!-- Theme bootstrap: default DARK, persist in localStorage -->
<script>
(function () {
    try {
        var saved = localStorage.getItem('xmg_theme');
        var theme = saved || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
/* ======= NAVIGATION MENU (from navigation_menu.html) ======= */
:root {
    --accent: #0099ff;
    --top-ui-height: 48px;

    /* Dark theme tokens for this page */
    --bg: #0b0b0c;
    --panel: #131316;
    --text: #f2f2f4;
    --muted: #a7a7ad;
    --line: #2a2a2f;
    --input-bg: #0f0f12;
    --button-bg: #1b1b20;
    --button-hover: #22222a;
}

/* ---------- GLOBAL DARK MODE (no toggle) ---------- */
html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
}

/* Preserve original layout intent (centered narrow column) */
body {
    width: 75%;
    margin: 0 auto;
    padding: 20px 5%;
    max-width: none;
    box-sizing: border-box;
}


/* Single unified card (title + subtitle + form) */
.app-card {
    background: var(--panel);
    padding: 30px;
    border-radius: 12px;
    border: 1px solid var(--line);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    width: 40%;
    box-sizing: border-box;
    margin: 0 auto;
}

/* Form stays visually identical (inputs unchanged); remove inner card styling */
.app-card form {
    background: transparent;
    padding: 0;
    border: none;
    box-shadow: none;
    width: 100%;
    margin: 0;
}

/* ---------- SINGLE CARD: 2-COLUMN FORM LAYOUT ---------- */
.form-columns{
    display: block;
}

.form-col{
    width: 100%;
}


/* Keep checkbox alignment intact within column */
.form-col .checkbox{
    margin-top: 10px;
}

/* Keep header text inside the card */
/* Card header (title + logo) */
.card-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 6px;
}

.card-title{
    margin: 0;
    color: var(--text);
    text-align: left;
    line-height: 1.1;
}

.xmg-logo{
    height: 34px;
    width: auto;
    object-fit: contain;
    display: block;
}

.app-subtitle{
    text-align: left;
    max-width: none;
    margin: 0 0 20px;
    color: var(--muted);
}

@media (max-width: 480px){
    .xmg-logo{ height: 28px; }
    .card-title{ font-size: 26px; }
}


label { font-weight: 700; display: block; margin-top: 15px; color: var(--muted); }

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    box-sizing: border-box;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    background: var(--input-bg);
    outline: none;
}

input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,153,255,0.12);
}

.checkbox {
    display: flex;
    align-items: center;
    margin-top: 10px;
    gap: 10px;
}

.checkbox input[type="checkbox"] {
    width: auto;
    margin: 0;
    accent-color: var(--accent);
}

.checkbox label {
    margin: 0;
    color: var(--text);
    font-weight: 600;
}

button {
    background: #228B22;
    color: white;
    padding: 15px;
    border: none;
    cursor: pointer;
    margin-top: 25px;
    width: 100%;
    font-size: 18px;
    border-radius: 10px;
    font-weight: 800;
    transition: transform 0.15s ease, filter 0.2s ease;
}

button:hover { filter: brightness(1.05); }
button:active { transform: translateY(1px); }

@media (max-width: 768px) {
    body { width: 100%; padding: 20px 16px; }
    .app-card { width: 100%; padding: 20px; }
    label { font-size: 14px; }
}

/* ======= NAVIGATION MENU ======= */
.nav-dropdown {
    position: fixed;
    top: -7px;
    left: 18px;
    z-index: 10000;
}

.nav-toggle {
    position: relative;
    z-index: 10002;
    pointer-events: auto;
    background: rgba(26, 26, 26, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    height: var(--top-ui-height);
    padding: 0 16px;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    font-family: 'Rajdhani', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.nav-toggle:hover {
    background: rgba(36, 36, 36, 0.9);
    border-color: var(--accent);
}

.nav-menu {
    position: absolute;
    top: calc(var(--top-ui-height) + 38px);
    left: 0;
    background: rgba(26, 26, 26, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    padding: 8px;
    min-width: 160px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
    pointer-events: none;
}

.nav-dropdown.active .nav-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    pointer-events: auto;
}

.nav-menu a,
.nav-menu button.nav-item-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 16px;
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Rajdhani', sans-serif;
    border-radius: 8px;
    transition: all 0.3s ease;
    background: transparent;
    border: none;
    cursor: pointer;
    box-sizing: border-box;
}

.nav-menu a:hover,
.nav-menu button.nav-item-btn:hover {
    background: rgba(0, 153, 255, 0.12);
    color: var(--accent);
}



/* ---------- COLOR SCHEME (prevents light native input styling) ---------- */
html{
    color-scheme: dark;
}

/* Brave/Chromium note:
   `color-scheme: dark` can cause the native date-picker icon to render gray in some builds.
   Force the DATE control to use the light scheme, then invert the icon so it becomes white. */
input[type="date"]{
    color-scheme: light;
}

/* ---------- FORCE DARK INPUT BACKGROUNDS (including while typing/autofill) ---------- */
input[type="text"],
input[type="date"],
input[type="number"],
textarea,
select{
    background-color: var(--input-bg) !important;
    color: var(--text) !important;
    caret-color: var(--text);
    font-family: 'Rajdhani', sans-serif !important;
    font-weight: 700 !important;
}

/* Keep dark background on focus as well */
input[type="text"]:focus,
input[type="date"]:focus,
input[type="number"]:focus,
textarea:focus,
select:focus{
    background-color: var(--input-bg) !important;
}

/* Chrome/Edge autofill can force a light background — override it */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
textarea:-webkit-autofill,
textarea:-webkit-autofill:hover,
textarea:-webkit-autofill:focus,
select:-webkit-autofill,
select:-webkit-autofill:hover,
select:-webkit-autofill:focus{
    -webkit-text-fill-color: var(--text) !important;
    box-shadow: 0 0 0 1000px var(--input-bg) inset !important;
    -webkit-box-shadow: 0 0 0 1000px var(--input-bg) inset !important;
    transition: background-color 9999s ease-out 0s;
    caret-color: var(--text) !important;
}

/* ---------- FORM CONTROL TYPOGRAPHY (match UI font) ---------- */
input[type="text"],
input[type="date"],
input[type="number"],
textarea,
select{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    color: #ffffff;
}

/* Keep placeholders readable in dark mode */
input::placeholder,
textarea::placeholder{
    color: rgba(255,255,255,0.55);
    font-weight: 600;
}

/* Force date input calendar icon to be white (Chromium/WebKit incl. Brave)
   Approach: date control uses `color-scheme: light;` (above) so the native icon is dark,
   then we invert + bump brightness to ensure it appears white on dark UI. */
input[type="date"]::-webkit-calendar-picker-indicator{
    filter: invert(1) brightness(2);
    opacity: 1;
    cursor: pointer;
}

</style>
</head>
<body>
    
<!-- Navigation Dropdown -->
<div class="nav-dropdown" id="navDropdown">
    <button class="nav-toggle" id="navToggle">Menu</button>
    <div class="nav-menu">
        <a href="https://www.xodiamediagroup.com/" target="_top" rel="noopener">Home</a>
        <a href="https://www.xodiamediagroup.com/upcoming-events" target="_top" rel="noopener">Upcoming Events</a>
        <a href="https://www.xodiamediagroup.com/contact" target="_top" rel="noopener">Contact Us</a>
        <a href="https://www.xodiamediagroup.com/tools" target="_top" rel="noopener">Tools</a>
    </div>
</div>

<div class="app-card">

<div class="card-header">
        <h1 class="card-title">Offer PDF Generator</h1>
        <img class="xmg-logo" src="https://images.squarespace-cdn.com/content/v1/681ea18dd168a935c26295bd/c311da3d-6fbf-446a-858c-227fa011e7e3/Xodia+MEDIA+Group+%28TRANS%29+%281%29+%281%29.png?format=750w" alt="Xodia Media Group">
    </div>
    <p class="app-subtitle">Fill in the details below to generate a talent offer PDF sheet.</p>
    <form id="offerForm">
        <label for="headliner">Headliner Name (e.g., AKIRAH):</label>
        <input type="text" id="headliner" required>

        <label for="date">Date (MM/DD/YYYY, e.g., 08/01/2026):</label>
        <input type="date" id="date" required>

        <label for="ticketPrice">Ticket Price (e.g., 30):</label>
        <input type="text" id="ticketPrice">

        <label for="setTime">Set Time (e.g., 12:30-1:30am):</label>
        <input type="text" id="setTime">

        <label for="offerAmount">Offer Amount (e.g., 2000):</label>
        <input type="text" id="offerAmount">

        <div class="checkbox">
            <input type="checkbox" id="hgr">
            <label for="hgr">Include + HGR</label>
        </div>

        <label for="additionalTerms">Additional Terms (e.g., 1000 at sellout):</label>
        <input type="text" id="additionalTerms">

        <label for="specialRequests">Special Requests:</label>
        <input type="text" id="specialRequests">

        <button type="submit">Generate PDF</button>
</form>
</div>

<script>
        // Set min date to today (11/10/2025) to prevent past dates
        const today = '2025-11-10'; // Hardcoded for consistency; update as needed
        document.getElementById('date').min = today;

        // Helper: Convert YYYY-MM-DD to MM/DD/YYYY for PDF/filename
        function formatDate(isoDate) {
            if (!isoDate) return '';
            const [year, month, day] = isoDate.split('-');
            return `${month}/${day}/${year}`;
        }

        // Base64 for your logo—replace with your actual encoded PNG
        const logoUrl = 'https://images.squarespace-cdn.com/content/v1/681ea18dd168a935c26295bd/7803d573-dd87-40ed-9570-0bc7c5ed8915/xodia_logo_black.png?format=750w';

        // Fetch remote image and convert to a DataURL so jsPDF can embed it reliably.
        // Handles PNG transparency by drawing to canvas and converting to JPEG
        async function loadImageAsDataURL(url) {
            const res = await fetch(url, { mode: 'cors', cache: 'force-cache' });
            if (!res.ok) throw new Error('Failed to fetch logo: ' + res.status);

            const blob = await res.blob();
            
            // Create an image element
            const img = new Image();
            const imgUrl = URL.createObjectURL(blob);
            
            return new Promise((resolve, reject) => {
                img.onload = () => {
                    // Create canvas to convert PNG to format jsPDF handles better
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    
                    // Fill with white background (for transparency)
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Draw image on top
                    ctx.drawImage(img, 0, 0);
                    
                    // Convert to JPEG data URL (better compatibility with jsPDF)
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
                    URL.revokeObjectURL(imgUrl);
                    resolve(dataUrl);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(imgUrl);
                    reject(new Error('Failed to load image'));
                };
                img.src = imgUrl;
            });
        }

        // Fixed venue/promoter data (customize as needed)
        const venueData = {
            name: "Skully's Music Diner",
            address: "1151 N High St, Columbus, OH 43201",
            phone: "(614) 291-8856",
            capacity: "650",
            times: "8-2am",
            age: "18+"
        };
        const promoterData = {
            name: "XODIA Media Group",
            address: "5897 Shadow Lake Circle, Columbus, Ohio 43235",
            website: "https://xodiamediagroup.com",
            phone: "(614) 204-5395",
            email: "xodia.mg@gmail.com",
            signatory: "Dante Evans - XODIA Media Group (@xodiamg)"
        };
        const legalTerms = [
            "Deposit amount not to exceed 50% of guarantee and paid in full the following Wednesday after show.",
            "Artist is not to perform within 180 miles of this venue 30 days prior or following scheduled play date.",
            "Artist will give XODIA 1st chance to bid on talent to maintain history for followup market plays.",
            "Offer expires 10 days after sent."
        ];
        document.getElementById('offerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            // Gather inputs
            const headliner = document.getElementById('headliner').value.trim().toUpperCase();
            const rawDate = document.getElementById('date').value.trim();
            const formattedDate = formatDate(rawDate); // MM/DD/YYYY for PDF/filename
            let ticketPrice = document.getElementById('ticketPrice').value.trim();
            const setTime = document.getElementById('setTime').value.trim();
            let offerAmount = document.getElementById('offerAmount').value.trim();
            const hgr = document.getElementById('hgr').checked;
            let additionalTerms = document.getElementById('additionalTerms').value.trim();
            let specialRequests = document.getElementById('specialRequests').value.trim();
            // Auto-format $ (friendly validation)
            if (ticketPrice && !ticketPrice.startsWith('$') && /^\d+(\.\d{1,2})?$/.test(ticketPrice)) ticketPrice = `$${ticketPrice}`;
            if (offerAmount && !offerAmount.startsWith('$') && /^\d+(\.\d{1,2})?$/.test(offerAmount)) offerAmount = `$${offerAmount}`;
            if (hgr) offerAmount += ' + HGR';
            if (additionalTerms && !additionalTerms.startsWith('$') && /^\d+(\.\d{1,2})?$/.test(additionalTerms.split(' ')[0])) additionalTerms = `$${additionalTerms}`;
            // Validate required
            if (!headliner || !rawDate) {
                alert('Headliner and Date are required!');
                return;
            }
            // Generate PDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            // Add logo (base64 for easy embedding)
            let logoDataUrl = null;
            try {
                logoDataUrl = await loadImageAsDataURL(logoUrl);
            } catch (err) {
                // If the logo cannot be fetched (CORS/network), continue without it.
                logoDataUrl = null;
            }

            if (logoDataUrl) {
                doc.addImage(logoDataUrl, 'JPEG', 85, 5, 40, 15); // Changed to JPEG format
            }
            // Centered title
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(16);
            doc.text('TALENT OFFER SHEET', 105, 35, { align: 'center' });
            // Spacing controls (tweak these numbers as needed)
            const START_Y_AFTER_TITLE = 50;
            const LINE_HEIGHT_WITHIN_SECTION = 5;
            const SPACE_BETWEEN_SECTIONS = 6;
            const LEGAL_TERM_SPACING = 5;
            let yPos = START_Y_AFTER_TITLE;
            // Updated sectionY function with variables
            const sectionY = (text, value, y) => {
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(10);
                doc.text(`${text}`, 10, y);
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(10);
                doc.text(value, 10, y + LINE_HEIGHT_WITHIN_SECTION);
                return y + (LINE_HEIGHT_WITHIN_SECTION + SPACE_BETWEEN_SECTIONS);
            };
            // Artist/Date/Hold
            yPos = sectionY('Artist: ', headliner, yPos);
            yPos = sectionY('Date: ', formattedDate, yPos); // Use formatted date
            yPos = sectionY('Hold: ', 'H1', yPos);
            // Venue sections
            yPos = sectionY('Venue Name: ', venueData.name, yPos);
            yPos = sectionY('Venue Address: ', venueData.address, yPos);
            yPos = sectionY('Venue Phone: ', venueData.phone, yPos);
            yPos = sectionY('Venue Capacity: ', venueData.capacity, yPos);
            yPos = sectionY('Venue Times: ', venueData.times, yPos);
            yPos = sectionY('Age Requirements: ', venueData.age, yPos);
            yPos = sectionY('Ticket Price: ', ticketPrice || '', yPos);
            yPos = sectionY('Set Times: ', setTime, yPos);
            yPos = sectionY('Offer: ', offerAmount, yPos);
            yPos = sectionY('Additional Terms: ', additionalTerms, yPos);
            if (specialRequests) {
                yPos = sectionY('Special Requests: ', specialRequests, yPos);
            }
            // Promoter sections (with special handling for Website link)
            yPos = sectionY('Promoter Name: ', promoterData.name, yPos);
            yPos = sectionY('Promoter Address: ', promoterData.address, yPos);
            // Custom rendering for Promoter Website (displays short text, links full URL)
            let websiteY = yPos;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            doc.text('Promoter Website: ', 10, websiteY);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            const fullWebsiteUrl = promoterData.website;
            const displayWebsiteText = fullWebsiteUrl.replace('https://', '').replace('http://', '').replace('www.', '');
            const websiteX = 10;
            const websiteTextY = websiteY + LINE_HEIGHT_WITHIN_SECTION;
            doc.text(displayWebsiteText, websiteX, websiteTextY);
            // Add clickable link over the displayed website text
            const websiteWidth = doc.getTextWidth(displayWebsiteText);
            const linkHeight = 4;
            const linkY = websiteTextY - 2;
            doc.link(websiteX, linkY, websiteWidth, linkHeight, { url: fullWebsiteUrl });
            yPos = websiteY + (LINE_HEIGHT_WITHIN_SECTION + SPACE_BETWEEN_SECTIONS);
            // Rest of Promoter sections
            yPos = sectionY('Promoter Phone: ', promoterData.phone, yPos);
            yPos = sectionY('Promoter Email: ', promoterData.email, yPos);
            yPos = sectionY('Promoter Signatory: ', promoterData.signatory, yPos);
            // Updated Legal terms with variable spacing
            doc.setFont('arial', 'bold');
            doc.setFontSize(10);
            doc.text('Standard Terms: ', 10, yPos);
            doc.setFont('arial', 'normal');
            yPos += LINE_HEIGHT_WITHIN_SECTION;
            legalTerms.forEach(term => {
                doc.text(term, 10, yPos);
                yPos += LEGAL_TERM_SPACING;
            });
            // FIXED: Use built-in save (reliable download)
            const filename = `${headliner}_offer_${formattedDate.replace(/\//g, '-')}.pdf`;
            doc.save(filename);
            //alert(`Success! PDF saved to your local computer: ${filename}`);
        });
    </script>
<script>
    // Navigation toggle functionality
    window.addEventListener('DOMContentLoaded', function () {
        const navDropdown = document.getElementById('navDropdown');
        const navToggle = document.getElementById('navToggle');

        if (!navDropdown || !navToggle) return;

        navToggle.addEventListener('click', function (e) {
            e.stopPropagation();
            navDropdown.classList.toggle('active');
        });

        document.addEventListener('click', function (e) {
            if (!navDropdown.contains(e.target)) {
                navDropdown.classList.remove('active');
            }
        });

        const navLinks = document.querySelectorAll('.nav-menu a');
        navLinks.forEach(link => {
            link.addEventListener('click', function () {
                navDropdown.classList.remove('active');
            });
        });
    });
</script>

</body>
</html>
