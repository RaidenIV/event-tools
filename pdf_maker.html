<script>
(function () {
    try {
        var saved = localStorage.getItem('xmg_theme');
        document.documentElement.setAttribute('data-theme', saved || 'dark');
    } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
    }

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* ======= DESIGN.MD — BITSTREAM LOGIC TOKENS ======= */
:root {
    --accent:         #acc7ff;
    --accent2:        #498fff;
    --top-ui-height:  48px;

    --bg:             #10131a;
    --panel:          #1d2027;
    --panel-2:        #272a31;
    --text:           #e0e2ec;
    --muted:          #c1c6d6;
    --border:         #414754;
    --line:           #414754;
    --input-bg:       #181c23;
    --shadow:         0 4px 14px rgba(0,0,0,0.55);

    --radius-sm:  0.125rem;
    --radius:     0.25rem;
    --radius-md:  0.375rem;
    --radius-lg:  0.5rem;
}

/* ======= BASE ======= */
*, *::before, *::after { box-sizing: border-box; }

html {
    color-scheme: dark;
    min-height: 100%;
}

html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ======= HAMBURGER NAV (DESIGN.md spec) ======= */
.nav-dropdown {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10000;
}

.nav-toggle {
    background: rgba(29, 32, 39, 0.92);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: var(--top-ui-height);
    height: var(--top-ui-height);
    padding: 0;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s ease, background 0.2s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.nav-toggle:hover {
    background: rgba(39, 42, 49, 0.95);
    border-color: var(--accent);
    color: var(--accent);
}

.nav-toggle-icon {
    position: relative;
    width: 18px;
    height: 2px;
    background: currentColor;
    border-radius: 2px;
    pointer-events: none;
    transition: 0.3s;
}

.nav-toggle-icon::before,
.nav-toggle-icon::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 2px;
    background: currentColor;
    border-radius: 2px;
    left: 0;
    transition: 0.3s;
}

.nav-toggle-icon::before { top: -6px; }
.nav-toggle-icon::after { top: 6px; }

.nav-dropdown.active .nav-toggle-icon { background: transparent; }
.nav-dropdown.active .nav-toggle-icon::before { top: 0; transform: rotate(45deg); }
.nav-dropdown.active .nav-toggle-icon::after { top: 0; transform: rotate(-45deg); }

.nav-menu {
    position: absolute;
    top: 56px;
    left: 0;
    background: rgba(29, 32, 39, 0.97);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    min-width: 180px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: all 0.2s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
}

.nav-dropdown.active .nav-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    pointer-events: auto;
}

.nav-menu a,
.nav-menu button.nav-item-btn {
    display: block;
    text-align: left;
    padding: 10px 16px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    border-radius: 4px;
    transition: background 0.15s ease, color 0.15s ease;
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    box-sizing: border-box;
}

.nav-menu a:hover,
.nav-menu button.nav-item-btn:hover {
    background: rgba(172, 199, 255, 0.08);
    color: var(--accent);
}

/* ======= PAGE LAYOUT ======= */
.page-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 88px 24px 48px;
}

/* ======= APP CARD ======= */
.app-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 28px 28px 32px;
    width: 100%;
    max-width: 480px;
}

/* ======= CARD HEADER ======= */
.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 4px;
}

.card-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
}

.xmg-logo {
    height: 30px;
    width: auto;
    object-fit: contain;
    display: block;
}

.xmg-logo-fixed {
    position: fixed;
    top: 18px;
    right: 18px;
    height: 68px;
    width: auto;
    object-fit: contain;
    display: block;
    z-index: 9999;
    pointer-events: none;
}

.app-subtitle {
    margin: 0 0 22px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
}

/* ======= FORM ======= */
form { margin: 0; }

label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 16px 0 5px;
}

label:first-of-type { margin-top: 0; }

.form-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 12px;
    align-items: end;
}

.form-field { min-width: 0; }
.form-row.form-row-three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-row .form-field > label { margin-top: 16px; }
.form-section-label + .form-divider + .form-row .form-field > label { margin-top: 0; }
.form-row .checkbox {
    min-height: 40px;
    margin-top: 16px;
}

input[type="text"],
input[type="date"],
input[type="number"],
textarea,
select {
    width: 100%;
    background: var(--input-bg) !important;
    color: var(--text) !important;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Inter', sans-serif !important;
    outline: none;
    caret-color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
}

input[type="text"]:focus,
input[type="date"]:focus,
input[type="number"]:focus,
textarea:focus,
select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(172,199,255,0.18);
    background: var(--input-bg) !important;
}

input::placeholder,
textarea::placeholder {
    color: rgba(193,198,214,0.4);
    font-weight: 400;
}

/* Date picker icon */
input[type="date"] { color-scheme: light; }
input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1) brightness(2);
    opacity: 1;
    cursor: pointer;
}

/* Autofill override */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--text) !important;
    box-shadow: 0 0 0 1000px var(--input-bg) inset !important;
    -webkit-box-shadow: 0 0 0 1000px var(--input-bg) inset !important;
    transition: background-color 9999s ease-out 0s;
    caret-color: var(--text) !important;
}

/* ======= DEPOSIT PERCENTAGE TOGGLE ======= */
.deposit-toggle-group {
    display: flex;
    gap: 6px;
    margin-top: 5px;
}

.deposit-toggle-group input[type="radio"] {
    display: none;
}

.deposit-toggle-group label {
    margin: 0;
    flex: 1;
    text-align: center;
    padding: 9px 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
    color: var(--muted);
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
}

.deposit-toggle-group input[type="radio"]:checked + label {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(172,199,255,0.08);
}

.deposit-toggle-group label:hover {
    border-color: var(--accent);
    color: var(--accent);
}

/* ======= CHECKBOX ======= */
.checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
}

.checkbox input[type="checkbox"] {
    width: auto;
    margin: 0;
    accent-color: var(--accent);
    border: none;
    box-shadow: none;
    padding: 0;
    flex-shrink: 0;
}

.checkbox label {
    margin: 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
}

/* ======= SECTION DIVIDER ======= */
.form-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0 14px;
}

.form-section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--border);
    margin: 0 0 2px;
}

/* ======= SUBMIT BUTTON ======= */
.btn-submit {
    display: block;
    width: 100%;
    background: #228B22;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 13px;
    margin-top: 24px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.08s ease;
}

.btn-submit:hover { filter: brightness(1.08); }
.btn-submit:active { transform: translateY(1px); }

/* ======= RESPONSIVE ======= */
@media (max-width: 560px) {
    .page-wrapper { padding: 80px 16px 32px; }
    .app-card { padding: 20px 18px 24px; }
    .card-title { font-size: 18px; }
    .form-row,
    .form-row.form-row-three { grid-template-columns: 1fr; gap: 0; }
    .form-row .checkbox { margin-top: 14px; }
}
</style>
</head>
<body>

<!-- Hamburger Navigation -->
<div class="nav-dropdown" id="navDropdown">
    <button class="nav-toggle" id="navToggle" aria-label="Open navigation menu">
        <span class="nav-toggle-icon"></span>
    </button>

<!-- Fixed top-right logo -->
<img class="xmg-logo-fixed"
     src="https://images.squarespace-cdn.com/content/v1/681ea18dd168a935c26295bd/c311da3d-6fbf-446a-858c-227fa011e7e3/Xodia+MEDIA+Group+%28TRANS%29+%281%29+%281%29.png?format=750w"

<div class="page-wrapper">
<div class="app-card">

    <div class="card-header">
        <h1 class="card-title">Offer PDF Generator</h1>

    <form id="offerForm">

<script>
    // Min date
    document.getElementById('date').min = new Date().toISOString().split('T')[0];

    function formatDate(isoDate) {
        if (!isoDate) return '';
        const [year, month, day] = isoDate.split('-');
        return `${month}/${day}/${year}`;
    }

    const pdfLogoUrl = 'https://images.squarespace-cdn.com/content/v1/681ea18dd168a935c26295bd/7803d573-dd87-40ed-9570-0bc7c5ed8915/xodia_logo_black.png?format=750w';

    async function loadLogoDataUrlForPdf(url) {
        const res = await fetch(url, { mode: 'cors', cache: 'force-cache' });
        if (!res.ok) throw new Error('Failed to fetch logo: ' + res.status);
        const blob = await res.blob();

        let bitmap = null;
        if (window.createImageBitmap) {
            bitmap = await createImageBitmap(blob);
        }

        const MAX_PX = 900;
        let srcW, srcH;

        if (bitmap) {
            srcW = bitmap.width;
            srcH = bitmap.height;
        } else {
            const img = new Image();
            const objUrl = URL.createObjectURL(blob);
            await new Promise((resolve, reject) => {
                img.onload = () => resolve();
                img.onerror = () => reject(new Error('Failed to decode image'));
                img.src = objUrl;
            });
            srcW = img.naturalWidth || img.width;
            srcH = img.naturalHeight || img.height;
            bitmap = img;
            bitmap.__revokeUrl = objUrl;
        }

        const scale = Math.min(1, MAX_PX / Math.max(srcW, srcH));
        const outW  = Math.max(1, Math.round(srcW * scale));
        const outH  = Math.max(1, Math.round(srcH * scale));

        const canvas = document.createElement('canvas');
        canvas.width  = outW;
        canvas.height = outH;
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, outW, outH);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(bitmap, 0, 0, outW, outH);

        if (bitmap && bitmap.__revokeUrl) URL.revokeObjectURL(bitmap.__revokeUrl);
        return canvas.toDataURL('image/png');
    }

    const venueData = {
        name:     "Skully's Music Diner",
        address:  "1151 N High St, Columbus, OH 43201",
        phone:    "(614) 291-8856",
        capacity: "650",
        times:    "8-2am",
        age:      "18+"
    };
    const promoterData = {
        name:      "XODIA Media Group",
        address:   "5897 Shadow Lake Circle, Columbus, Ohio 43235",
        website:   "https://xodiamediagroup.com",
        phone:     "(614) 204-5395",
        email:     "xodia.mg@gmail.com",
        signatory: "Dante Evans - XODIA Media Group (@xodiamg)"
    };

    document.getElementById('offerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const headliner      = document.getElementById('headliner').value.trim();
        const rawDate        = document.getElementById('date').value.trim();
        const formattedDate  = formatDate(rawDate);
        venueData.name       = document.getElementById('venueName').value.trim();
        venueData.address    = document.getElementById('venueAddress').value.trim();
        venueData.phone      = document.getElementById('venuePhone').value.trim();
        venueData.capacity   = document.getElementById('venueCapacity').value.trim();
        venueData.times      = document.getElementById('venueTimes').value.trim();
        let   ticketPrice    = document.getElementById('ticketPrice').value.trim();
        const setTime        = document.getElementById('setTime').value.trim();
        let   offerAmount    = document.getElementById('offerAmount').value.trim();
        const hgr            = document.getElementById('hgr').checked;
        let   additionalTerms= document.getElementById('additionalTerms').value.trim();
        let   specialRequests= document.getElementById('specialRequests').value.trim();

        // Get selected deposit percentage
        const depositPct = document.querySelector('input[name="depositPct"]:checked').value;

        if (ticketPrice   && !ticketPrice.startsWith('$')    && /^\d+(\.\d{1,2})?$/.test(ticketPrice))   ticketPrice    = `$${ticketPrice}`;
        if (offerAmount   && !offerAmount.startsWith('$')    && /^\d+(\.\d{1,2})?$/.test(offerAmount))   offerAmount    = `$${offerAmount}`;
        if (hgr) offerAmount += ' + HGR';
        if (additionalTerms && !additionalTerms.startsWith('$') && /^\d+(\.\d{1,2})?$/.test(additionalTerms.split(' ')[0])) additionalTerms = `$${additionalTerms}`;

        if (!headliner || !rawDate) {
            alert('Headliner and Date are required!');
            return;
        }

        // Build legal terms dynamically using selected deposit %
        const legalTerms = [
            `Deposit amount not to exceed ${depositPct}% of guarantee and paid in full the following Wednesday after show.`,
            "Artist is not to perform within 180 miles of this venue 30 days prior or following scheduled play date.",
            "Artist will give XODIA 1st chance to bid on talent to maintain history for followup market plays.",
            "Offer expires 10 days after sent."
        ];

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        try {
            const logoDataUrl = await loadLogoDataUrlForPdf(pdfLogoUrl);
            doc.addImage(logoDataUrl, 'PNG', 85, 5, 40, 15);
        } catch (err) { /* continue without logo */ }

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(16);
        doc.text('TALENT OFFER SHEET', 105, 35, { align: 'center' });

        const START_Y                  = 50;
        const LINE_H                   = 5;
        const SECTION_GAP              = 6;
        const LEGAL_GAP                = 5;
        let yPos = START_Y;

        const sectionY = (label, value, y) => {
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            doc.text(label, 10, y);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.text(value, 10, y + LINE_H);
            return y + LINE_H + SECTION_GAP;
        };

        yPos = sectionY('Artist: ',           headliner,          yPos);
        yPos = sectionY('Date: ',             formattedDate,      yPos);
        yPos = sectionY('Hold: ',             'H1',               yPos);
        yPos = sectionY('Venue Name: ',       venueData.name,     yPos);
        yPos = sectionY('Venue Address: ',    venueData.address,  yPos);
        yPos = sectionY('Venue Phone: ',      venueData.phone,    yPos);
        yPos = sectionY('Venue Capacity: ',   venueData.capacity, yPos);
        yPos = sectionY('Venue Hours: ',      venueData.times,    yPos);
        yPos = sectionY('Age Requirements: ', venueData.age,      yPos);
        yPos = sectionY('Ticket Price: ',     ticketPrice || '',  yPos);
        yPos = sectionY('Set Times: ',        setTime,            yPos);
        yPos = sectionY('Offer: ',            offerAmount,        yPos);
        yPos = sectionY('Additional Terms: ', additionalTerms,    yPos);
        if (specialRequests) {
            yPos = sectionY('Special Requests: ', specialRequests, yPos);
        }

        yPos = sectionY('Promoter Name: ',    promoterData.name,    yPos);
        yPos = sectionY('Promoter Address: ', promoterData.address, yPos);

        // Website with link
        doc.setFont('helvetica', 'bold');   doc.setFontSize(10);
        doc.text('Promoter Website: ', 10, yPos);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
        const displayUrl = promoterData.website.replace(/^https?:\/\/(www\.)?/, '');
        const wTextY = yPos + LINE_H;
        doc.text(displayUrl, 10, wTextY);
        doc.link(10, wTextY - 2, doc.getTextWidth(displayUrl), 4, { url: promoterData.website });
        yPos = yPos + LINE_H + SECTION_GAP;

        yPos = sectionY('Promoter Phone: ',     promoterData.phone,     yPos);
        yPos = sectionY('Promoter Email: ',     promoterData.email,     yPos);
        yPos = sectionY('Promoter Signatory: ', promoterData.signatory, yPos);

        // Standard Terms
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.text('Standard Terms: ', 10, yPos);
        doc.setFont('helvetica', 'normal');
        yPos += LINE_H;
        legalTerms.forEach(term => {
            doc.text(term, 10, yPos);
            yPos += LEGAL_GAP;
        });

        const filename = `${headliner.toUpperCase()}_offer_${formattedDate.replace(/\//g, '-')}.pdf`;
        doc.save(filename);
    });
</script>

<script>
    window.addEventListener('DOMContentLoaded', function () {
        const navDropdown = document.getElementById('navDropdown');
        const navToggle   = document.getElementById('navToggle');
        if (!navDropdown || !navToggle) return;

        navToggle.addEventListener('click', function (e) {
            e.stopPropagation();
            navDropdown.classList.toggle('active');
        });

        document.addEventListener('click', function (e) {
            if (!navDropdown.contains(e.target)) navDropdown.classList.remove('active');
        });

        document.querySelectorAll('.nav-menu a').forEach(link => {
            link.addEventListener('click', () => navDropdown.classList.remove('active'));
        });
    });
</script>

</body>
</html>
