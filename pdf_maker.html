<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFER PDF Generator</title>
    
    <!-- Theme bootstrap: default DARK, persist in localStorage -->
    <script>
    (function () {
        try {
            var saved = localStorage.getItem('xmg_theme');
            var theme = saved || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        /* ======= CSS CUSTOM PROPERTIES ======= */
        :root {
            --accent: #0099ff;
            --accent2: #00ffff;
            --success: #228B22;
            --success-hover: #1e7a1e;
            --radius: 12px;
            --shadow: 0 10px 30px rgba(0,0,0,0.18);
            --top-ui-height: 48px;
        }

        html[data-theme="light"] {
            --bg: #ffffff;
            --text: #111111;
            --muted: rgba(0,0,0,0.65);
            --panel: #fafafa;
            --panel-2: #ffffff;
            --border: rgba(0,0,0,0.10);
            --border-2: rgba(0,0,0,0.08);
            --input-bg: #ffffff;
            --input-text: #111111;
            --dropdown-arrow: %23333;
        }

        html[data-theme="dark"] {
            --bg: #0b0d10;
            --text: rgba(255,255,255,0.92);
            --muted: rgba(255,255,255,0.65);
            --panel: rgba(18, 20, 24, 0.92);
            --panel-2: rgba(26, 28, 34, 0.92);
            --border: rgba(255,255,255,0.16);
            --border-2: rgba(255,255,255,0.10);
            --input-bg: rgba(255,255,255,0.06);
            --input-text: rgba(255,255,255,0.92);
            --dropdown-arrow: %23ffffff;
        }

        /* Color scheme for native controls */
        html[data-theme="dark"] {
            color-scheme: dark;
        }
        html[data-theme="light"] {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        /* ======= MENU NAV ======= */
        .nav-dropdown {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10000;
        }

        .nav-toggle {
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            height: var(--top-ui-height);
            padding: 0 16px;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        html[data-theme="light"] .nav-toggle {
            background: rgba(245, 245, 245, 0.92);
            border: 1px solid rgba(0, 0, 0, 0.18);
            color: rgba(0,0,0,0.88);
        }

        .nav-toggle:hover {
            background: rgba(36, 36, 36, 0.9);
            border-color: var(--accent);
        }

        html[data-theme="light"] .nav-toggle:hover {
            background: rgba(235, 235, 235, 0.95);
            border-color: var(--accent);
        }

        .nav-menu {
            position: absolute;
            top: 60px;
            left: 0;
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 8px;
            min-width: 180px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        html[data-theme="light"] .nav-menu {
            background: rgba(245, 245, 245, 0.96);
            border: 1px solid rgba(0, 0, 0, 0.16);
        }

        .nav-dropdown.active .nav-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .nav-menu a,
        .nav-menu button.nav-item-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            font-family: 'Rajdhani', sans-serif;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        html[data-theme="light"] .nav-menu a,
        html[data-theme="light"] .nav-menu button.nav-item-btn {
            color: rgba(0,0,0,0.75);
        }

        .nav-menu a:hover,
        .nav-menu button.nav-item-btn:hover {
            background: rgba(0, 153, 255, 0.12);
            color: var(--accent);
        }

        /* ======= MAIN STYLES ======= */
        body {
            font-family: 'Rajdhani', sans-serif;
            width: 75%;
            margin: 0 auto;
            padding: 20px 5%;
            background: var(--bg);
            color: var(--text);
            max-width: none;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        h1 { 
            text-align: center; 
            color: var(--text);
        }

        p { 
            text-align: center; 
            max-width: 800px; 
            margin: 0 auto 20px; 
            color: var(--muted);
        }

        form {
            background: var(--panel);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            width: 40%;
            box-sizing: border-box;
            margin: 0 auto;
        }

        label { 
            font-weight: bold; 
            display: block; 
            margin-top: 15px; 
            color: var(--text);
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-family: 'Rajdhani', sans-serif;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: var(--input-text);
            background: var(--input-bg);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input::placeholder {
            color: var(--muted);
            opacity: 0.6;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 153, 255, 0.15);
        }

        /* Custom dropdown arrow */
        select#venueSelect {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--dropdown-arrow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
            padding-right: 40px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .checkbox input[type="checkbox"] { 
            width: auto; 
            margin-right: 10px;
            cursor: pointer;
        }

        .checkbox label {
            margin: 0;
            cursor: pointer;
        }

        button {
            background: var(--success);
            color: white;
            padding: 15px;
            border: none;
            cursor: pointer;
            margin-top: 25px;
            width: 100%;
            font-size: 18px;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        button:hover { 
            background: var(--success-hover);
        }

        #manualVenueFields {
            display: none;
        }

        @media (max-width: 768px) {
            body { padding: 20px 3%; }
            form { 
                padding: 20px; 
                width: 90%;
            }
            label { font-size: 14px; }
            
            .nav-dropdown {
                top: 10px;
                left: 10px;
            }
        }
    </style>
</head>

    <div class="nav-dropdown" id="navDropdown">

    <h1>Offer PDF Generator</h1>
    <p>Fill in the details below to generate a talent offer PDF sheet.</p>
    
    <form id="offerForm">
        <label for="headliner">Headliner Name (e.g., SKRILLEX):</label>
        <input type="text" id="headliner" required>

        <label for="date">Date (MM/DD/YYYY, e.g., 01/01/2030):</label>
        <input type="date" id="date" required>

        <label for="venueSelect">Select Venue:</label>
        <select id="venueSelect">
            <option value="skullys">Skully's Music Diner</option>
            <option value="arenadistrict">Arena District - Easton Commons</option>
            <option value="bigroom">Big Room Bar</option>
            <option value="manual">Manual Input...</option>
        </select>

        <!-- Manual venue fields (hidden by default) -->
        <div id="manualVenueFields">
            <label for="venueName">Venue Name:</label>
            <input type="text" id="venueName">

            <label for="venueAddress">Venue Address:</label>
            <input type="text" id="venueAddress">

            <label for="venuePhone">Venue Phone:</label>
            <input type="text" id="venuePhone">

            <label for="venueCapacity">Venue Capacity:</label>
            <input type="text" id="venueCapacity">

            <label for="venueTimes">Venue Times:</label>
            <input type="text" id="venueTimes">

            <label for="venueAge">Age Requirements:</label>
            <input type="text" id="venueAge">
        </div>

        <label for="ticketPrice">Ticket Price (e.g., 20 or $20):</label>
        <input type="text" id="ticketPrice">

        <label for="setTime">Set Times (e.g., 11pm-1am):</label>
        <input type="text" id="setTime">

        <label for="offerAmount">Offer Amount (e.g., 5000 or $5000):</label>
        <input type="text" id="offerAmount">

        <div class="checkbox">
            <input type="checkbox" id="hgr">
            <label for="hgr">+ House Gross Receipts (HGR)</label>
        </div>

        <label for="additionalTerms">Additional Terms (optional):</label>
        <input type="text" id="additionalTerms">

        <button type="submit">Generate PDF</button>
    </form>

    <script>
        // ======= MENU TOGGLE LOGIC =======
        const navDropdown = document.getElementById('navDropdown');
        const navToggle = document.getElementById('navToggle');

        navToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            navDropdown.classList.toggle('active');
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!navDropdown.contains(e.target)) {
                navDropdown.classList.remove('active');
            }
        });

        // Close menu when clicking a menu item
        document.querySelectorAll('.nav-menu a, .nav-menu button.nav-item-btn').forEach(item => {
            item.addEventListener('click', () => {
                navDropdown.classList.remove('active');
            });
        });

        // ======= DATE FORMATTER =======
        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const year = d.getFullYear();
            return `${month}/${day}/${year}`;
        }

        // ======= PDF GENERATION =======
        const promoterData = {
            name: "XODIA Media Group",
            address: "5897 Shadow Lake Circle, Columbus, Ohio 43235",
            website: "https://xodiamediagroup.com",
            phone: "(614) 204-5395",
            email: "xodia.mg@gmail.com",
            signatory: "Dante Evans - XODIA Media Group (@xodiamg)"
        };

        const legalTerms = [
            "Deposit amount not to exceed 50% of guarantee and paid in full the following Wednesday after show.",
            "Artist is not to perform within 180 miles of this venue 30 days prior or following scheduled play date.",
            "Artist will give XODIA 1st chance to bid on talent to maintain history for followup market plays.",
            "Offer expires 10 days after sent."
        ];

        document.getElementById('offerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Gather inputs
            const headliner = document.getElementById('headliner').value.trim().toUpperCase();
            const rawDate = document.getElementById('date').value.trim();
            const formattedDate = formatDate(rawDate);
            let ticketPrice = document.getElementById('ticketPrice').value.trim();
            const setTime = document.getElementById('setTime').value.trim();
            let offerAmount = document.getElementById('offerAmount').value.trim();
            const hgr = document.getElementById('hgr').checked;
            let additionalTerms = document.getElementById('additionalTerms').value.trim();

            // Auto-format $
            if (ticketPrice && !ticketPrice.startsWith('$') && /^\d+(\.\d{1,2})?$/.test(ticketPrice)) {
                ticketPrice = `$${ticketPrice}`;
            }
            if (offerAmount && !offerAmount.startsWith('$') && /^\d+(\.\d{1,2})?$/.test(offerAmount)) {
                offerAmount = `$${offerAmount}`;
            }
            if (hgr) offerAmount += ' + HGR';
            if (additionalTerms && !additionalTerms.startsWith('$') && /^\d+(\.\d{1,2})?$/.test(additionalTerms.split(' ')[0])) {
                additionalTerms = `$${additionalTerms}`;
            }

            // Validate required
            if (!headliner || !rawDate) {
                alert('Headliner and Date are required!');
                return;
            }

            // Get venue data
            let venueData = {};
            const selectedVenue = venueSelect.value;
            if (selectedVenue === 'manual') {
                venueData.name = document.getElementById('venueName').value.trim();
                venueData.address = document.getElementById('venueAddress').value.trim();
                venueData.phone = document.getElementById('venuePhone').value.trim();
                venueData.capacity = document.getElementById('venueCapacity').value.trim();
                venueData.times = document.getElementById('venueTimes').value.trim();
                venueData.age = document.getElementById('venueAge').value.trim();
                if (!venueData.name) {
                    alert('Venue Name is required for manual input!');
                    return;
                }
            } else {
                venueData = venues[selectedVenue];
            }

            // Generate PDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Add logo
            if (logoBase64) {
                doc.addImage(logoBase64, 'PNG', 85, 5, 40, 15);
            }

            // Centered title
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(16);
            doc.text('TALENT OFFER SHEET', 105, 35, { align: 'center' });

            // Spacing controls
            const START_Y_AFTER_TITLE = 50;
            const LINE_HEIGHT_WITHIN_SECTION = 5;
            const SPACE_BETWEEN_SECTIONS = 6;
            const LEGAL_TERM_SPACING = 5;
            let yPos = START_Y_AFTER_TITLE;

            // Section function
            const sectionY = (text, value, y) => {
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(10);
                doc.text(`${text}`, 10, y);
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(10);
                doc.text(value, 10, y + LINE_HEIGHT_WITHIN_SECTION);
                return y + (LINE_HEIGHT_WITHIN_SECTION + SPACE_BETWEEN_SECTIONS);
            };

            // Artist/Date/Hold
            yPos = sectionY('Artist: ', headliner, yPos);
            yPos = sectionY('Date: ', formattedDate, yPos);
            yPos = sectionY('Hold: ', 'H1', yPos);

            // Venue sections
            yPos = sectionY('Venue Name: ', venueData.name || '', yPos);
            yPos = sectionY('Venue Address: ', venueData.address || '', yPos);
            yPos = sectionY('Venue Phone: ', venueData.phone || '', yPos);
            yPos = sectionY('Venue Capacity: ', venueData.capacity || '', yPos);
            yPos = sectionY('Venue Times: ', venueData.times || '', yPos);
            yPos = sectionY('Age Requirements: ', venueData.age || '', yPos);

            // Ticket Price, etc.
            yPos = sectionY('Ticket Price: ', ticketPrice || '', yPos);
            yPos = sectionY('Set Times: ', setTime, yPos);
            yPos = sectionY('Offer: ', offerAmount, yPos);
            yPos = sectionY('Additional Terms: ', additionalTerms, yPos);

            // Promoter sections
            yPos = sectionY('Promoter Name: ', promoterData.name, yPos);
            yPos = sectionY('Promoter Address: ', promoterData.address, yPos);

            // Website with link
            let websiteY = yPos;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            doc.text('Promoter Website: ', 10, websiteY);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            const fullWebsiteUrl = promoterData.website;
            const displayWebsiteText = fullWebsiteUrl.replace('https://', '').replace('http://', '').replace('www.', '');
            const websiteX = 10;
            const websiteTextY = websiteY + LINE_HEIGHT_WITHIN_SECTION;
            doc.text(displayWebsiteText, websiteX, websiteTextY);
            const websiteWidth = doc.getTextWidth(displayWebsiteText);
            const linkHeight = 4;
            const linkY = websiteTextY - 2;
            doc.link(websiteX, linkY, websiteWidth, linkHeight, { url: fullWebsiteUrl });
            yPos = websiteY + (LINE_HEIGHT_WITHIN_SECTION + SPACE_BETWEEN_SECTIONS);

            // Rest of promoter
            yPos = sectionY('Promoter Phone: ', promoterData.phone, yPos);
            yPos = sectionY('Promoter Email: ', promoterData.email, yPos);
            yPos = sectionY('Promoter Signatory: ', promoterData.signatory, yPos);

            // Legal terms
            doc.setFont('arial', 'bold');
            doc.setFontSize(10);
            doc.text('Standard Terms: ', 10, yPos);
            doc.setFont('arial', 'normal');
            yPos += LINE_HEIGHT_WITHIN_SECTION;
            legalTerms.forEach(term => {
                doc.text(term, 10, yPos);
                yPos += LEGAL_TERM_SPACING;
            });

            // Save PDF
            const filename = `${headliner}_offer_${formattedDate.replace(/\//g, '-')}.pdf`;
            doc.save(filename);
        });
    </script>
</body>
</html>
