<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PNG to SVG Converter</title>
  <style>
    :root {
      --font-ui: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-heading: var(--font-ui);
      --font-body: var(--font-ui);
      --font-mono: "SF Mono", "SFMono-Regular", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

      --bg: #09090b;
      --surface: #121216;
      --surface-2: #16161a;
      --surface-3: #1b1b21;
      --input-bg: #0d0d10;
      --stage-bg: #0c0c0f;
      --text: #f5f5f7;
      --heading: #ffffff;
      --muted: #a6a6ad;
      --muted-2: #777780;
      --line: #2a2a31;
      --line-soft: #202026;
      --accent: #7c5cff;
      --accent-hover: #9176ff;
      --accent-soft: rgba(124, 92, 255, 0.14);
      --success: #82e6a9;
      --warning: #ffd38a;
      --danger: #ff4d4d;
      --danger-hover: #ff6868;
      --blue: #0099ff;
      --blue-hover: #1aa6ff;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-pill: 999px;
      --focus-ring: 0 0 0 4px rgba(124, 92, 255, 0.24);
      --shadow: none;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.45;
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea { font-family: var(--font-ui); }

    .app-shell {
      width: min(100%, 1440px);
      margin: 0 auto;
      padding: clamp(18px, 3vw, 42px);
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 20px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 850;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--heading);
      font-family: var(--font-heading);
      font-size: clamp(1.05rem, 2.5vw, 2.325rem);
      font-weight: 600;
      letter-spacing: -0.055em;
      line-height: 0.93;
    }

    .subtitle {
      max-width: 760px;
      margin: 16px 0 0;
      color: var(--accent);
      font-size: clamp(0.95rem, 1.4vw, 1.08rem);
    }

    .header-logo {
      justify-self: end;
      align-self: start;
      display: block;
      width: clamp(86px, 11vw, 150px);
      height: auto;
      object-fit: contain;
    }


    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius-pill);
      padding: 8px 13px;
      color: var(--muted);
      white-space: nowrap;
      font-weight: 800;
      font-size: 0.74rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    main {
      display: block;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 18px;
    }

    .panel-heading,
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line-soft);
    }

    .panel-heading h2,
    .toolbar h2 {
      margin: 0;
      color: var(--heading);
      font-size: 1rem;
      font-weight: 850;
      letter-spacing: -0.025em;
    }

    .panel-heading p {
      margin: 4px 0 0;
      color: var(--muted-2);
      font-size: 0.87rem;
    }

    .control-card {
      overflow: hidden;
    }

    .control-body {
      display: grid;
      gap: 16px;
      padding: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--heading);
      font-size: 0.76rem;
      font-weight: 850;
      letter-spacing: 0.075em;
      text-transform: uppercase;
    }

    .dropzone {
      display: grid;
      place-items: center;
      min-height: 178px;
      border: 1.5px dashed #393944;
      border-radius: var(--radius-md);
      background: var(--surface-2);
      cursor: pointer;
      text-align: center;
      padding: 24px 20px;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .dropzone:hover,
    .dropzone.dragover,
    .dropzone:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: var(--focus-ring);
      transform: none;
    }

    .dropzone strong {
      display: block;
      color: var(--heading);
      font-size: 1.08rem;
      margin-bottom: 6px;
    }

    .dropzone span {
      display: block;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 650;
    }

    input[type="file"] { display: none; }

    .controls {
      display: grid;
      gap: 14px;
    }

    .controls.is-hidden {
      display: none;
    }

    .conversion-summary {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }

    .conversion-summary strong {
      color: var(--heading);
      font-size: 0.94rem;
      font-weight: 750;
    }

    .conversion-summary span {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .control-section {
      padding: 14px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }

    select,
    input[type="number"] {
      width: 100%;
      min-height: 43px;
      border: 1px solid var(--line);
      background: var(--input-bg);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px 38px 10px 12px;
      font: inherit;
      font-weight: 650;
      outline: none;
    }

    input[type="color"] {
      width: 100%;
      min-height: 43px;
      border: 1px solid var(--line);
      background: var(--input-bg);
      border-radius: var(--radius-sm);
      padding: 5px;
      cursor: pointer;
      outline: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 7px; }
    input[type="color"]::-moz-color-swatch { border: 0; border-radius: 7px; }

    input[type="color"]:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    select {
      appearance: none;
      background-color: var(--input-bg);
      background-image: none;
      cursor: pointer;
    }

    select:focus,
    input[type="number"]:focus,
    input[type="color"]:focus {
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: "⌄";
      position: absolute;
      right: 13px;
      top: 50%;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 900;
      pointer-events: none;
      transform: translateY(-56%);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .hint {
      color: var(--muted-2);
      font-size: 0.84rem;
      margin-top: 6px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .switch-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: normal;
      text-transform: none;
    }

    .switch-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      min-height: 43px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 10px 13px;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      transition: transform 140ms ease, opacity 140ms ease, background 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    button:active { transform: none; }

    button.primary {
      background: var(--accent);
      color: #ffffff;
    }

    button.primary:hover { background: var(--accent-hover); }

    button.danger {
      background: var(--danger);
      color: #ffffff;
    }

    button.danger:hover { background: var(--danger-hover); }

    button.download {
      background: var(--blue);
      color: #ffffff;
    }

    button.download:hover { background: var(--blue-hover); }

    button.secondary {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--line);
    }

    button.secondary:hover {
      background: var(--surface-3);
      border-color: #3a3a44;
    }

    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
    }

    .meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .meta strong { color: var(--text); }

    .status {
      min-height: 24px;
      font-size: 0.9rem;
      font-weight: 750;
      color: var(--muted);
    }

    .toolbar-status {
      min-height: 24px;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 750;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status.ok { color: var(--success); }
    .status.warn { color: var(--warning); }
    .status.bad { color: var(--danger); }

    .workspace {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .preview-card {
      overflow: hidden;
    }

    .toolbar {
      min-height: 65px;
    }

    .toolbar .small-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .small-actions button {
      min-height: 36px;
      padding: 8px 10px;
      font-size: 0.84rem;
      border-radius: var(--radius-sm);
    }

    .preview-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 430px;
      min-height: 430px;
    }

    .preview-pane {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .preview-pane + .preview-pane {
      border-left: 1px solid var(--line-soft);
    }

    .pane-title {
      padding: 11px 15px;
      color: var(--muted);
      font-size: 0.74rem;
      letter-spacing: 0.1em;
      font-weight: 900;
      text-transform: uppercase;
      border-bottom: 1px solid var(--line-soft);
      background: var(--surface-2);
    }

    .image-stage,
    .svg-stage {
      min-height: 0;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 18px;
      background-color: var(--stage-bg);
    }

    .image-stage {
      overflow: hidden;
    }

    .svg-stage {
      overflow: auto;
    }

    .image-stage.dropzone {
      position: relative;
      border: 0;
      border-radius: 0;
      background: var(--stage-bg);
    }

    .image-stage.dropzone:hover,
    .image-stage.dropzone.dragover,
    .image-stage.dropzone:focus-visible {
      background: var(--surface-2);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .drop-instructions {
      position: absolute;
      inset: 18px;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
      border: 1.5px dashed #393944;
      border-radius: var(--radius-md);
      color: var(--muted);
    }

    .drop-instructions strong {
      display: block;
      color: var(--heading);
      font-size: 1.08rem;
      margin-bottom: 6px;
    }

    .drop-instructions span {
      display: block;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 650;
    }

    .dropzone.has-image .drop-instructions { display: none; }

    .image-stage canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      image-rendering: auto;
      background: transparent;
    }

    .svg-preview {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      place-items: center;
      background: transparent;
    }

    .svg-preview svg {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }

    .svg-options {
      display: grid;
      grid-template-columns: minmax(220px, 1.2fr) minmax(150px, 0.8fr) minmax(170px, 0.8fr);
      gap: 12px;
      padding: 16px 18px;
      border-top: 1px solid var(--line-soft);
      background: var(--surface);
    }

    .svg-option {
      min-width: 0;
    }

    .color-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 52px;
      gap: 10px;
      align-items: center;
    }

    .preview-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: center;
      height: 120px;
      min-height: 120px;
      padding: 16px 18px;
      border-top: 1px solid var(--line-soft);
      background: var(--surface);
      overflow: hidden;
    }

    .preview-info {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .preview-actions {
      justify-self: end;
      display: grid;
      grid-template-columns: repeat(2, minmax(130px, 1fr));
      gap: 10px;
    }


    @media (max-width: 1120px) {
      main { grid-template-columns: 1fr; }
      .preview-wrap { grid-template-columns: 1fr; }
      .preview-pane + .preview-pane {
        border-left: 0;
        border-top: 1px solid var(--line-soft);
      }
    }

    @media (max-width: 720px) {
      .app-shell { padding: 16px; }
      header {
        grid-template-columns: 1fr;
        align-items: start;
      }
      .header-logo {
        justify-self: start;
        width: 96px;
      }
      .badge { justify-self: start; }
      .row,
      .actions,
      .svg-options,
      .preview-actions { grid-template-columns: 1fr; }
      .toolbar,
      .panel-heading {
        align-items: flex-start;
        flex-direction: column;
      }
      .toolbar .small-actions { justify-content: flex-start; }
      .preview-wrap {
        height: 640px;
        min-height: 640px;
      }
      .image-stage,
      .svg-stage { min-height: 0; }
      .preview-footer {
        grid-template-columns: 1fr;
        height: 170px;
        min-height: 170px;
      }
      .preview-actions { justify-self: stretch; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div>
        <h1>PNG to SVG Converter</h1>
        <p class="subtitle">
          Upload a PNG and generate the closest visual SVG output in one streamlined workflow.
        </p>
      </div>
      <img
        class="header-logo"
        src="https://images.squarespace-cdn.com/content/v1/681ea18dd168a935c26295bd/f173dc58-2856-4e84-b647-8cf46ca113ad/phonto-Photoroom.png?format=1000w"
        alt="Logo"
      />
    </header>

    <main>
      <section class="workspace">
        <div class="card preview-card">
          <div class="toolbar">
            <div class="status toolbar-status" id="status" aria-live="polite"></div>
          </div>

          <input id="fileInput" type="file" accept="image/png" />

          <div class="preview-wrap">
            <div class="preview-pane">
              <div class="pane-title">Original PNG</div>
              <div class="image-stage dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload PNG">
                <canvas id="sourceCanvas"></canvas>
                <div class="drop-instructions" id="dropInstructions">
                  <div>
                    <strong>Drop a PNG here</strong>
                    <span>or click to choose a file</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="preview-pane">
              <div class="pane-title">Generated SVG</div>
              <div class="svg-stage"><div class="svg-preview" id="svgPreview" role="img" aria-label="Generated SVG preview"></div></div>
            </div>
          </div>

          <div class="svg-options" aria-label="Generated SVG options">
            <div class="svg-option">
              <label for="colorMode">SVG Color</label>
              <div class="color-control">
                <div class="select-wrap">
                  <select id="colorMode">
                    <option value="original" selected>Original colors</option>
                    <option value="custom">Custom color</option>
                  </select>
                </div>
                <input id="svgColor" type="color" value="#7c5cff" aria-label="Custom SVG color" disabled />
              </div>
            </div>
            <div class="svg-option">
              <label for="rotation">Rotate</label>
              <div class="select-wrap">
                <select id="rotation">
                  <option value="0" selected>0°</option>
                  <option value="90">90° clockwise</option>
                  <option value="180">180°</option>
                  <option value="270">270° clockwise</option>
                </select>
              </div>
            </div>
            <div class="svg-option">
              <label for="mirror">Mirror</label>
              <div class="select-wrap">
                <select id="mirror">
                  <option value="none" selected>None</option>
                  <option value="horizontal">Horizontal</option>
                  <option value="vertical">Vertical</option>
                  <option value="both">Horizontal + vertical</option>
                </select>
              </div>
            </div>
          </div>

          <div class="controls is-hidden" aria-hidden="true">
            <select id="mode" tabindex="-1">
              <option value="embed" selected>Exact visual SVG wrapper</option>
              <option value="pixel">Pixel-perfect vector paths</option>
              <option value="trace">Flat-color region trace</option>
            </select>
            <span id="modeHint">Exact visual fidelity. The PNG is embedded inside an SVG, so it is not a true editable vector.</span>
            <span id="alphaValue">0</span>
            <input id="alpha" type="range" min="0" max="255" value="0" tabindex="-1" />
            <div id="quantWrap">
              <select id="quant" tabindex="-1">
                <option value="0" selected>Exact colors</option>
                <option value="64">64 levels per channel</option>
                <option value="32">32 levels per channel</option>
                <option value="16">16 levels per channel</option>
                <option value="8">8 levels per channel</option>
                <option value="4">4 levels per channel</option>
              </select>
            </div>
            <input id="scale" type="number" min="0.1" max="100" step="0.1" value="1" tabindex="-1" />
            <input id="maxColors" type="number" min="1" max="1024" step="1" value="1024" tabindex="-1" />
            <input id="includeMeta" type="checkbox" checked tabindex="-1" />
          </div>

          <div class="preview-footer">
            <div class="preview-info">
              <div class="meta" id="meta">
                <div>No image loaded.</div>
              </div>
            </div>
            <div class="preview-actions">
              <button class="danger" id="reset">Reset</button>
              <button class="download" id="download" disabled>Download</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const els = {
      fileInput: document.getElementById('fileInput'),
      dropzone: document.getElementById('dropzone'),
      dropInstructions: document.getElementById('dropInstructions'),
      sourceCanvas: document.getElementById('sourceCanvas'),
      mode: document.getElementById('mode'),
      modeHint: document.getElementById('modeHint'),
      alpha: document.getElementById('alpha'),
      alphaValue: document.getElementById('alphaValue'),
      quant: document.getElementById('quant'),
      quantWrap: document.getElementById('quantWrap'),
      scale: document.getElementById('scale'),
      maxColors: document.getElementById('maxColors'),
      includeMeta: document.getElementById('includeMeta'),
      colorMode: document.getElementById('colorMode'),
      svgColor: document.getElementById('svgColor'),
      rotation: document.getElementById('rotation'),
      mirror: document.getElementById('mirror'),
      reset: document.getElementById('reset'),
      download: document.getElementById('download'),
      meta: document.getElementById('meta'),
      status: document.getElementById('status'),
      svgPreview: document.getElementById('svgPreview'),

    };

    const state = {
      file: null,
      fileName: 'converted',
      dataUrl: '',
      imageData: null,
      width: 0,
      height: 0,
      lastSvg: '',
      objectUrl: null,
      generateFrame: null
    };

    const modeHints = {
      embed: 'Exact visual fidelity. The PNG is embedded inside an SVG, so it is not a true editable vector.',
      pixel: 'Exact pixel geometry. Every visible pixel becomes vector path data, grouped by color. Best for pixel art or small icons.',
      trace: 'Best for simple icons/logos with transparency and flat colors. Converts color regions into SVG paths.'
    };

    function setStatus(message, type = '') {
      els.status.textContent = message;
      els.status.className = `status ${type}`.trim();
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 KB';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function escapeXml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    function clampScale(value) {
      const parsed = Number.parseFloat(value);
      if (!Number.isFinite(parsed)) return 1;
      return Math.min(100, Math.max(0.1, parsed));
    }

    function normalizeHexColor(value) {
      const color = String(value || '').trim();
      return /^#[0-9a-f]{6}$/i.test(color) ? color : '#000000';
    }

    function hexToRgb(hex) {
      const normalized = normalizeHexColor(hex).slice(1);
      return [
        Number.parseInt(normalized.slice(0, 2), 16),
        Number.parseInt(normalized.slice(2, 4), 16),
        Number.parseInt(normalized.slice(4, 6), 16)
      ];
    }

    function usesCustomColor() {
      return els.colorMode.value === 'custom';
    }

    function customColorAttrs(alpha = 255) {
      const opacity = Math.max(0, Math.min(255, alpha)) / 255;
      const fill = normalizeHexColor(els.svgColor.value);
      return opacity >= 0.999 ? `fill="${fill}"` : `fill="${fill}" fill-opacity="${Number(opacity.toFixed(4))}"`;
    }

    function multiplyMatrix(left, right) {
      return {
        a: left.a * right.a + left.c * right.b,
        b: left.b * right.a + left.d * right.b,
        c: left.a * right.c + left.c * right.d,
        d: left.b * right.c + left.d * right.d,
        e: left.a * right.e + left.c * right.f + left.e,
        f: left.b * right.e + left.d * right.f + left.f
      };
    }

    function formatMatrixNumber(value) {
      const rounded = Number(value.toFixed(6));
      return Object.is(rounded, -0) ? 0 : rounded;
    }

    function isIdentityMatrix(matrix) {
      return matrix.a === 1 && matrix.b === 0 && matrix.c === 0 && matrix.d === 1 && matrix.e === 0 && matrix.f === 0;
    }

    function getSvgGeometry() {
      const width = state.width;
      const height = state.height;
      const mirror = els.mirror.value;
      const rotation = Number(els.rotation.value);
      const identity = { a: 1, b: 0, c: 0, d: 1, e: 0, f: 0 };
      const outputWidth = rotation === 90 || rotation === 270 ? height : width;
      const outputHeight = rotation === 90 || rotation === 270 ? width : height;

      const rotationMatrix = {
        0: identity,
        90: { a: 0, b: 1, c: -1, d: 0, e: height, f: 0 },
        180: { a: -1, b: 0, c: 0, d: -1, e: width, f: height },
        270: { a: 0, b: -1, c: 1, d: 0, e: 0, f: width }
      }[rotation] || identity;

      const mirrorMatrix = {
        none: identity,
        horizontal: { a: -1, b: 0, c: 0, d: 1, e: outputWidth, f: 0 },
        vertical: { a: 1, b: 0, c: 0, d: -1, e: 0, f: outputHeight },
        both: { a: -1, b: 0, c: 0, d: -1, e: outputWidth, f: outputHeight }
      }[mirror] || identity;

      const matrix = multiplyMatrix(mirrorMatrix, rotationMatrix);
      const transform = isIdentityMatrix(matrix)
        ? ''
        : `matrix(${[
            matrix.a,
            matrix.b,
            matrix.c,
            matrix.d,
            matrix.e,
            matrix.f
          ].map(formatMatrixNumber).join(' ')})`;

      return { width: outputWidth, height: outputHeight, transform };
    }

    function updateColorUi() {
      els.svgColor.disabled = !usesCustomColor();
    }

    function fitCanvasPreview() {
      if (!state.width || !state.height) {
        els.sourceCanvas.style.width = '';
        els.sourceCanvas.style.height = '';
        return;
      }

      const stageRect = els.dropzone.getBoundingClientRect();
      const stageStyles = window.getComputedStyle(els.dropzone);
      const availableWidth = Math.max(0, stageRect.width - Number.parseFloat(stageStyles.paddingLeft) - Number.parseFloat(stageStyles.paddingRight));
      const availableHeight = Math.max(0, stageRect.height - Number.parseFloat(stageStyles.paddingTop) - Number.parseFloat(stageStyles.paddingBottom));
      const fitScale = Math.min(1, availableWidth / state.width, availableHeight / state.height);

      if (!Number.isFinite(fitScale) || fitScale <= 0) {
        els.sourceCanvas.style.width = '';
        els.sourceCanvas.style.height = '';
        return;
      }

      els.sourceCanvas.style.width = `${Math.floor(state.width * fitScale)}px`;
      els.sourceCanvas.style.height = `${Math.floor(state.height * fitScale)}px`;
    }

    function regenerateIfReady() {
      if (state.imageData) generate();
    }

    function updateModeUi() {
      const mode = els.mode.value;
      els.modeHint.textContent = modeHints[mode];
      els.quantWrap.style.display = mode === 'embed' || mode === 'pixel' ? 'none' : 'block';
      els.maxColors.disabled = mode !== 'trace';
    }

    function getPixel(data, width, x, y) {
      const i = (y * width + x) * 4;
      return [data[i], data[i + 1], data[i + 2], data[i + 3]];
    }

    function rgbaKey(r, g, b, a) {
      return `${r},${g},${b},${a}`;
    }

    function parseRgbaKey(key) {
      return key.split(',').map(Number);
    }

    function quantizeChannel(value, levels) {
      if (!levels) return value;
      const step = 255 / (levels - 1);
      return Math.max(0, Math.min(255, Math.round(Math.round(value / step) * step)));
    }

    function colorToSvgAttrs(key, averageAlpha = null) {
      const [r, g, b, a] = parseRgbaKey(key);
      const alpha = averageAlpha === null ? a : averageAlpha;
      if (usesCustomColor()) return customColorAttrs(alpha);

      const opacity = alpha / 255;
      const fill = `rgb(${r} ${g} ${b})`;
      return opacity >= 0.999 ? `fill="${fill}"` : `fill="${fill}" fill-opacity="${Number(opacity.toFixed(4))}"`;
    }

    function buildSvgShell(inner, options = {}) {
      const scale = clampScale(els.scale.value);
      const geometry = getSvgGeometry();
      const outWidth = Number((geometry.width * scale).toFixed(3));
      const outHeight = Number((geometry.height * scale).toFixed(3));
      const render = options.crisp ? ' shape-rendering="crispEdges"' : '';
      const meta = els.includeMeta.checked
        ? `<!-- Generated by standalone PNG to SVG Converter. Mode: ${escapeXml(els.mode.value)}. Source: ${escapeXml(state.fileName)}. -->
`
        : '';
      const transformedInner = geometry.transform
        ? `  <g transform="${geometry.transform}">
${inner}
  </g>`
        : inner;
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${outWidth}" height="${outHeight}" viewBox="0 0 ${geometry.width} ${geometry.height}"${render}>
${meta}${transformedInner}
</svg>`;
    }

    function generateEmbeddedSvg() {
      let filter = '';
      let filterAttr = '';

      if (usesCustomColor()) {
        const [r, g, b] = hexToRgb(els.svgColor.value);
        filter = `  <defs>
    <filter id="svgColorFilter" color-interpolation-filters="sRGB">
      <feFlood flood-color="rgb(${r} ${g} ${b})" result="color"/>
      <feComposite in="color" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
`;
        filterAttr = ' filter="url(#svgColorFilter)"';
      }

      const inner = `${filter}  <image href="${state.dataUrl}" x="0" y="0" width="${state.width}" height="${state.height}" preserveAspectRatio="none"${filterAttr}/>`;
      return buildSvgShell(inner, { crisp: false });
    }

    function generatePixelVectorSvg() {
      const { data, width, height } = state.imageData;
      const threshold = Number(els.alpha.value);
      const pathsByColor = new Map();
      let visiblePixels = 0;

      for (let y = 0; y < height; y++) {
        let x = 0;
        while (x < width) {
          const [r, g, b, a] = getPixel(data, width, x, y);
          if (a <= threshold) {
            x++;
            continue;
          }

          const key = rgbaKey(r, g, b, a);
          let run = 1;
          while (x + run < width) {
            const [nr, ng, nb, na] = getPixel(data, width, x + run, y);
            if (na <= threshold || rgbaKey(nr, ng, nb, na) !== key) break;
            run++;
          }

          if (!pathsByColor.has(key)) pathsByColor.set(key, []);
          pathsByColor.get(key).push(`M${x} ${y}h${run}v1h-${run}Z`);
          visiblePixels += run;
          x += run;
        }
      }

      if (!visiblePixels) throw new Error('No visible pixels found at the current alpha threshold.');

      const paths = [...pathsByColor.entries()].map(([key, segments]) => {
        return `  <path ${colorToSvgAttrs(key)} d="${segments.join(' ')}"/>`;
      }).join('\n');

      return buildSvgShell(paths, { crisp: true });
    }

    function generateColorGrid() {
      const { data, width, height } = state.imageData;
      const threshold = Number(els.alpha.value);
      const levels = Number(els.quant.value);
      const keys = new Array(width * height).fill('');
      const groups = new Map();

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const a = data[i + 3];
          if (a <= threshold) continue;

          const r = quantizeChannel(data[i], levels);
          const g = quantizeChannel(data[i + 1], levels);
          const b = quantizeChannel(data[i + 2], levels);
          const key = rgbaKey(r, g, b, 255);
          keys[y * width + x] = key;

          if (!groups.has(key)) groups.set(key, { count: 0, alphaTotal: 0 });
          const group = groups.get(key);
          group.count++;
          group.alphaTotal += a;
        }
      }

      return { keys, groups };
    }

    function traceGroupToPath(keys, colorKey, width, height) {
      const startMap = new Map();
      const edges = [];

      function isSame(x, y) {
        if (x < 0 || y < 0 || x >= width || y >= height) return false;
        return keys[y * width + x] === colorKey;
      }

      function addEdge(sx, sy, ex, ey) {
        const edge = { sx, sy, ex, ey, used: false };
        edges.push(edge);
        const key = `${sx},${sy}`;
        if (!startMap.has(key)) startMap.set(key, []);
        startMap.get(key).push(edge);
      }

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (!isSame(x, y)) continue;
          if (!isSame(x, y - 1)) addEdge(x, y, x + 1, y);
          if (!isSame(x + 1, y)) addEdge(x + 1, y, x + 1, y + 1);
          if (!isSame(x, y + 1)) addEdge(x + 1, y + 1, x, y + 1);
          if (!isSame(x - 1, y)) addEdge(x, y + 1, x, y);
        }
      }

      function simplify(points) {
        if (points.length <= 4) return points;
        const closed = points[0][0] === points[points.length - 1][0] && points[0][1] === points[points.length - 1][1];
        const base = closed ? points.slice(0, -1) : points.slice();
        const simplified = [];

        for (let i = 0; i < base.length; i++) {
          const prev = base[(i - 1 + base.length) % base.length];
          const curr = base[i];
          const next = base[(i + 1) % base.length];
          const dx1 = curr[0] - prev[0];
          const dy1 = curr[1] - prev[1];
          const dx2 = next[0] - curr[0];
          const dy2 = next[1] - curr[1];
          if (dx1 * dy2 - dy1 * dx2 !== 0) simplified.push(curr);
        }

        if (!simplified.length) return points;
        simplified.push(simplified[0]);
        return simplified;
      }

      const loops = [];
      for (const edge of edges) {
        if (edge.used) continue;

        const startKey = `${edge.sx},${edge.sy}`;
        const loop = [[edge.sx, edge.sy]];
        let current = edge;
        let guard = 0;

        while (current && !current.used && guard < edges.length + 5) {
          current.used = true;
          loop.push([current.ex, current.ey]);
          const endKey = `${current.ex},${current.ey}`;
          if (endKey === startKey) break;

          const candidates = startMap.get(endKey) || [];
          current = candidates.find(candidate => !candidate.used) || null;
          guard++;
        }

        if (loop.length > 2) loops.push(simplify(loop));
      }

      return loops.map(points => {
        const first = points[0];
        const lines = points.slice(1, -1).map(point => `L${point[0]} ${point[1]}`).join('');
        return `M${first[0]} ${first[1]}${lines}Z`;
      }).join(' ');
    }

    function generateTraceSvg() {
      const { width, height } = state.imageData;
      const { keys, groups } = generateColorGrid();
      const maxColors = Math.max(1, Math.min(1024, Number.parseInt(els.maxColors.value, 10) || 128));
      const sortedGroups = [...groups.entries()].sort((a, b) => b[1].count - a[1].count);

      if (!sortedGroups.length) throw new Error('No visible pixels found at the current alpha threshold.');
      if (sortedGroups.length > maxColors) {
        throw new Error(`Trace produced ${sortedGroups.length} color regions. Increase Color Detail compression, raise Max trace colors, or use Pixel-perfect vector mode.`);
      }

      const paths = [];
      for (const [key, group] of sortedGroups) {
        const d = traceGroupToPath(keys, key, width, height);
        if (!d) continue;
        const avgAlpha = group.alphaTotal / group.count;
        paths.push(`  <path ${colorToSvgAttrs(key, avgAlpha)} fill-rule="evenodd" d="${d}"/>`);
      }

      return buildSvgShell(paths.join('\n'), { crisp: false });
    }

    function renderSvg(svg) {
      state.lastSvg = svg;
      els.download.disabled = false;
      els.svgPreview.innerHTML = svg;
    }

    function generate() {
      if (!state.imageData) return;
      if (state.generateFrame) cancelAnimationFrame(state.generateFrame);

      state.generateFrame = requestAnimationFrame(() => {
        state.generateFrame = null;

        try {
          const mode = els.mode.value;
          let svg;
          if (mode === 'embed') svg = generateEmbeddedSvg();
          if (mode === 'pixel') svg = generatePixelVectorSvg();
          if (mode === 'trace') svg = generateTraceSvg();

          renderSvg(svg);
          const modeLabel = els.mode.options[els.mode.selectedIndex].textContent;
          setStatus(`${modeLabel} generated successfully.`, 'ok');
        } catch (error) {
          setStatus(error.message || 'Could not generate SVG.', 'bad');
        }
      });
    }

    function clearOutput() {
      state.lastSvg = '';
      els.download.disabled = true;
      els.svgPreview.innerHTML = '';
      if (state.generateFrame) cancelAnimationFrame(state.generateFrame);
      state.generateFrame = null;
      if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
      state.objectUrl = null;
      setStatus('Output cleared.');
    }

    function downloadSvg() {
      if (!state.lastSvg) return;
      const blob = new Blob([state.lastSvg], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${state.fileName || 'converted'}.svg`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }


    function setMeta() {
      const pixelCount = state.width * state.height;
      els.meta.innerHTML = `
        <div><strong>File:</strong> ${escapeXml(state.file?.name || 'PNG')}</div>
        <div><strong>Dimensions:</strong> ${state.width} × ${state.height}px</div>
        <div><strong>Pixels:</strong> ${pixelCount.toLocaleString()}</div>
      `;
    }

    function loadFile(file) {
      if (!file || file.type !== 'image/png') {
        setStatus('Please choose a PNG file.', 'bad');
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          state.file = file;
          state.fileName = file.name.replace(/\.png$/i, '').replace(/[^a-z0-9_\-]+/gi, '_') || 'converted';
          state.dataUrl = reader.result;
          state.width = img.naturalWidth;
          state.height = img.naturalHeight;

          const canvas = els.sourceCanvas;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          canvas.width = state.width;
          canvas.height = state.height;
          ctx.clearRect(0, 0, state.width, state.height);
          ctx.drawImage(img, 0, 0);
          state.imageData = ctx.getImageData(0, 0, state.width, state.height);
          els.dropzone.classList.add('has-image');
          fitCanvasPreview();

          clearOutput();
          setMeta();
          generate();
        };
        img.onerror = () => setStatus('Could not load this PNG.', 'bad');
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function resetApp() {
      state.file = null;
      state.fileName = 'converted';
      state.dataUrl = '';
      state.imageData = null;
      state.width = 0;
      state.height = 0;
      els.fileInput.value = '';
      els.sourceCanvas.width = 0;
      els.sourceCanvas.height = 0;
      els.sourceCanvas.style.width = '';
      els.sourceCanvas.style.height = '';
      els.dropzone.classList.remove('has-image');
      els.meta.innerHTML = '<div>No image loaded.</div>';
      clearOutput();
      setStatus('Reset complete.');
    }

    els.dropzone.addEventListener('click', () => els.fileInput.click());
    els.dropzone.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') els.fileInput.click();
    });
    els.fileInput.addEventListener('change', event => loadFile(event.target.files[0]));

    ['dragenter', 'dragover'].forEach(type => {
      els.dropzone.addEventListener(type, event => {
        event.preventDefault();
        els.dropzone.classList.add('dragover');
      });
    });
    ['dragleave', 'drop'].forEach(type => {
      els.dropzone.addEventListener(type, event => {
        event.preventDefault();
        els.dropzone.classList.remove('dragover');
      });
    });
    els.dropzone.addEventListener('drop', event => loadFile(event.dataTransfer.files[0]));

    els.mode.addEventListener('change', updateModeUi);
    els.alpha.addEventListener('input', () => { els.alphaValue.textContent = els.alpha.value; });
    els.colorMode.addEventListener('change', () => {
      updateColorUi();
      regenerateIfReady();
    });
    els.svgColor.addEventListener('input', regenerateIfReady);
    els.rotation.addEventListener('change', regenerateIfReady);
    els.mirror.addEventListener('change', regenerateIfReady);
    els.download.addEventListener('click', downloadSvg);
    els.reset.addEventListener('click', resetApp);
    window.addEventListener('resize', fitCanvasPreview);

    updateModeUi();
    updateColorUi();
  </script>
</body>
</html>
