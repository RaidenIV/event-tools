<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Selector</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
        text-align: center;
        overflow-x: hidden;
    }

    .button-row {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        background: #00A300;
        color: white;
        cursor: pointer;
        transition: 0.2s ease;
    }

    button:hover {
        background: #008000;
    }
</style>
</head>
<body>

<h2>Select a Form</h2>

<div class="button-row">
    <!-- Update these URLs to match your actual Squarespace page slugs -->
    <button type="button"
            onclick="window.location.href='https://www.xodiamediagroup.com/updates'">
        Updates &amp; Promo
    </button>

    <button type="button"
            onclick="window.location.href='https://www.xodiamediagroup.com/djs'">
        DJs
    </button>

    <button type="button"
            onclick="window.location.href='https://www.xodiamediagroup.com/vendors'">
        Vendors
    </button>

    <button type="button"
            onclick="window.location.href='https://www.xodiamediagroup.com/sponsors'">
        Sponsors
    </button>
</div>

</body>
</html>
