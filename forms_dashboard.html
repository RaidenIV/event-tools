<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Selector</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
        text-align: center;
        overflow-x: hidden;
    }

    .button-row {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        background: #222;
        color: white;
        cursor: pointer;
        transition: 0.2s ease;
    }

    button:hover { background: #444; }
    button.active { background: #007bff; }

    .form-container {
        display: none;
        justify-content: center;
        margin-top: 10px;
    }

    iframe {
        width: 100%;
        max-width: 640px;
        height: 2600px;  /* ← VERY IMPORTANT: prevents inner scrolling */
        border: none;
    }
</style>
</head>
<body>

<h2>Select a Form</h2>

<div class="button-row">
    <button data-target="vendor">Vendor</button>
    <button data-target="sponsors">Sponsors</button>
    <button data-target="djs">DJs</button>
</div>

<div id="vendor" class="form-container">
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScwARI03cod7mWjN-rSY6HTRniyOBDxr4obi3io5t5_I5NkRQ/viewform?embedded=true"></iframe>
</div>

<div id="sponsors" class="form-container">
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSc_DbKE0a4w0lnPIyRsjHQJ7bzR7fQVdqbDfq2Gah6ZHiUqzQ/viewform?embedded=true"></iframe>
</div>

<div id="djs" class="form-container">
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf8m124fy-gFO6D63g1miNC6yErh_OLWUMhfchowKFdJ7IyYQ/viewform?embedded=true"></iframe>
</div>

<script>
    const buttons = document.querySelectorAll("button");
    const forms = document.querySelectorAll(".form-container");

    buttons.forEach(btn => {
        btn.addEventListener("click", () => {
            buttons.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");

            forms.forEach(f => f.style.display = "none");

            const target = btn.getAttribute("data-target");
            document.getElementById(target).style.display = "flex";

            window.scrollTo(0, 0);
        });
    });
</script>

</body>
</html>
