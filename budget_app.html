<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Budget Tracker</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ----------------------------------------------------------
   GLOBAL PAGE STYLE
---------------------------------------------------------- */
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #ffffff; /* BG-1 */
    font-family: 'Rajdhani', sans-serif;
    color: #000000;
}

.page-wrapper {
    width: 100%;
    max-width: 1700px;     /* was 1100px — increase for desktop */
    margin: 0 auto;
    padding: 25px 30px;    /* a bit more breathing room on desktop */
}


/* ----------------------------------------------------------
   HEADINGS
---------------------------------------------------------- */
h1 {
    text-align: center;
    font-size: 32px;
    margin: 0 0 20px 0;
    font-weight: 700;
}

h2 {
    font-size: 24px;
    text-align: center;
    margin-bottom: 20px;
}

/* ----------------------------------------------------------
   LAYOUT STRUCTURE (3 equal columns)
---------------------------------------------------------- */
.main-container{
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr)); /* equal widths */
  gap: 30px;
  align-items: start;
}

/* Columns */
.preview-panel,
.form-panel,
.chart-panel{
  min-width: 0;  /* prevents overflow pushing columns wider */
}

/* Make the charts column sticky (NOT scrollable internally) */
.chart-panel{
  position: sticky;
  top: 20px;
  align-self: start;
}

/* ----------------------------------------------------------
   MOBILE RESPONSIVE
---------------------------------------------------------- */
@media (max-width: 1200px){
  .main-container{
    grid-template-columns: 1fr;
  }

  .chart-panel{
    position: static;
    top: auto;
  }
}

.ads-split-row{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 6px 0 14px;
}
.ads-split-label{
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 6px;
}
@media (max-width: 900px){
  .ads-split-row{ grid-template-columns: 1fr; }
}


/* ----------------------------------------------------------
   FORM CONTAINER
---------------------------------------------------------- */
form {
    background: #ffffff;
    padding: 22px;
    border-radius: 10px;
    border: 1px solid #e6e6e6;
    box-shadow: 0 6px 18px rgba(10, 20, 30, 0.06);
}

label {
    display: block;
    margin: 10px 0 6px;
    font-weight: 700;
    font-size: 14px;
}

input[type="text"],
input[type="date"],
input[type="number"],
select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #e3e6ea;
    border-radius: 6px;
    background: #ffffff;
    color: #111;
    box-sizing: border-box;
}

/* ----------------------------------------------------------
   QUANTITY ROWS
---------------------------------------------------------- */
.quantity-row{
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 6px;
  margin-bottom: 14px; /* <-- added */
}


.quantity-row label {
    flex: 1;
}

.quantity-row input[type=number] {
    width: 100px;
    flex: 0 0 100px;
}

/* ----------------------------------------------------------
   COLLAPSIBLES — STYLE C-1 WITH ARROWS STYLE A
---------------------------------------------------------- */
/* Collapsible System */
.collapsible {
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-top: 14px;
    background: #ffffff;
}

.collapsible-header {
    padding: 12px 14px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
}

.collapsible-header:hover {
    background: #f3f3f3;
}

.collapsible .arrow {
    transition: transform 0.25s ease;
}

.collapsible.open .arrow {
    transform: rotate(90deg);
}

.collapsible-content {
    padding: 12px 16px;
    display: none;
}

.collapsible.open .collapsible-content {
    display: block;
}

/* ----------------------------------------------------------
   HEADLINER CARDS
---------------------------------------------------------- */
.headliner-card {
    background: #ffffff;
    padding: 12px;
    border: 1px solid #e6e6e6;
    border-radius: 10px;
    box-shadow: 0 4px 12px rgba(10, 20, 30, 0.04);
    margin-bottom: 12px;
}

.headliner-card h3 {
    margin: 0 0 8px 0;
    font-size: 16px;
    font-weight: 700;
}

/* =========================
   CHARTS STYLING
========================= */
.charts-section{
  width: 100%;
  /* charts are sticky via .chart-panel now */
}

.charts-title{
  width: 100%;
  text-align: center;
  font-weight: 800;
  font-size: 20px;     /* reduced from 28px */
  margin: 0 0 10px 0;
}

.charts-grid{
  width: 100%;
  display: flex;
  flex-direction: column;   /* Sales beneath Expenses */
  align-items: center;
  gap: 20px;
}

.chart-card{
  width: 100%;
  border-radius: 12px;
  padding: 14px;
}

.chart-subtitle{
  width: 100%;
  text-align: center;
  font-weight: 700;
  font-size: 18px;
  margin-bottom: 10px;
}

.chart-canvas-wrap{
  position: relative;
  width: 100%;
  height: 240px;
}

.chart-canvas-wrap canvas{
  width: 100% !important;
  height: 100% !important;
}

.chart-actions{
  width: 100%;
  display: flex;
  justify-content: center;
  margin-top: 10px;
}

/* ----------------------------------------------------------
   SUMMARY BOX
---------------------------------------------------------- */
#summary {
    background: #ffffff;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #ddd;
    box-shadow: 0 6px 18px rgba(10,20,30,0.04);

    margin-top: 0;       /* <-- was 20px; this moves it up */
    margin-bottom: 20px; /* keeps spacing before the text preview */

    text-align: center;
    font-weight: bold;
}

.summary-title{
  font-weight: 800;
  font-size: 24px;
  margin: 0 0 10px 0;
  text-align: center;
  letter-spacing: 0.5px;
}



/* ----------------------------------------------------------
   TEXT PREVIEW (no internal scrollbar)
---------------------------------------------------------- */
#textPreview{
  margin: 0;
  background: #ffffff;
  padding: 15px;
  border-radius: 8px;
  border: 1px solid #ddd;

  white-space: pre-wrap;
  font-family: Consolas, monospace;
  font-size: 12px;     /* <- reduced (change to 10px/12px if you want) */
  line-height: 1.35;   /* <- keeps it readable at smaller size */

  /* key: do NOT force a max-height/overflow */
  overflow: visible;
}

.text-preview-actions{
  margin-top: 10px;    /* normal spacing below preview */
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}

.copy-status{
  font-size: 14px;
  opacity: 0.85;
}

/* ----------------------------------------------------------
   BUTTONS
---------------------------------------------------------- */
.controls {
    text-align: center;
    margin-top: 16px;
}

button {
    background: #007BFF;
    color: #ffffff;
    padding: 10px 18px;
    margin: 6px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 700;
}

button:hover {
    opacity: 0.9;
}

/* ----------------------------------------------------------
   MARKETING: "Which account?" checkbox rows
---------------------------------------------------------- */
.account-label{
  font-weight: 700;
  font-size: 14px;
  margin: 6px 0 6px;
}

.account-options{
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  margin: 0 0 10px;
}

/* Override the global label block spacing for these inline labels */
.account-options label{
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  font-weight: 600;
  font-size: 14px;
}

.account-options input[type="checkbox"]{
  width: auto;
}

.account-picker{
  margin: 6px 0 14px;
  padding: 10px 12px;
  border: 1px solid #e3e6ea;
  border-radius: 8px;
  background: #ffffff;
}

.account-picker-title{
  font-weight: 700;
  font-size: 13px;
  margin: 0 0 8px;
}

.account-picker-options{
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.account-option{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 0;          /* overrides your global label margins */
  font-weight: 600;   /* slightly lighter than main labels */
}

/* Marketing: split ad inputs (XODIA / SPACE CAMP HQ) */
.ads-split-row{
  display: flex;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 14px;
}

.ads-split-col{
  flex: 1;
  min-width: 0;
}

.ads-split-label{
  font-weight: 700;
  font-size: 14px;
  margin: 6px 0 6px;
}

/* ----------------------------------------------------------
   MOBILE RESPONSIVE
---------------------------------------------------------- */
@media (max-width: 900px) {
    .main-container {
        flex-direction: column;
    }
    .chart-panel {
        position: static;
        width: 100%;
    }
    .ads-split-row {
      flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="page-wrapper">
    <h1>Event Budget Tracker</h1>

    <div class="main-container">

    <!-- =========================
        LEFT COLUMN: SUMMARY + TEXT PREVIEW
    ========================== -->
    <aside class="preview-panel">

        <!-- SUMMARY -->
        <div id="summary">
            <div class="summary-title">SUMMARY</div>
            <p>Total Expenses: $<span id="totalExpenses">0</span></p>
            <p>Total Incoming Sales: $<span id="totalRevenue">0</span></p>
            <p id="profitLine">Net Profit: $<span id="netProfit">0</span></p>
        </div>
        <!-- TEXT BUDGET PREVIEW (no inline sizing; controlled by CSS) -->
        <div id="textPreview"></div>
        <div class="text-preview-actions">
        <button type="button" onclick="copyTextPreview()">Copy</button>
        <button type="button" onclick="exportTextPreviewTxt()">Export .txt</button>
        <span id="copyStatus" class="copy-status"></span>
        </div>
    </aside>


    <!-- =========================
        MIDDLE COLUMN: FORM
    ========================== -->
    <div class="form-panel">
        <form id="budgetForm" onsubmit="return false">
        <!-- TITLE & DATE -->
        <label>Show Title:</label>
        <input id="showTitle" type="text" oninput="updateBudget()">
        <label>Show Date:</label>
        <input id="showDate" type="date" oninput="updateBudget()">

        <!-- -------------------------
            COLLAPSIBLE: HEADLINERS
        -------------------------- -->
        <div class="collapsible" id="col_headliners">
            <div class="collapsible-header" onclick="toggleCollapse('col_headliners')">
            <span class="arrow">▸</span> Headliners
            </div>
            <div class="collapsible-content">
            <div class="quantity-row">
                <label>Number of Headliners:</label>
                <input id="numHeadliners" type="number" min="0" max="10" value="0"
                    onchange="regenerateHeadliners()">
            </div>
            <div id="headlinerInputs"></div>
            </div>
        </div>

        <!-- -------------------------
            COLLAPSIBLE: SUPPORT
        -------------------------- -->
        <div class="collapsible" id="col_support">
            <div class="collapsible-header" onclick="toggleCollapse('col_support')">
            <span class="arrow">▸</span> Support
            </div>
            <div class="collapsible-content">
            <label>Direct Support Fee:</label>
            <input id="directSupport" type="number" step="0.01" oninput="updateBudget()">
            <div class="quantity-row">
                <label>Number of Local DJs:</label>
                <input id="numLocalDJs" type="number" min="0" max="20" value="0"
                    onchange="regenerateLocalDJs()">
            </div>
            <div id="localDJInputs"></div>
            </div>
        </div>


        <!-- -------------------------
            COLLAPSIBLE: PRODUCTION
        -------------------------- -->
        <div class="collapsible" id="col_production">
            <div class="collapsible-header" onclick="toggleCollapse('col_production')">
            <span class="arrow">▸</span> Production
            </div>
            <div class="collapsible-content">
            <label>Venue:</label>
            <input id="venue" type="number" step="0.01" oninput="updateBudget()">
            <label for="vjFee">VJ Fee:</label>
            <input id="vjFee" type="number" step="0.01" value="0" oninput="updateBudget()">
            <label>LED Wall:</label>
            <input id="ledWall" type="number" step="0.01" oninput="updateBudget()">
            <label>Lights:</label>
            <input id="lights" type="number" step="0.01" oninput="updateBudget()">
            <label>Lasers:</label>
            <input id="lasers" type="number" step="0.01" oninput="updateBudget()">
            </div>
        </div>


        <!-- -------------------------
            COLLAPSIBLE: GEAR
        -------------------------- -->
        <div class="collapsible" id="col_gear">
            <div class="collapsible-header" onclick="toggleCollapse('col_gear')">
            <span class="arrow">▸</span> Gear Rentals
            </div>
            <div class="collapsible-content">
            <div class="quantity-row">
                <label>Number of CDJs:</label>
                <input id="numCDJs" type="number" min="0" max="10" value="0"
                    onchange="regenerateCDJs()">
            </div>
            <div id="cdjInputs"></div>
            <label>Mixer:</label>
            <input id="mixer" type="number" step="0.01" oninput="updateBudget()">
            <label>Sound:</label>
            <input id="sound" type="number" step="0.01" oninput="updateBudget()">
            <label>Table:</label>
            <input id="table" type="number" step="0.01" oninput="updateBudget()">
            </div>
        </div>
        <!-- -------------------------
            COLLAPSIBLE: MARKETING
        -------------------------- -->
        <div class="collapsible" id="col_marketing">
          <div class="collapsible-header" onclick="toggleCollapse('col_marketing')">
            <span class="arrow">▸</span> Marketing
          </div>
          <div class="collapsible-content">
            <label>Facebook Ads</label>
            <div class="ads-split-row">
              <div class="ads-split-col">
                <div class="ads-split-label">XODIA:</div>
                <input id="facebookAdsXodia" type="number" step="0.01" oninput="updateBudget()">
              </div>
              <div class="ads-split-col">
                <div class="ads-split-label">SPACE CAMP HQ:</div>
                <input id="facebookAdsSpaceCampHQ" type="number" step="0.01" oninput="updateBudget()">
              </div>
            </div>
            <label>Instagram Ads</label>
            <div class="ads-split-row">
              <div class="ads-split-col">
                <div class="ads-split-label">XODIA:</div>
                <input id="instagramAdsXodia" type="number" step="0.01" oninput="updateBudget()">
              </div>
              <div class="ads-split-col">
                <div class="ads-split-label">SPACE CAMP HQ:</div>
                <input id="instagramAdsSpaceCampHQ" type="number" step="0.01" oninput="updateBudget()">
              </div>
            </div>
            <label for="physicalFlyers">Physical Flyers:</label>
            <input id="physicalFlyers" type="number" step="0.01" oninput="updateBudget()">
            <label for="eventbriteAds">Eventbrite Ads:</label>
            <input id="eventbriteAds" type="number" step="0.01" oninput="updateBudget()">
          </div>
        </div>


        <!-- -------------------------
            COLLAPSIBLE: STAFF
        -------------------------- -->
        <div class="collapsible" id="col_staff">
            <div class="collapsible-header" onclick="toggleCollapse('col_staff')">
            <span class="arrow">▸</span> Staff
            </div>
            <div class="collapsible-content">
            <label>Door:</label>
            <input id="doorStaff" type="number" step="0.01" oninput="updateBudget()">
            <label>Merch Table:</label>
            <input id="merchTable" type="number" step="0.01" oninput="updateBudget()">
            <label>Transportation:</label>
            <input id="transportation" type="number" step="0.01" oninput="updateBudget()">
            <div class="quantity-row">
                <label>Number of Show Runners:</label>
                <input id="numShowRunners" type="number" min="0" max="10" value="0"
                    onchange="regenerateShowRunners()">
            </div>
            <div id="showRunnerInputs"></div>
            </div>
        </div>

        <!-- -------------------------
            COLLAPSIBLE: OTHER CATEGORIES
        -------------------------- -->
        <div class="collapsible" id="col_other">
            <div class="collapsible-header" onclick="toggleCollapse('col_other')">
            <span class="arrow">▸</span> Other
            </div>
            <div class="collapsible-content">
            <div class="quantity-row">
                <label>Number of Other Categories:</label>
                <input id="numOtherCategories" type="number" min="0" max="10" value="0"
                    onchange="regenerateOtherCategories()">
            </div>
            <div id="allOtherCategories"></div>
            </div>
        </div>

        <!-- -------------------------
            COLLAPSIBLE: SALES
        -------------------------- -->
        <div class="collapsible" id="col_sales">
            <div class="collapsible-header" onclick="toggleCollapse('col_sales')">
            <span class="arrow">▸</span> Incoming Sales
            </div>
            <div class="collapsible-content">
            <label>Eventbrite Sales:</label>
            <input id="eventbriteSales" type="number" step="0.01" oninput="updateBudget()">
            <label>DJ Presales:</label>
            <input id="djPresales" type="number" step="0.01" oninput="updateBudget()">
            <label>Promo Team:</label>
            <input id="promoTeam" type="number" step="0.01" oninput="updateBudget()">
            <label>Door Sales:</label>
            <input id="doorSales" type="number" step="0.01" oninput="updateBudget()">
            <div class="quantity-row">
                <label>Number of Merch Vendors:</label>
                <input id="numMerchVendors" type="number" min="0" max="10" value="0"
                    onchange="regenerateVendors()">
            </div>
            <div id="merchVendorInputs"></div>
            <label>Merch Sold:</label>
            <input id="merchSold" type="number" step="0.01" oninput="updateBudget()">
            </div>
        </div>

        <!-- -------------------------
            CONTROLS
        -------------------------- -->
        <div class="controls">
            <button type="button" onclick="updateBudget()">Update Chart</button>
            <button type="button" onclick="resetForm()">Reset</button>
            <button type="button" onclick="downloadCSV()">Export CSV</button>
            <button type="button" onclick="triggerImport()">Import CSV</button>
            <button type="button" onclick="downloadAll()">Download All</button>
        </div>
        <!-- Hidden File Input -->
        <input id="csvFileInput" type="file" accept=".csv" style="display:none">
        </form>
    </div>
    <!-- =========================
        RIGHT COLUMN: CHARTS
    ========================== -->
    <aside class="chart-panel">
        <section class="charts-section">
        <!-- Title above charts (auto-updated from Show Title input) -->
        <div id="chartsShowTitle" class="charts-title" style="font-size: 20px;">UNTITLED EVENT</div>
        <div class="charts-grid">
            <div class="chart-card">
            <div class="chart-subtitle">Expenses</div>
            <div class="chart-canvas-wrap">
                <canvas id="expensesChart"></canvas>
            </div>
            </div>
            <div class="chart-card">
            <div class="chart-subtitle">Sales</div>
            <div class="chart-canvas-wrap">
                <canvas id="salesChart"></canvas>
            </div>
            </div>
        </div>
        <!-- Download Charts button directly below Sales chart -->
        <div class="chart-actions">
            <button type="button" onclick="downloadChartsPNG()">Download Charts PNG</button>
        </div>
        </section>
    </aside>
    </div>
</div>

<script>
/* ============================================================
   COLLAPSIBLE CONTROLLER (C-3 + SC-2 + Arrow A + JS-A)
============================================================ */
const otherCategoryState = {};

const collapsibleSections = [
    { header: "header_headliners", body: "section_headliners" },
    { header: "header_support", body: "section_support" },
    { header: "header_production", body: "section_production" },
    { header: "header_gear", body: "section_gear" },
    { header: "header_marketing", body: "section_marketing" },
    { header: "header_staff", body: "section_staff" },
    { header: "header_otherCats", body: "section_otherCats" }
];

/* Initialize all collapsibles: SC-2 (expanded by default) */
function initCollapsibles() {
    collapsibleSections.forEach(sec => {
        const header = document.getElementById(sec.header);
        const body = document.getElementById(sec.body);

        if (!header || !body) return;

        // Expanded state
        header.dataset.open = "true";
        header.textContent = "▾ " + header.dataset.label;

        body.style.display = "block";

        header.addEventListener("click", () => toggleSection(sec.header, sec.body));
    });
}

/* Toggle handler */
function toggleSection(headerID, bodyID) {
    const header = document.getElementById(headerID);
    const body = document.getElementById(bodyID);

    if (!header || !body) return;

    const isOpen = header.dataset.open === "true";

    if (isOpen) {
        header.dataset.open = "false";
        header.textContent = "▸ " + header.dataset.label;
        body.style.display = "none";
    } else {
        header.dataset.open = "true";
        header.textContent = "▾ " + header.dataset.label;
        body.style.display = "block";
    }
}

/* Auto-expand sections that receive values (C-3) */
function autoExpand(sectionID, headerID) {
    const header = document.getElementById(headerID);
    const body = document.getElementById(sectionID);

    if (header && body) {
        header.dataset.open = "true";
        header.textContent = "▾ " + header.dataset.label;
        body.style.display = "block";
    }
}

/* ============================================================
   GLOBAL STATE OBJECTS FOR DYNAMIC REPEATERS
============================================================ */

let headliners = {};
let localDJs = {};
let cdjs = {};
let showRunners = {};
let otherCats = {};
let vendors = {};

let chartExpenses = null;
let chartSales = null;

/* ============================================================
   HELPER – STORE/RESTORE DYNAMIC VALUES
============================================================ */

function storeValues(obj, prefix, count, fields) {
    obj[prefix] = {};
    for (let i = 1; i <= count; i++) {
        obj[prefix][i] = {};
        fields.forEach(f => {
            let el = document.getElementById(`${prefix}_${f}_${i}`);
            if (el) obj[prefix][i][f] = el.value;
        });
    }
}

function restoreValues(obj, prefix, fields) {
    if (!obj[prefix]) return;
    Object.keys(obj[prefix]).forEach(i => {
        fields.forEach(f => {
            let el = document.getElementById(`${prefix}_${f}_${i}`);
            if (el && obj[prefix][i][f] != null) el.value = obj[prefix][i][f];
        });
    });
}

/* ============================================================
   HEADLINERS REPEATER
============================================================ */

function regenerateHeadliners() {
    const container = document.getElementById("headlinerInputs");
    const oldCount = parseInt(document.getElementById("numHeadliners").dataset.old || 1);
    const newCount = parseInt(numHeadliners.value);

    storeValues(headliners, "headliner", oldCount, ["name", "fee", "hotel", "rider"]);

    container.innerHTML = "";

    for (let i = 1; i <= newCount; i++) {
        const card = document.createElement("div");
        card.className = "headliner-card";
        card.innerHTML = `
            <h3>Headliner ${i}</h3>

            <label>Name:</label>
            <input id="headliner_name_${i}" type="text" oninput="updateBudget()"/>

            <label>Fee:</label>
            <input id="headliner_fee_${i}" type="number" step="0.01" oninput="updateBudget()"/>

            <label>Hotel:</label>
            <input id="headliner_hotel_${i}" type="number" step="0.01" oninput="updateBudget()"/>

            <label>Rider:</label>
            <input id="headliner_rider_${i}" type="number" step="0.01" oninput="updateBudget()"/>
        `;
        container.appendChild(card);
    }

    restoreValues(headliners, "headliner", ["name", "fee", "hotel", "rider"]);
    document.getElementById("numHeadliners").dataset.old = newCount;

    autoExpand("section_headliners", "header_headliners");
    updateBudget();
}

/* ============================================================
   LOCAL DJS
============================================================ */

function regenerateLocalDJs() {

function regenerateOtherCategories() {
    const newCount = parseInt(numOtherCategories.value) || 0;

    /* -------- STORE EXISTING DATA -------- */
    for (let c = 1; c <= Object.keys(otherCategoryState).length; c++) {
        const nameEl = document.getElementById(`otherCategoryName_${c}`);
        const countEl = document.getElementById(`otherCategoryCount_${c}`);

        if (!otherCategoryState[c]) otherCategoryState[c] = { items: {} };

        otherCategoryState[c].name = nameEl ? nameEl.value : '';
        otherCategoryState[c].count = countEl ? parseInt(countEl.value) || 0 : 0;

        for (let i = 1; i <= otherCategoryState[c].count; i++) {
            const name = document.getElementById(`otherCategory_${c}_itemName_${i}`)?.value || '';
            const fee  = document.getElementById(`otherCategory_${c}_itemFee_${i}`)?.value || '';
            otherCategoryState[c].items[i] = { name, fee };
        }
    }

    /* -------- REBUILD UI -------- */
    allOtherCategories.innerHTML = '';

    for (let c = 1; c <= newCount; c++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'other-category-wrapper';

        wrapper.innerHTML = `

            </div>

        allOtherCategories.appendChild(wrapper);

        /* -------- RESTORE CATEGORY DATA -------- */
        if (otherCategoryState[c]) {

                otherCategoryState[c].name || '';

            document.getElementById(`otherCategoryCount_${c}`).value =
                otherCategoryState[c].count || 0;

/* ============================================================
   BUDGET CALCULATOR ENGINE
============================================================ */

function getNum(id) {
  const el = document.getElementById(id);
  const v = el ? parseFloat(el.value) : 0;
  return Number.isFinite(v) ? v : 0;
}

function getStr(id) {
  const el = document.getElementById(id);
  return el ? (el.value || "") : "";
}

function updateBudget() {

  /* -------------------------
     TITLE
  -------------------------- */
  const title = document.getElementById("showTitle")?.value || "UNTITLED EVENT";
  const titleUpper = title.toUpperCase();

  // Existing title output (keep if you use it elsewhere)
  const mainTitleEl = document.getElementById("showTitleDisplay");
  if (mainTitleEl) mainTitleEl.textContent = titleUpper;

  // Title above the charts
  const chartsTitleEl = document.getElementById("chartsShowTitle");
  if (chartsTitleEl) chartsTitleEl.textContent = titleUpper;

  /* -------------------------
     HEADLINERS
  -------------------------- */
  let headlinerTotal = 0;
  const numHeadliners = +document.getElementById("numHeadliners")?.value || 0;

  for (let i = 1; i <= numHeadliners; i++) {
    headlinerTotal +=
      (+document.getElementById(`headliner_fee_${i}`)?.value || 0) +
      (+document.getElementById(`headliner_hotel_${i}`)?.value || 0) +
      (+document.getElementById(`headliner_rider_${i}`)?.value || 0);
  }

  /* -------------------------
     SUPPORT
  -------------------------- */
  const directSupport = +document.getElementById("directSupport")?.value || 0;

  let localDJTotal = 0;
  const numLocalDJs = +document.getElementById("numLocalDJs")?.value || 0;
  for (let i = 1; i <= numLocalDJs; i++) {
    localDJTotal += +document.getElementById(`localDJ_fee_${i}`)?.value || 0;
  }


  /* -------------------------
     PRODUCTION
  -------------------------- */
  const productionTotal =
    (+document.getElementById("vjFee")?.value || 0) +
    (+document.getElementById("venue")?.value || 0) +
    (+document.getElementById("ledWall")?.value || 0) +
    (+document.getElementById("lights")?.value || 0) +
    (+document.getElementById("lasers")?.value || 0);


  /* -------------------------
     GEAR RENTALS
  -------------------------- */
  let cdjTotal = 0;
  const numCDJs = +document.getElementById("numCDJs")?.value || 0;
  for (let i = 1; i <= numCDJs; i++) {
    cdjTotal += +document.getElementById(`cdj_fee_${i}`)?.value || 0;
  }

  const gearTotal =
    cdjTotal +
    (+document.getElementById("sound")?.value || 0) +
    (+document.getElementById("mixer")?.value || 0) +
    (+document.getElementById("table")?.value || 0);


  /* -------------------------
     MARKETING (split by account)
  -------------------------- */
  const hasFbSplit =
    !!document.getElementById("facebookAdsXodia") ||
    !!document.getElementById("facebookAdsSpaceCampHQ");

  const hasIgSplit =
    !!document.getElementById("instagramAdsXodia") ||
    !!document.getElementById("instagramAdsSpaceCampHQ");

  const fbTotal = hasFbSplit
    ? ((+document.getElementById("facebookAdsXodia")?.value || 0) +
       (+document.getElementById("facebookAdsSpaceCampHQ")?.value || 0))
    : (+document.getElementById("facebookAds")?.value || 0); // legacy fallback

  const igTotal = hasIgSplit
    ? ((+document.getElementById("instagramAdsXodia")?.value || 0) +
       (+document.getElementById("instagramAdsSpaceCampHQ")?.value || 0))
    : (+document.getElementById("instagramAds")?.value || 0); // legacy fallback

  const marketingTotal =
    fbTotal +
    igTotal +
    (+document.getElementById("physicalFlyers")?.value || 0) +
    (+document.getElementById("eventbriteAds")?.value || 0);


  /* -------------------------
     STAFF
  -------------------------- */
  let showRunnerTotal = 0;
  const numShowRunners = +document.getElementById("numShowRunners")?.value || 0;
  for (let i = 1; i <= numShowRunners; i++) {
    showRunnerTotal += +document.getElementById(`showRunner_fee_${i}`)?.value || 0;
  }

  const staffTotal =
    (+document.getElementById("doorStaff")?.value || 0) +
    (+document.getElementById("merchTable")?.value || 0) +
    (+document.getElementById("transportation")?.value || 0) +
    showRunnerTotal;


  /* -------------------------
     OTHER CATEGORIES
  -------------------------- */
  let otherTotal = 0;
  const numOtherCategories = +document.getElementById("numOtherCategories")?.value || 0;

  for (let c = 1; c <= numOtherCategories; c++) {
    const count = +document.getElementById(`otherCategoryCount_${c}`)?.value || 0;
    for (let i = 1; i <= count; i++) {
      otherTotal += +document.getElementById(`otherCategory_${c}_itemFee_${i}`)?.value || 0;
    }
  }


  /* -------------------------
     EXPENSE TOTAL
  -------------------------- */
  const totalExpenses =
    headlinerTotal +
    directSupport +
    localDJTotal +
    productionTotal +
    gearTotal +
    marketingTotal +
    staffTotal +
    otherTotal;


  /* -------------------------
     REVENUE
  -------------------------- */
  let merchVendorTotal = 0;
  const numMerchVendors = +document.getElementById("numMerchVendors")?.value || 0;

  for (let i = 1; i <= numMerchVendors; i++) {
    merchVendorTotal += +document.getElementById(`merchVendor_fee_${i}`)?.value || 0;
  }

  const totalRevenue =
    (+document.getElementById("eventbriteSales")?.value || 0) +
    (+document.getElementById("djPresales")?.value || 0) +
    (+document.getElementById("promoTeam")?.value || 0) +
    (+document.getElementById("doorSales")?.value || 0) +
    (+document.getElementById("merchSold")?.value || 0) +
    merchVendorTotal;


  /* -------------------------
     NET PROFIT
  -------------------------- */
  const netProfit = totalRevenue - totalExpenses;


  /* -------------------------
      UI OUTPUT (SUMMARY)
  -------------------------- */
  document.getElementById("totalExpenses").textContent =
      totalExpenses.toFixed(2);
  document.getElementById("totalRevenue").textContent =
      totalRevenue.toFixed(2);

  const profitLine = document.getElementById("profitLine");
  if (profitLine) {
      const sign = netProfit >= 0 ? "+" : "-";
      const amountText = `${sign}$${Math.abs(netProfit).toFixed(2)}`;

      // Keep the label neutral; color only the amount
      profitLine.innerHTML =
          `Net Profit: <span style="font-weight:700; color:${netProfit < 0 ? "#bf1e1e" : "#000"}">${amountText}</span>`;
  }


  /* -------------------------
     TEXT PREVIEW
  -------------------------- */
  updateTextPreview({ netProfit });


  /* -------------------------
     CHARTS
  -------------------------- */
  updateCharts(
    {
      Headliners: headlinerTotal,
      Support: directSupport + localDJTotal,
      Production: productionTotal,
      Gear: gearTotal,
      Marketing: marketingTotal,
      Staff: staffTotal,
      Other: otherTotal
    },
    {
      Eventbrite: +document.getElementById("eventbriteSales")?.value || 0,
      Presales: +document.getElementById("djPresales")?.value || 0,
      Promo: +document.getElementById("promoTeam")?.value || 0,
      Door: +document.getElementById("doorSales")?.value || 0,
      Merch: (+document.getElementById("merchSold")?.value || 0) + merchVendorTotal
    }
  );
}


/* ============================================================
   TEXT PREVIEW
============================================================ */

function updateTextPreview(data = {}) {
  const preview = document.getElementById("textPreview");
  if (!preview) return;

  const fmtMoney = (v) => {
    const n = Number(v) || 0;
    return `$${n.toFixed(2)}`;
  };

  const gNum = (id) => {
    const el = document.getElementById(id);
    const v = el ? parseFloat(el.value) : 0;
    return Number.isFinite(v) ? v : 0;
  };

  const gStr = (id) => {
    const el = document.getElementById(id);
    return el ? (el.value || "") : "";
  };

  const sectionTotal = (rows) =>
    (rows || []).reduce((sum, r) => sum + (r && typeof r.value === "number" ? (+r.value || 0) : 0), 0);

  /* ============================================================
     ALIGNMENT FIX (MIN LABEL COL + FIXED MONEY COL)
  ============================================================ */
  const MIN_LABEL_COL = 32;  // <-- increase if you want more spacing before $
  const MONEY_COL = 12;      // "$0.00" fits (increase to 14 for "$12,345.67")

  let labelWidth = MIN_LABEL_COL;
  const consider = (s) => { labelWidth = Math.max(labelWidth, String(s || "").length); };
  /* ============================================================ */

  const showTitle = (gStr("showTitle") || "UNTITLED EVENT").toUpperCase();
  const showDateText = gStr("showDate");

  // Build detailed expense sections
  const sections = [];

  // HEADLINERS (detailed)
  const headlinerRows = [];
  const nHead = +document.getElementById("numHeadliners")?.value || 0;
  for (let i = 1; i <= nHead; i++) {
    const name = gStr(`headliner_name_${i}`) || `Headliner ${i}`;
    headlinerRows.push({ label: `${name} Fee:`, value: gNum(`headliner_fee_${i}`) });
    headlinerRows.push({ label: `${name} Hotel:`, value: gNum(`headliner_hotel_${i}`) });
    headlinerRows.push({ label: `${name} Rider:`, value: gNum(`headliner_rider_${i}`) });
  }
  if (headlinerRows.length) sections.push({ title: "Headliners", rows: headlinerRows });

  // SUPPORT
  const supportRows = [
    { label: "Direct Support:", value: gNum("directSupport") }
  ];

  const nLocal = +document.getElementById("numLocalDJs")?.value || 0;
  for (let i = 1; i <= nLocal; i++) {
    const name = gStr(`localDJ_name_${i}`) || `Local DJ ${i}`;
    supportRows.push({ label: `${name} Fee:`, value: gNum(`localDJ_fee_${i}`) });
  }
  sections.push({ title: "Support", rows: supportRows });

  // PRODUCTION
  const productionRows = [
    { label: "VJ Fee:", value: gNum("vjFee") },
    { label: "Venue:", value: gNum("venue") },
    { label: "LED Wall:", value: gNum("ledWall") },
    { label: "Lights:", value: gNum("lights") },
    { label: "Lasers:", value: gNum("lasers") }
  ];
  sections.push({ title: "Production", rows: productionRows });

  // GEAR RENTALS
  const gearRows = [];
  const nCDJ = +document.getElementById("numCDJs")?.value || 0;
  for (let i = 1; i <= nCDJ; i++) gearRows.push({ label: `CDJ ${i}:`, value: gNum(`cdj_fee_${i}`) });
  gearRows.push({ label: "Mixer:", value: gNum("mixer") });
  gearRows.push({ label: "Sound:", value: gNum("sound") });
  gearRows.push({ label: "Table:", value: gNum("table") });
  sections.push({ title: "Gear Rentals", rows: gearRows });

  // MARKETING (split inputs)
  const hasFbSplit =
    !!document.getElementById("facebookAdsXodia") ||
    !!document.getElementById("facebookAdsSpaceCampHQ");

  const hasIgSplit =
    !!document.getElementById("instagramAdsXodia") ||
    !!document.getElementById("instagramAdsSpaceCampHQ");

  const fbX = hasFbSplit ? gNum("facebookAdsXodia") : gNum("facebookAds"); // legacy => XODIA
  const fbS = hasFbSplit ? gNum("facebookAdsSpaceCampHQ") : 0;

  const igX = hasIgSplit ? gNum("instagramAdsXodia") : gNum("instagramAds"); // legacy => XODIA
  const igS = hasIgSplit ? gNum("instagramAdsSpaceCampHQ") : 0;

  const marketingRows = [
    { type: "heading", text: "Facebook Ads" },
    { label: "XODIA:", value: fbX },
    { label: "SPACE CAMP HQ:", value: fbS },
    { type: "blank" },

    { type: "heading", text: "Instagram Ads" },
    { label: "XODIA:", value: igX },
    { label: "SPACE CAMP HQ:", value: igS },
    { type: "blank" }, // <-- ADD THIS (empty line after Instagram Ads)

    { label: "Physical Flyers:", value: gNum("physicalFlyers") },
    { label: "Eventbrite Ads:", value: gNum("eventbriteAds") },
  ];
  sections.push({ title: "Marketing", rows: marketingRows });

  // STAFF
  const staffRows = [
    { label: "Door Staff:", value: gNum("doorStaff") },
    { label: "Merch Table:", value: gNum("merchTable") },
    { label: "Transportation:", value: gNum("transportation") },
  ];
  const nRunners = +document.getElementById("numShowRunners")?.value || 0;
  for (let i = 1; i <= nRunners; i++) staffRows.push({ label: `Show Runner ${i}:`, value: gNum(`showRunner_fee_${i}`) });
  sections.push({ title: "Staff", rows: staffRows });

  // OTHER CATEGORIES
  const otherRows = [];
  const nOtherCats = +document.getElementById("numOtherCategories")?.value || 0;
  for (let c = 1; c <= nOtherCats; c++) {
    const catName = gStr(`otherCategoryName_${c}`) || `Category ${c}`;
    const count = +document.getElementById(`otherCategoryCount_${c}`)?.value || 0;

    otherRows.push({ type: "heading", text: catName });
    for (let i = 1; i <= count; i++) {
      const itemName = gStr(`otherCategory_${c}_itemName_${i}`) || `Item ${i}`;
      otherRows.push({ label: `${itemName}:`, value: gNum(`otherCategory_${c}_itemFee_${i}`) });
    }
    otherRows.push({ type: "blank" });
  }
  if (otherRows.length) sections.push({ title: "Other", rows: otherRows });

  // Determine alignment width (now respects MIN_LABEL_COL)
  sections.forEach(sec => {
    consider(sec.title);
    (sec.rows || []).forEach(r => {
      if (r?.type === "text" || r?.type === "heading" || r?.type === "blank") return;
      consider(r.label || "");
    });
  });

  const fmtRow = (label, value) => {
    const left = String(label || "").padEnd(labelWidth, " ");
    const money = fmtMoney(value).padStart(MONEY_COL, " ");
    return `${left}  ${money}`;
  };

  const lines = [];

  lines.push(`EVENT: ${showTitle}${showDateText ? `  |  DATE: ${showDateText}` : ""}`);
  lines.push("");

  lines.push("EXPENSES");
  lines.push("--------------------------------");

  let totalExpenses = 0;

  for (const sec of sections) {
    if (!sec?.rows?.length) continue;

    lines.push(sec.title.toUpperCase());

    for (const r of sec.rows) {
      if (r?.type === "blank") { lines.push(""); continue; }
      if (r?.type === "heading") { lines.push(String(r.text || "")); continue; }
      if (r?.type === "text") { lines.push(`  ${r.text}`); continue; }
      lines.push(fmtRow(r.label, r.value));
    }

    const secTotal = sectionTotal(sec.rows);
    totalExpenses += secTotal;

    lines.push(fmtRow(`TOTAL ${sec.title.toUpperCase()}:`, secTotal));
    lines.push("");
  }

  lines.push("--------------------------------");
  lines.push(fmtRow("TOTAL EXPENSES:", totalExpenses));
  lines.push("");

  // REVENUE
  const merchVendorTotal = (() => {
    const n = +document.getElementById("numMerchVendors")?.value || 0;
    let t = 0;
    for (let i = 1; i <= n; i++) t += gNum(`merchVendor_fee_${i}`);
    return t;
  })();

  const revenueRows = [
    { label: "Eventbrite Sales:", value: gNum("eventbriteSales") },
    { label: "DJ Presales:", value: gNum("djPresales") },
    { label: "Promo Team:", value: gNum("promoTeam") },
    { label: "Door Sales:", value: gNum("doorSales") },
    { label: "Merch Sold:", value: gNum("merchSold") },
    { label: "Merch Vendors:", value: merchVendorTotal },
  ];

  // Make revenue labels count toward alignment too
  revenueRows.forEach(r => consider(r.label || ""));

  const totalRevenue = sectionTotal(revenueRows);

  lines.push("REVENUE");
  lines.push("--------------------------------");
  revenueRows.forEach(r => lines.push(fmtRow(r.label, r.value)));
  lines.push("--------------------------------");
  lines.push(fmtRow("TOTAL REVENUE:", totalRevenue));
  lines.push("");

  lines.push("NET PROFIT");
  lines.push("--------------------------------");
  const netProfit = Number.isFinite(+data.netProfit) ? +data.netProfit : (totalRevenue - totalExpenses);
  lines.push(`${netProfit >= 0 ? "+" : "-"}$${Math.abs(netProfit).toFixed(2)}`);

  preview.textContent = lines.join("\n");
}



/* ============================================================
   PIE CHART RENDERING
============================================================ */

function updateCharts(expenseMap, revenueMap) {
  const fmtUSD = (v) =>
    new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(+v || 0);

  const toNum = (v) => (Number.isFinite(+v) ? +v : 0);

  const cycleColors = (colors, n) => {
    const out = [];
    for (let i = 0; i < n; i++) out.push(colors[i % colors.length]);
    return out;
  };

  // Build sorted, positive-only entries (keeps charts clean)
  const buildEntries = (mapObj) => {
    const entries = Object.entries(mapObj || {})
      .map(([k, v]) => [k, toNum(v)])
      .filter(([, v]) => v > 0)
      .sort((a, b) => b[1] - a[1]);

    return {
      labels: entries.map((e) => e[0]),
      values: entries.map((e) => e[1]),
    };
  };

  // Visibility helpers (Chart.js v3/v4)
  const isVisible = (chart, i) => {
    if (typeof chart.getDataVisibility === "function") return chart.getDataVisibility(i);
    const meta = chart.getDatasetMeta(0);
    const el = meta?.data?.[i];
    return !(el && el.hidden === true);
  };

  const visibleTotal = (chart, values) => {
    let t = 0;
    for (let i = 0; i < values.length; i++) {
      if (values[i] > 0 && isVisible(chart, i)) t += values[i];
    }
    return t;
  };

  const legendOnClick = (e, legendItem, legend) => {
    const chart = legend.chart;
    const idx = legendItem.index;

    if (typeof chart.toggleDataVisibility === "function") {
      chart.toggleDataVisibility(idx);
    } else {
      const meta = chart.getDatasetMeta(0);
      if (meta?.data?.[idx]) meta.data[idx].hidden = !meta.data[idx].hidden;
    }

    chart.update(); // <- forces legend text recompute
  };

  const makeLegendGenerateLabels = () => (chart) => {
    const ds = chart.data.datasets?.[0];
    const labels = chart.data.labels || [];
    const values = (ds?.data || []).map(toNum);
    const total = visibleTotal(chart, values);

    return labels.map((label, i) => {
      const v = values[i] || 0;
      const pct = total > 0 ? (v / total) * 100 : 0;

      const fillStyle = Array.isArray(ds.backgroundColor)
        ? ds.backgroundColor[i]
        : ds.backgroundColor;

      return {
        text: `${label}: ${fmtUSD(v)} (${pct.toFixed(0)}%)`,
        fillStyle,
        strokeStyle: fillStyle,
        lineWidth: 1,
        hidden: !isVisible(chart, i),
        index: i,
      };
    });
  };

  const tooltipLabel = (ctx) => {
    const v = toNum(ctx.parsed);
    const values = (ctx.chart.data.datasets?.[0]?.data || []).map(toNum);
    const total = visibleTotal(ctx.chart, values);
    const pct = total > 0 ? (v / total) * 100 : 0;

    // Dollar FIRST, then percent
    return `${ctx.label}: ${fmtUSD(v)} (${pct.toFixed(0)}%)`;
  };

  const EXP_COLORS = ["#FF6384", "#36A2EB", "#FFCE56", "#8BC34A", "#9C27B0", "#FF9800", "#607D8B"];
  const REV_COLORS = ["#4CAF50", "#03A9F4", "#FFC107", "#E91E63", "#9E9E9E"];

  const exp = buildEntries(expenseMap);
  const rev = buildEntries(revenueMap);

  const makeOrUpdatePie = (existingChart, canvasId, labels, values, baseColors) => {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return existingChart;

    const colors = cycleColors(baseColors, values.length);

    if (!existingChart) {
      return new Chart(canvas.getContext("2d"), {
        type: "pie",
        data: {
          labels,
          datasets: [{ data: values, backgroundColor: colors }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: "bottom",
              onClick: legendOnClick,
              labels: {
                generateLabels: makeLegendGenerateLabels(),
              },
            },
            tooltip: {
              callbacks: { label: tooltipLabel },
            },
          },
        },
      });
    }

    // Update existing chart in-place (keeps it stable + refreshes legend)
    existingChart.data.labels = labels;
    existingChart.data.datasets[0].data = values;
    existingChart.data.datasets[0].backgroundColor = colors;

    // If slice count changed, reset visibility so legend math stays sane
    if (typeof existingChart.setDataVisibility === "function") {
      for (let i = 0; i < labels.length; i++) existingChart.setDataVisibility(i, true);
    }

    existingChart.update();
    return existingChart;
  };

  chartExpenses = makeOrUpdatePie(chartExpenses, "expensesChart", exp.labels, exp.values, EXP_COLORS);
  chartSales    = makeOrUpdatePie(chartSales, "salesChart",    rev.labels, rev.values, REV_COLORS);

  // Keep downloadChartsPNG() happy if it checks window.*
  window.chartExpenses = chartExpenses;
  window.chartSales = chartSales;
}

function loadCSV(fileOrText) {
  const applyText = (text) => {
    resetForm();

    const lines = String(text || "").split(/\r?\n/);

    const parseLabelValue = (line) => {
      const idx = line.indexOf(",");
      if (idx < 0) return [line.trim(), ""];
      const label = line.slice(0, idx).trim();

      let value = line.slice(idx + 1).trim();
      if (value.startsWith('"') && value.endsWith('"')) {
        value = value.slice(1, -1).replace(/""/g, '"');
      }
      return [label, value];
    };

    const setVal = (id, value) => {
      const el = document.getElementById(id);
      if (el) el.value = value;
    };

    // PASS 1: read pairs and determine repeater sizes
    const pairs = [];
    let maxHead = 1, maxLocal = 0, maxCDJ = 0, maxRunner = 0, maxVendor = 0, maxOther = 0;
    const otherCounts = {};
    let legacyFbAmount = "", legacyFbAcct = "";
    let legacyIgAmount = "", legacyIgAcct = "";

    for (const raw of lines) {
      if (!raw || !raw.trim()) continue;
      const [label, value] = parseLabelValue(raw);
      pairs.push([label, value]);

      if (/^Headliner\s+(\d+)\s+/.test(label)) {
        maxHead = Math.max(maxHead, parseInt(label.match(/^Headliner\s+(\d+)/)[1], 10));
      }

      if (/^Local DJ\s+(\d+)\s+/.test(label)) {
        maxLocal = Math.max(maxLocal, parseInt(label.match(/^Local DJ\s+(\d+)/)[1], 10));
      }

      if (/^CDJ\s+(\d+)\s+Fee$/.test(label)) {
        maxCDJ = Math.max(maxCDJ, parseInt(label.match(/^CDJ\s+(\d+)/)[1], 10));
      }

      if (/^Show Runner\s+(\d+)\s+Fee$/.test(label)) {
        maxRunner = Math.max(maxRunner, parseInt(label.match(/^Show Runner\s+(\d+)/)[1], 10));
      }

      if (/^Vendor\s+(\d+)\s+/.test(label)) {
        maxVendor = Math.max(maxVendor, parseInt(label.match(/^Vendor\s+(\d+)/)[1], 10));
      }

      if (/^Category\s+(\d+)\s+Items$/.test(label)) {
        const c = parseInt(label.match(/^Category\s+(\d+)/)[1], 10);
        maxOther = Math.max(maxOther, c);
        otherCounts[c] = parseInt(value, 10) || 0;
      }

      if (label === "Facebook Ads") legacyFbAmount = value;
      if (label === "Facebook Ads Account") legacyFbAcct = value;
      if (label === "Instagram Ads") legacyIgAmount = value;
      if (label === "Instagram Ads Account") legacyIgAcct = value;
    }

    // Resize repeaters
    setVal("numHeadliners", String(maxHead));
    regenerateHeadliners?.();

    setVal("numLocalDJs", String(maxLocal));
    regenerateLocalDJs?.();

    setVal("numCDJs", String(maxCDJ));
    regenerateCDJs?.();

    setVal("numShowRunners", String(maxRunner));
    regenerateShowRunners?.();

    setVal("numMerchVendors", String(maxVendor));
    regenerateVendors?.();

    setVal("numOtherCategories", String(maxOther));
    regenerateOtherCategories?.();

    // Create Other items counts before setting item values
    for (let c = 1; c <= maxOther; c++) {
      setVal(`otherCategoryCount_${c}`, String(otherCounts[c] || 0));
      regenerateOtherItems?.(c);
    }

    // PASS 2: assign values
    let currentOtherCategory = 0;

    for (const [label, value] of pairs) {
      if (label === "Show Title") { setVal("showTitle", value); continue; }
      if (label === "Show Date") { setVal("showDate", value); continue; }

      if (label.startsWith("Headliner ")) {
        const idx = parseInt(label.split(" ")[1], 10);
        if (label.includes("Fee")) setVal(`headliner_fee_${idx}`, value);
        if (label.includes("Hotel")) setVal(`headliner_hotel_${idx}`, value);
        if (label.includes("Rider")) setVal(`headliner_rider_${idx}`, value);
        if (label.includes("Name")) setVal(`headliner_name_${idx}`, value);
        continue;
      }

      if (label === "Direct Support Fee") { setVal("directSupport", value); continue; }

      if (label.startsWith("Local DJ")) {
        const idx = parseInt(label.split(" ")[2], 10);
        if (label.includes("Name")) setVal(`localDJ_name_${idx}`, value);
        if (label.includes("Fee")) setVal(`localDJ_fee_${idx}`, value);
        continue;
      }

      if (label === "VJ Fee") { setVal("vjFee", value); continue; }
      if (label === "Venue") { setVal("venue", value); continue; }
      if (label === "LED Wall") { setVal("ledWall", value); continue; }
      if (label === "Lights") { setVal("lights", value); continue; }
      if (label === "Lasers") { setVal("lasers", value); continue; }

      if (/^CDJ\s+\d+\s+Fee$/.test(label)) {
        const idx = parseInt(label.split(" ")[1], 10);
        setVal(`cdj_fee_${idx}`, value);
        continue;
      }

      if (label === "Sound") { setVal("sound", value); continue; }
      if (label === "Mixer") { setVal("mixer", value); continue; }
      if (label === "Table") { setVal("table", value); continue; }

      // MARKETING (new split labels)
      if (label === "Facebook Ads XODIA") { setVal("facebookAdsXodia", value); continue; }
      if (label === "Facebook Ads SPACE CAMP HQ") { setVal("facebookAdsSpaceCampHQ", value); continue; }
      if (label === "Instagram Ads XODIA") { setVal("instagramAdsXodia", value); continue; }
      if (label === "Instagram Ads SPACE CAMP HQ") { setVal("instagramAdsSpaceCampHQ", value); continue; }

      // ✅ Physical Flyers import
      if (label === "Physical Flyers") { setVal("physicalFlyers", value); setVal("flyerCost", value); continue; }

      if (label === "Eventbrite Ads") { setVal("eventbriteAds", value); continue; }

      // MARKETING (legacy)
      if (label === "Facebook Ads") { legacyFbAmount = value; continue; }
      if (label === "Facebook Ads Account") { legacyFbAcct = value; continue; }
      if (label === "Instagram Ads") { legacyIgAmount = value; continue; }
      if (label === "Instagram Ads Account") { legacyIgAcct = value; continue; }

      if (label === "Door Staff") { setVal("doorStaff", value); continue; }
      if (label === "Merch Table") { setVal("merchTable", value); continue; }
      if (label === "Transportation") { setVal("transportation", value); continue; }

      if (label.startsWith("Show Runner") && label.includes("Fee")) {
        const idx = parseInt(label.split(" ")[2], 10);
        setVal(`showRunner_fee_${idx}`, value);
        continue;
      }

      if (label.startsWith("Category") && label.includes("Name")) {
        currentOtherCategory = parseInt(label.split(" ")[1], 10);
        setVal(`otherCategoryName_${currentOtherCategory}`, value);
        continue;
      }

      if (label.startsWith("Category") && label.includes("Items")) {
        const c = parseInt(label.split(" ")[1], 10);
        setVal(`otherCategoryCount_${c}`, value);
        regenerateOtherItems?.(c);
        continue;
      }

      if (label.startsWith("Item") && label.includes("Name")) {
        const idx = parseInt(label.split(" ")[1], 10);
        setVal(`otherCategory_${currentOtherCategory}_itemName_${idx}`, value);
        continue;
      }

      if (label.startsWith("Item") && label.includes("Fee")) {
        const idx = parseInt(label.split(" ")[1], 10);
        setVal(`otherCategory_${currentOtherCategory}_itemFee_${idx}`, value);
        continue;
      }

      if (label === "Eventbrite Sales") { setVal("eventbriteSales", value); continue; }
      if (label === "DJ Presales") { setVal("djPresales", value); continue; }
      if (label === "Promo Team") { setVal("promoTeam", value); continue; }
      if (label === "Door Sales") { setVal("doorSales", value); continue; }
      if (label === "Merch Sold") { setVal("merchSold", value); continue; }

      if (label.startsWith("Vendor") && label.includes("Name")) {
        const idx = parseInt(label.split(" ")[1], 10);
        setVal(`merchVendor_name_${idx}`, value);
        continue;
      }

      if (label.startsWith("Vendor") && label.includes("Fee")) {
        const idx = parseInt(label.split(" ")[1], 10);
        setVal(`merchVendor_fee_${idx}`, value);
        continue;
      }
    }

    // Apply legacy marketing into split fields if split inputs exist
    const hasFbSplit = !!document.getElementById("facebookAdsXodia") || !!document.getElementById("facebookAdsSpaceCampHQ");
    const hasIgSplit = !!document.getElementById("instagramAdsXodia") || !!document.getElementById("instagramAdsSpaceCampHQ");

    if (hasFbSplit && legacyFbAmount) {
      if ((legacyFbAcct || "").toUpperCase().includes("SPACE")) {
        setVal("facebookAdsSpaceCampHQ", legacyFbAmount);
      } else {
        setVal("facebookAdsXodia", legacyFbAmount);
      }
    }

    if (hasIgSplit && legacyIgAmount) {
      if ((legacyIgAcct || "").toUpperCase().includes("SPACE")) {
        setVal("instagramAdsSpaceCampHQ", legacyIgAmount);
      } else {
        setVal("instagramAdsXodia", legacyIgAmount);
      }
    }

    updateBudget?.();
  };

  // If passed a File, read it; else treat as CSV text
  if (fileOrText && typeof File !== "undefined" && fileOrText instanceof File) {
    const reader = new FileReader();
    reader.onload = (ev) => applyText(ev.target.result);
    reader.readAsText(fileOrText);
  } else {
    applyText(fileOrText);
  }
}

async function copyTextPreview() {
  const text = getPreviewText();
  const status = document.getElementById("copyStatus");

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      // Fallback for older browsers / non-secure contexts
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }

    if (status) {
      status.textContent = "Copied.";
      setTimeout(() => (status.textContent = ""), 1500);
    }
  } catch (err) {
    if (status) status.textContent = "Copy failed.";
    console.error(err);
  }
}

async function downloadChartsPNG(filename) {
  // IMPORTANT: do NOT use window.chartExpenses when charts are declared with top-level `let`
  if (!chartExpenses || !chartSales) {
    alert("Charts are not ready yet. Click Update Chart first.");
    return;
  }

  // Try to force a final render before capture
  try {
    chartExpenses.update("none");
    chartSales.update("none");
  } catch (e) {
    // ignore
  }

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  const expURL = (typeof chartExpenses.toBase64Image === "function")
    ? chartExpenses.toBase64Image()
    : chartExpenses.canvas.toDataURL("image/png");

  const salesURL = (typeof chartSales.toBase64Image === "function")
    ? chartSales.toBase64Image()
    : chartSales.canvas.toDataURL("image/png");

  const [expImg, salesImg] = await Promise.all([loadImage(expURL), loadImage(salesURL)]);

  // Optional: auto filename from Show Title / Date if not provided
  if (!filename) {
    const title = makeSafeFilename(document.getElementById("showTitle")?.value || "UNTITLED EVENT");
    const date  = makeSafeFilename(document.getElementById("showDate")?.value || "");
    filename = `${title}${date ? "_" + date : ""}_charts.png`;
  }

  const pad = 24;
  const gap = 24;

  const outW = Math.max(expImg.width, salesImg.width) + pad * 2;
  const outH = expImg.height + salesImg.height + pad * 2 + gap;

  const out = document.createElement("canvas");
  out.width = outW;
  out.height = outH;

  const ctx = out.getContext("2d");

  // White background
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, outW, outH);

  // Draw expenses (centered)
  let y = pad;
  ctx.drawImage(expImg, (outW - expImg.width) / 2, y);

  // Draw sales beneath
  y += expImg.height + gap;
  ctx.drawImage(salesImg, (outW - salesImg.width) / 2, y);

  out.toBlob((blob) => {
    if (!blob) {
      const a = document.createElement("a");
      a.href = out.toDataURL("image/png");
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }, "image/png");
}

function downloadAll() {
  // Note: some browsers may prompt to allow multiple downloads.
  if (typeof updateBudget === "function") updateBudget();

  downloadCSV();
  exportTextPreviewTxt();

  // Small delay helps ensure the canvases are fully painted before capture
  setTimeout(() => {
    downloadChartsPNG();
  }, 150);
}

</script>
