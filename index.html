<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Tools Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0px;
            text-align: center;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-weight: bold;
            font-size: 4em;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2em;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        button {
            background: #228B22;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        button:hover {
            background: #1e7a1e;
        }

        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <h1>Event Tools Dashboard</h1>
    <p>Select a tool below and it will open full-page.</p>

    <div class="button-container">
        <button onclick="goToTool('sheet')">To Do List</button>
    </div>
    <div class="button-container">
        <button onclick="goToTool('master')">Master Sheet</button>
    </div>
    <div class="button-container">
        <button onclick="goToTool('guest_list')">Guest List Generator</button>
    </div>
    <div class="button-container">
        <button onclick="goToTool('set_times')">Set Times Generator</button>
    </div>
    <div class="contest">
        <button onclick="goToTool('contest')">Contest Wheel</button>
    </div>
    <div class="button-container">
        <button onclick="goToTool('pdf')">Offer PDF Generator</button>
    </div>
    <div class="button-container">
        <button onclick="goToTool('budget')">Budget Calculator</button>
    </div>
    <div class="button-container">
        <button onclick="goToTool('invoice')">Invoice Generator</button>
    </div>
    <div class="button-container">
        <button onclick="goToTool('ros')">ROS Email Generator</button>
    </div>

    <script>
        function goToTool(tool) {
            const base = "https://raideniv.github.io/event-tools/";
            const base2 = "https://budgetapp-production-c754.up.railway.app/";

            if (tool === "sheet") {
                window.location.href = base + "google_sheet.html";
            }
            else if (tool === "master") {
                window.location.href = base + "master_sheet.html";
            }
            else if (tool === "guest_list") {
                window.location.href = base + "guest_list.html";
            }  
            else if (tool === "pdf") {
                window.location.href = base + "pdf_maker.html";
            } 
            else if (tool === "budget") {
                window.location.href = base2;
            }
            else if (tool === "invoice") {
                window.location.href = base + "invoice_generator.html";
            }
            else if (tool === "set_times") {
                window.location.href = base + "set_times.html";
            }
            else if (tool === "contest") {
                window.location.href = base + "contest_wheel.html";
            }
            else if (tool === "ros") {
                window.location.href = base + "ros_generator.html";
            }  
        }
    </script>

</body>
</html>
